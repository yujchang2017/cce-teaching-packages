<script>
(() => {
  'use strict';
  const TOTAL_LEVELS = 5;

  /* ---- Score ---- */
  let _score = 0;
  const scoreEl = document.getElementById('score');
  const awarded = {};
  function awardOnce(key, pts) {
    if (awarded[key]) return;
    awarded[key] = true;
    _score += pts;
    scoreEl.textContent = _score;
  }

  /* ---- Navigation ---- */
  function goto(n) {
    document.querySelectorAll('section[id^="level-"], section#finale').forEach(s => s.classList.add('hidden-screen'));
    const target = n === 'final' ? document.getElementById('level-final') : document.getElementById('level-' + n);
    if (target) target.classList.remove('hidden-screen');
    for (let i = 1; i <= TOTAL_LEVELS; i++) {
      const d = document.getElementById('dot-' + i);
      if (!d) continue;
      if (i < n) { d.classList.remove('active'); d.classList.add('done'); }
      else if (i === n) { d.classList.add('active'); d.classList.remove('done'); }
      else { d.classList.remove('active', 'done'); }
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('.btn-back').forEach(b => {
    b.addEventListener('click', () => goto(Number(b.dataset.back)));
  });

  /* ---- Confetti ---- */
  function confetti() {
    for (let i = 0; i < 35; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = ['#f59e0b','#10b981','#6366f1','#ec4899','#0ea5e9'][Math.floor(Math.random() * 5)];
      c.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2800);
    }
  }

  /* ---- Shuffle ---- */
  function shuffleChildren(parent) {
    const items = Array.from(parent.children);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      parent.appendChild(items[j]);
      items.splice(j, 1);
    }
  }

  /* ---- renderOpts ---- */
  function renderOpts(wrap, items, name, onPick) {
    wrap.innerHTML = '';
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    shuffled.forEach(item => {
      const d = document.createElement('div');
      d.className = 'opt';
      d.textContent = item.text;
      d.addEventListener('click', () => {
        wrap.querySelectorAll('.opt').forEach(o => o.classList.remove('sel', 'correct', 'wrong'));
        d.classList.add('sel');
        onPick(item, d, wrap);
      });
      wrap.appendChild(d);
    });
  }

  /* ===================== T1: Drag-drop match ===================== */
  shuffleChildren(document.getElementById('items-box-1'));
  shuffleChildren(document.getElementById('zones-box-1'));

  let t1Correct = 0;
  const T1_TOTAL = 4;

  document.querySelectorAll('#items-box-1 .drag-item').forEach(it => {
    it.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', it.dataset.match);
      it.classList.add('dragging');
      window._t1drag = it;
    });
    it.addEventListener('dragend', () => it.classList.remove('dragging'));
  });

  document.querySelectorAll('#zones-box-1 .drop-zone').forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => {
      e.preventDefault(); z.classList.remove('over');
      const val = e.dataTransfer.getData('text/plain');
      if (z.dataset.accept === val) {
        const label = document.createElement('span');
        label.className = 'text-emerald-700 font-bold text-xs ml-1';
        label.textContent = ' ??' + window._t1drag.textContent;
        z.appendChild(label);
        window._t1drag.remove();
        t1Correct++;
        z.classList.add('pop');
        if (t1Correct === T1_TOTAL) {
          document.getElementById('feedback-1').innerHTML = '<p class="text-emerald-600 font-bold">?????????園?撠迤蝣綽?</p>';
          document.getElementById('btn-next-1').disabled = false;
          awardOnce('t1', 10);
        }
      } else {
        z.classList.add('shake');
        setTimeout(() => z.classList.remove('shake'), 400);
      }
    });
  });

  document.getElementById('btn-next-1').addEventListener('click', () => goto(2));
