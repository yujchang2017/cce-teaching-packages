<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  const navCurrent = document.querySelector('.nav-current');
  const navTotal = document.querySelector('.nav-total');
  navTotal.textContent = slides.length;
  let current = 0;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && e.intersectionRatio > 0.5) {
        current = slides.indexOf(e.target);
        navCurrent.textContent = current + 1;
      }
    });
  }, { threshold: [0.5] });
  slides.forEach(s => obs.observe(s));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); const next = Math.min(current + 1, slides.length - 1); slides[next].scrollIntoView({ behavior: 'smooth' }); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); const prev = Math.max(current - 1, 0); slides[prev].scrollIntoView({ behavior: 'smooth' }); }
  });
  if (location.hash) { const target = document.querySelector(location.hash); if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 100); }
</script>
