  const updateDots = ()=>{
    for(let i=1;i<=TOTAL_LEVELS;i++){
      const d = document.getElementById('dot-'+i);

      if(i < S.current) d.classList.add('done');
      else if(i === S.current) d.classList.add('active');
    }
  };

  const goto = (n)=>{
    document.querySelectorAll('section[id^="level-"]').forEach(s=>s.classList.add('hidden-screen'));
    S.current = n;
    const next = document.getElementById('level-'+n) || document.getElementById('level-final');
    next.classList.remove('hidden-screen');
    if(next.id === 'level-final'){
      for(let i=1;i<=TOTAL_LEVELS;i++){ const d=document.getElementById('dot-'+i); if(d){d.classList.remove('active');d.classList.add('done');} }
      document.getElementById('final-score').textContent = S.score;
    } else {
      updateDots();
    }
    window.scrollTo({top:0,behavior:'smooth'});
  };

  document.querySelectorAll('.btn-back').forEach(b=>{
    b.onclick = ()=>goto(parseInt(b.dataset.back,10));

      const el=document.createElement('div');
      el.className='confetti';
      el.style.left=Math.random()*100+'vw';
      el.style.background=colors[i%colors.length];
      el.style.animationDelay=(Math.random()*0.6)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2500);
    }
  };

  const shuffleChildren = (parent)=>{
    const kids = Array.from(parent.children);
    for(let i=kids.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      parent.appendChild(kids[j]);

  // ===== Task 1: Drag match =====

    });

      z.addEventListener('dragover', e=>{ e.preventDefault(); z.classList.add('over');});

        e.preventDefault(); z.classList.remove('over');

    } else {
      fb21.textContent='??甇?圾??B??銵冽?璆＊蝷箔?憿?撣?Ｗ儔?望??憭望??訾???憿航?撌株???;
