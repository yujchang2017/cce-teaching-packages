function awardOnce(key, pts){ if(!awarded[key]){ awarded[key]=true; updateScore(pts); } }
function updateScore(add){ score += add; document.getElementById('score').textContent = score; }
function unlockBadge(i){ const el=document.getElementById('b'+i); if(el) el.classList.remove('badge-lock'); }
function markDone(i){ const d=document.getElementById('dot-'+i); if(d){d.classList.remove('active'); d.classList.add('done');} }

function gotoLevel(n){
  document.querySelectorAll('section[id^="level-"]').forEach(s=>s.classList.add('hidden-screen'));
  currentLevel = n;
  const next = document.getElementById('level-'+n) || document.getElementById('level-final');
  next.classList.remove('hidden-screen');
  if(next.id === 'level-final'){
    for(let i=1;i<=TOTAL;i++){ const d=document.getElementById('dot-'+i); if(d){d.classList.remove('active');d.classList.add('done');} }
    document.getElementById('final-score').textContent = score;
  } else {
    for(let i=1;i<=TOTAL;i++){
      const d=document.getElementById('dot-'+i); if(!d) continue;
      d.classList.remove('active','done');
      if(i<n) d.classList.add('done');
      else if(i===n) d.classList.add('active');
    }
  }
  next.scrollIntoView({behavior:'smooth'});
}

  const kids = Array.from(parent.children);

}

    projPicked = r.value;
    document.querySelectorAll('#proj-opts .opt').forEach(o=>o.classList.remove('sel'));

    document.getElementById('proj-problem').textContent = d.problem;

    const kpiBox = document.getElementById('kpi-opts');
    kpiBox.innerHTML = '';
    kpiPicked = false;
    d.kpis.forEach(k=>{
      const lbl = document.createElement('label');
      lbl.className='opt';
      lbl.innerHTML = `<input type="radio" name="kpi"> ${k}`;
      lbl.querySelector('input').onchange = ()=>{
        document.querySelectorAll('#kpi-opts .opt').forEach(o=>o.classList.remove('sel'));
        lbl.classList.add('sel');
        kpiPicked = true;
        checkP();

    });

    checkP();

});

      setter(v);
      wrap.querySelectorAll('.star').forEach(x=>{
        x.classList.toggle('on', parseInt(x.dataset.val,10) <= v);

}
