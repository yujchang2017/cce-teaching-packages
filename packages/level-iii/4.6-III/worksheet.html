          lbl.classList.add('sel');
          actionPicked = true;
          el('action-fb').innerHTML = '<span class="text-indigo-700">??憟賭蜓??蝜潛?銝?甇伐?</span>';
          el('promise-wrap').classList.remove('hidden');
          checkL4ready();
        };
        box.appendChild(lbl);
      });
      wrap.classList.remove('hidden');
      el('promise-wrap').classList.add('hidden');
      checkL4ready();
    };
  });

  document.querySelectorAll('.promise-cb').forEach(cb => {
    cb.onchange = () => {
      promiseCount = document.querySelectorAll('.promise-cb:checked').length;
      const fb = el('promise-fb');
      if (promiseCount < 2) fb.textContent = `撌脤 ${promiseCount}/4嚗??喳???2 ????`;
      else fb.textContent = `?訾? ${promiseCount} ?隢橘???菜蝎曄?嚗;
      checkL4ready();
    };
  });

  el('btn-next-4').onclick = () => {
    awardOnce('L4', 20);
    confetti();
    showFinal();
  };

  /* =====================================================
     Final screen
     ===================================================== */
  function showFinal() {
    gotoLevel(TOTAL_LEVELS + 1);
    el('final-score').textContent = S.score;
    const box = el('badges');
    box.innerHTML = '';
    const earned = [];
    if (S.awarded['L1']) earned.push('? 瘨??撣?);
    if (S.awarded['L2-q1'] || S.awarded['L2-q2']) earned.push('?? ?豢?霈??');
    if (S.awarded['L3']) earned.push('?? 撉函???');
    if (S.awarded['L4']) earned.push('?? ??菜??);
    if (earned.length === 0) earned.push('?儭?儭??撠??);
    earned.forEach(b => {
      const chip = document.createElement('span');
      chip.className = 'bg-indigo-100 border-2 border-indigo-400 rounded-full px-3 py-1 text-sm font-bold pop';
      chip.textContent = b;
      box.appendChild(chip);
    });
    confetti();
  }

  /* =====================================================
     Final reflection (5 pts)
     ===================================================== */
  let starBefore = 0, starAfter = 0, impactPicked = false;

  const setupStars = (wrapId, setter) => {
    const wrap = el(wrapId);
    wrap.querySelectorAll('.star').forEach(s => {
      s.onclick = () => {
        const v = parseInt(s.dataset.val, 10);
        setter(v);
        wrap.querySelectorAll('.star').forEach(x => {
          x.classList.toggle('on', parseInt(x.dataset.val, 10) <= v);
        });
        checkReflect();
      };
    });
  };
  setupStars('stars-before', v => starBefore = v);
  setupStars('stars-after', v => starAfter = v);

  document.querySelectorAll('input[name=impact]').forEach(r => {
    r.onchange = () => {
      impactPicked = true;
      document.querySelectorAll('#impact-opts .opt').forEach(o => o.classList.remove('sel'));
      r.parentElement.classList.add('sel');
      checkReflect();
    };
  });

  function checkReflect() {
    const ok = starBefore > 0 && starAfter > 0 && impactPicked;
    const fb = el('reflect-fb');
    if (ok) {
      fb.innerHTML = '<span class="text-indigo-700 font-bold">??????+5 ????</span>';
      awardOnce('FINAL', 5);
      el('final-score').textContent = S.score;
    } else {
      fb.textContent = '隢???憿???????鈭圾摨?+ ?訾??蔣?選?';
    }
  }
})();
</script>
