    gotoLevel(TOTAL_LEVELS + 1);
    el('final-score').textContent = S.score;
    const box = el('badges');
    box.innerHTML = '';
    const earned = [];
    if (S.awarded['L1']) earned.push('?圾 瘥臬??儘?犖');
    if (S.awarded['L2-q1'] || S.awarded['L2-q2']) earned.push('?? CO??閫撖振');
    if (S.awarded['L3']) earned.push('?? 瘥臬??????);
    if (S.awarded['L4']) earned.push('? 銵?撖西???);
    if (earned.length === 0) earned.push('?儭?儭?蝣喳??);
    earned.forEach(b => {
      const chip = document.createElement('span');
      chip.className = 'bg-emerald-100 border-2 border-emerald-400 rounded-full px-3 py-1 text-sm font-bold pop';
      chip.textContent = b;
      box.appendChild(chip);
    });
    confetti();
  }

  /* =====================================================
     Final reflection (5 pts)
     ===================================================== */
  let starBefore = 0, starAfter = 0, impactPicked = false;

  const setupStars = (wrapId, setter) => {
    const wrap = el(wrapId);
    wrap.querySelectorAll('.star').forEach(s => {
      s.onclick = () => {
        const v = parseInt(s.dataset.val, 10);
        setter(v);
        wrap.querySelectorAll('.star').forEach(x => {
          x.classList.toggle('on', parseInt(x.dataset.val, 10) <= v);
        });
        checkReflect();
      };
    });
  };
  setupStars('stars-before', v => starBefore = v);
  setupStars('stars-after', v => starAfter = v);

  document.querySelectorAll('input[name=impact]').forEach(r => {
    r.onchange = () => {
      impactPicked = true;
      document.querySelectorAll('#impact-opts .opt').forEach(o => o.classList.remove('sel'));
      r.parentElement.classList.add('sel');
      checkReflect();
    };
  });

  function checkReflect() {
    const ok = starBefore > 0 && starAfter > 0 && impactPicked;
    const fb = el('reflect-fb');
    if (ok) {
      fb.innerHTML = '<span class="text-emerald-700 font-bold">??????+5 ????</span>';
      awardOnce('FINAL', 5);
      el('final-score').textContent = S.score;
    } else {
      fb.textContent = '隢???憿???????鈭圾摨?+ ?啗情?瘛梁??嚗?;
    }
  }
})();
</script>
