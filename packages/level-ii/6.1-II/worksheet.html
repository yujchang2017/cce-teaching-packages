<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大自然小朋友 — 小松鼠嚕嚕的森林探險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #d1fae5 0%, #fef3c7 60%, #bfdbfe 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bef264)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠嚕嚕 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 尾巴 -->
      <path d="M 15 60 Q 0 50 5 30 Q 10 10 30 25 Q 25 45 30 60 Z" fill="#b45309"/>
      <!-- 身體 -->
      <ellipse cx="50" cy="60" rx="28" ry="25" fill="#d97706"/>
      <!-- 頭 -->
      <circle cx="50" cy="35" r="22" fill="#d97706"/>
      <!-- 耳朵 -->
      <path d="M 35 20 Q 38 5 48 15 Z" fill="#b45309"/>
      <path d="M 65 20 Q 62 5 52 15 Z" fill="#b45309"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="35" r="3.5" fill="black"/>
      <circle cx="58" cy="35" r="3.5" fill="black"/>
      <circle cx="43" cy="34" r="1.2" fill="white"/>
      <circle cx="59" cy="34" r="1.2" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="42" rx="3" ry="2" fill="black"/>
      <!-- 嘴巴 -->
      <path d="M 45 46 Q 50 52 55 46" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 肚子 -->
      <ellipse cx="50" cy="65" rx="14" ry="12" fill="#fbbf24"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-green-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>小松鼠嚕嚕的森林探險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">嗨！我是嚕嚕！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-amber-500 font-bold">大自然小朋友</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：大自然在哪裡（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">嚕嚕：哪一個是大自然？點一點！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-amber-600 mb-2">找找看大自然的朋友...</div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6" id="l1-options">
      <!-- 動態填入 -->
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：感官拖拉配對 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">嚕嚕：把大自然拖到對的感官！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-sky-300" data-sense="ear">
        <div class="text-6xl">👂</div>
        <div class="text-2xl font-bold text-sky-600">聽</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-pink-300" data-sense="nose">
        <div class="text-6xl">👃</div>
        <div class="text-2xl font-bold text-pink-600">聞</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：保護大自然 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">嚕嚕：選出 3 個保護大自然的好事！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">你是超棒的大自然小朋友！</h1>
    <p class="text-2xl text-gray-700 mt-4">嚕嚕送你一枚 <span class="text-amber-500 font-bold">森林金葉徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">週末和爸爸媽媽走 5 分鐘到附近的公園，<br/><span class="text-amber-600 font-bold">找 3 種不同形狀的葉子</span>，拍張合照！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#bef264','#fbbf24','#34d399','#60a5fa','#f472b6'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：點擊配對（找出大自然物） ============
  const L1_ITEMS = [
    { id: 'tree',   label: '大樹',     emoji: '🌳', isNature: true  },
    { id: 'car',    label: '汽車',     emoji: '🚗', isNature: false },
    { id: 'bird',   label: '小鳥',     emoji: '🐦', isNature: true  },
    { id: 'phone',  label: '手機',     emoji: '📱', isNature: false }
  ];
  let l1Correct = 0;

  function loadLevel1() {
    l1Correct = 0;
    const box = document.getElementById('l1-options');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'big-btn bg-green-200 hover:bg-green-100 flex flex-col items-center';
      b.innerHTML = `<div class="text-6xl">${it.emoji}</div><div class="text-xl mt-1 font-bold text-green-800">${it.label}</div>`;
      b.dataset.nature = it.isNature ? '1' : '0';
      b.onclick = () => l1Pick(b, it);
      box.appendChild(b);
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function l1Pick(btn, it) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (it.isNature) {
      fb.textContent = '🎉 答對啦！這是大自然！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      btn.disabled = true;
      btn.classList.add('ring-4','ring-green-400','bg-green-100');
      btn.classList.remove('bg-green-200');
      l1Correct++;
      confetti();
      if (l1Correct >= 2) {
        setTimeout(() => {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }, 1800);
      } else {
        fb.textContent = '🎉 找到 1 個！再找另一個大自然朋友～';
      }
    } else {
      fb.textContent = '😊 想一想，這個是大自然嗎？再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉（感官配對） ============
  const L2_ITEMS = [
    { id: 'birdsong', label: '鳥叫',     sense: 'ear',  emoji: '🎵' },
    { id: 'wind',     label: '風聲',     sense: 'ear',  emoji: '💨' },
    { id: 'flower',   label: '花香',     sense: 'nose', emoji: '🌸' },
    { id: 'grass',    label: '青草味',   sense: 'nose', emoji: '🌿' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.sense = it.sense;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.sense === z.dataset.sense) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！感官大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再試試看！這個是用耳朵聽還是鼻子聞呢？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選（保護自然） ============
  const L3_ITEMS = [
    { id: 'pickup', label: '撿垃圾',   emoji: '🧹', correct: true  },
    { id: 'water',  label: '關水龍頭', emoji: '💧', correct: true  },
    { id: 'gentle', label: '對小蟲溫柔', emoji: '🐛', correct: true  },
    { id: 'pluck',  label: '亂摘花',   emoji: '🌺', correct: false },
    { id: 'chase',  label: '追小貓',   emoji: '😾', correct: false },
    { id: 'litter', label: '丟垃圾',   emoji: '🗑️', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-emerald-100 hover:bg-emerald-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-emerald-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-emerald-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你是保護大自然的小英雄！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：哪些是對大自然好的事？選 3 個～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
