<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小小生態守護者 — 海龜咕嚕咕嚕的大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #d1fae5 0%, #dbeafe 50%, #fef3c7 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .swim { animation: swim 3s ease-in-out infinite; }
  @keyframes swim { 0%,100%{transform:translateX(0) rotate(0)} 50%{transform:translateX(10px) rotate(5deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小海龜咕嚕咕嚕 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="turtle">
      <!-- 龜殼 -->
      <ellipse cx="50" cy="55" rx="38" ry="28" fill="#16a34a"/>
      <path d="M 25 55 Q 50 45 75 55" stroke="#166534" stroke-width="2" fill="none"/>
      <circle cx="40" cy="50" r="4" fill="#166534"/>
      <circle cx="55" cy="48" r="4" fill="#166534"/>
      <circle cx="62" cy="58" r="4" fill="#166534"/>
      <circle cx="44" cy="62" r="4" fill="#166534"/>
      <!-- 頭 -->
      <circle cx="78" cy="48" r="12" fill="#22c55e"/>
      <circle cx="82" cy="45" r="2.5" fill="black"/>
      <path d="M 80 52 Q 85 54 87 51" stroke="black" stroke-width="1.5" fill="none"/>
      <!-- 四肢 -->
      <ellipse cx="20" cy="42" rx="8" ry="5" fill="#22c55e" transform="rotate(-30 20 42)"/>
      <ellipse cx="20" cy="68" rx="8" ry="5" fill="#22c55e" transform="rotate(30 20 68)"/>
      <ellipse cx="72" cy="75" rx="7" ry="4" fill="#22c55e" transform="rotate(20 72 75)"/>
      <!-- 小帽子（探險帽） -->
      <ellipse cx="78" cy="36" rx="14" ry="3" fill="#b45309"/>
      <path d="M 72 36 Q 78 28 84 36" fill="#d97706"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-green-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#turtle"/></svg>
    <span>咕嚕咕嚕的大冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#turtle"/></svg>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">嗨！我是咕嚕咕嚕！</h1>
    <p class="text-2xl text-gray-700 mt-4">要不要跟我一起當<span class="text-orange-500 font-bold">小小生態守護者</span>？</p>
    <p class="text-xl text-gray-500 mt-2">一起闖 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：動物住哪裡（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#turtle"/></svg>
      <p class="text-2xl font-bold text-green-700">咕嚕：這位朋友住哪裡？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-5xl mb-2" id="l1-animal">🐿️</div>
      <div class="text-2xl font-bold text-pink-600" id="l1-label">松鼠</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <button class="big-btn bg-green-200 hover:bg-green-100" data-habitat="forest" onclick="l1Pick(this)">
        <div class="text-5xl">🌳</div>
        <div class="text-lg font-bold text-green-800">森林</div>
      </button>
      <button class="big-btn bg-blue-200 hover:bg-blue-100" data-habitat="ocean" onclick="l1Pick(this)">
        <div class="text-5xl">🌊</div>
        <div class="text-lg font-bold text-blue-800">海洋</div>
      </button>
      <button class="big-btn bg-yellow-200 hover:bg-yellow-100" data-habitat="pond" onclick="l1Pick(this)">
        <div class="text-5xl">💧</div>
        <div class="text-lg font-bold text-yellow-800">池塘</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <p id="l1-count" class="text-lg text-center mt-2 text-gray-500">第 <span id="l1-step">1</span> / 3 題</p>
  </section>

  <!-- 關卡 2：食物鏈拖拉 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#turtle"/></svg>
      <p class="text-2xl font-bold text-green-700">咕嚕：誰吃誰？把牠們排好！</p>
    </div>
    <p class="text-xl text-center text-gray-600">把下面的圖拖到正確位置（太陽→樹→蟲→鳥）</p>

    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>

    <div class="grid grid-cols-4 gap-2 mt-6">
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-yellow-400" data-order="1">
        <div class="text-xs text-gray-500">①</div>
        <div class="text-lg font-bold text-yellow-700">給能量的</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-order="2">
        <div class="text-xs text-gray-500">②</div>
        <div class="text-lg font-bold text-green-700">會長葉的</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-orange-400" data-order="3">
        <div class="text-xs text-gray-500">③</div>
        <div class="text-lg font-bold text-orange-700">吃葉子</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-purple-400" data-order="4">
        <div class="text-xs text-gray-500">④</div>
        <div class="text-lg font-bold text-purple-700">吃蟲蟲</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：好鄰居的選擇（照顧自然） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#turtle"/></svg>
      <p class="text-2xl font-bold text-green-700">咕嚕：幫我選出 3 個「照顧自然」的好行動！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce swim"><use href="#turtle"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">你是超棒的生態守護者！</h1>
    <p class="text-2xl text-gray-700 mt-4">咕嚕送你一枚 <span class="text-orange-500 font-bold">金色守護者徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">這個週末，和爸爸媽媽一起去公園，<br/><span class="text-orange-600 font-bold">找 5 種植物、3 種動物</span>，拍照或畫下來！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Step: 0, l1Correct: 0 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#16a34a','#f472b6','#34d399','#60a5fa','#f97316','#fbbf24'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：動物住哪裡 ============
  const L1_ANIMALS = [
    { emoji: '🐿️', name: '松鼠',   habitat: 'forest' },
    { emoji: '🐠', name: '小丑魚', habitat: 'ocean' },
    { emoji: '🐸', name: '青蛙',   habitat: 'pond' }
  ];

  function loadLevel1() {
    STATE.l1Step = 0;
    STATE.l1Correct = 0;
    nextL1Question();
  }

  function nextL1Question() {
    if (STATE.l1Step >= L1_ANIMALS.length) {
      // 過關
      STATE.level = 2;
      drawProgress();
      loadLevel2();
      show('level2');
      return;
    }
    const a = L1_ANIMALS[STATE.l1Step];
    document.getElementById('l1-animal').textContent = a.emoji;
    document.getElementById('l1-label').textContent = a.name;
    document.getElementById('l1-step').textContent = STATE.l1Step + 1;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-habitat]').forEach(b => {
      b.disabled = false;
      b.classList.remove('wiggle');
    });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    const target = L1_ANIMALS[STATE.l1Step];
    fb.classList.remove('hide');
    if (btn.dataset.habitat === target.habitat) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      STATE.l1Correct++;
      document.querySelectorAll('#level1 button[data-habitat]').forEach(b => b.disabled = true);
      confetti();
      setTimeout(() => {
        STATE.l1Step++;
        nextL1Question();
      }, 1400);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：食物鏈拖拉 ============
  const L2_ITEMS = [
    { id: 'sun',  label: '太陽', order: 1, emoji: '☀️' },
    { id: 'tree', label: '大樹', order: 2, emoji: '🌳' },
    { id: 'bug',  label: '毛毛蟲', order: 3, emoji: '🐛' },
    { id: 'bird', label: '小鳥', order: 4, emoji: '🐦' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.order = it.order;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.order === z.dataset.order) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！食物鏈達人！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想～太陽先給能量，再來才是樹～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：照顧自然的選擇 ============
  const L3_ITEMS = [
    { id: 'pickup',  label: '撿垃圾',    emoji: '🗑️', correct: true  },
    { id: 'water',   label: '關水龍頭',  emoji: '🚰', correct: true  },
    { id: 'bottle',  label: '帶水壺',    emoji: '🍶', correct: true  },
    { id: 'pluck',   label: '摘花',      emoji: '🌸', correct: false },
    { id: 'catch',   label: '抓蝴蝶',    emoji: '🦋', correct: false },
    { id: 'step',    label: '踩草地',    emoji: '🌱', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你真的是守護者！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：摘花、抓蝴蝶會讓牠們傷心～選 3 個愛護自然的！';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
