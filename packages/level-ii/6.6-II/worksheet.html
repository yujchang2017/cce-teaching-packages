<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小農夫米米的永續飲食冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef9c3 0%, #fed7aa 50%, #fecdd3 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fde68a)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小農夫米米（小兔子戴草帽） SVG 可重用 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mimi">
      <!-- 身體 -->
      <circle cx="50" cy="60" r="32" fill="#fde68a"/>
      <!-- 兔耳朵 -->
      <ellipse cx="38" cy="18" rx="7" ry="18" fill="#fde68a"/>
      <ellipse cx="62" cy="18" rx="7" ry="18" fill="#fde68a"/>
      <ellipse cx="38" cy="20" rx="3" ry="12" fill="#fecaca"/>
      <ellipse cx="62" cy="20" rx="3" ry="12" fill="#fecaca"/>
      <!-- 草帽 -->
      <ellipse cx="50" cy="36" rx="28" ry="6" fill="#a16207"/>
      <ellipse cx="50" cy="30" rx="14" ry="10" fill="#ca8a04"/>
      <rect x="36" y="34" width="28" height="3" fill="#eab308"/>
      <!-- 眼睛 -->
      <circle cx="40" cy="55" r="3" fill="black"/>
      <circle cx="60" cy="55" r="3" fill="black"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="65" rx="3" ry="2" fill="#f472b6"/>
      <!-- 嘴巴 -->
      <path d="M 44 72 Q 50 78 56 72" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <circle cx="32" cy="66" r="4" fill="#fca5a5" opacity="0.6"/>
      <circle cx="68" cy="66" r="4" fill="#fca5a5" opacity="0.6"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#mimi"/></svg>
    <span>小農夫米米的冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mimi"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-700 mt-4">嗨！我是米米！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天跟我一起當<span class="text-green-600 font-bold">小農夫</span>！</p>
    <p class="text-xl text-gray-500 mt-2">3 個彩虹小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：彩虹餐盤點點看 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <p class="text-2xl font-bold text-amber-700">米米：點出<span class="text-pink-500">這個顏色</span>的蔬果！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-3xl font-extrabold mb-2" id="l1-color-hint">紅色</div>
      <svg id="l1-scene" width="120" height="120" viewBox="0 0 100 100" class="mx-auto">
        <circle cx="50" cy="50" r="40" fill="#ef4444"/>
      </svg>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6" id="l1-options">
      <!-- 動態填充 -->
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：在地 vs 遠方（拖拉） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <p class="text-2xl font-bold text-amber-700">米米：把食物放到家！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（拖拉或點一下，再點目的地）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-origin="local">
        <div class="text-6xl">🏝️</div>
        <div class="text-2xl font-bold text-green-700">臺灣</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-sky-400" data-origin="far">
        <div class="text-6xl">✈️</div>
        <div class="text-2xl font-bold text-sky-700">遠方</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：剛剛好便當 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <p class="text-2xl font-bold text-amber-700">米米：幫我裝「剛剛好」便當！</p>
    </div>
    <p class="text-xl text-center text-gray-600">選 <span class="text-pink-500 font-bold">3 個</span>彩虹蔬果 🌈</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mimi"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-700 mt-4">你是超棒的小農夫！</h1>
    <p class="text-2xl text-gray-700 mt-4">米米送你<span class="text-pink-500 font-bold">彩虹徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">跟爸爸媽媽去<span class="text-green-600 font-bold">菜市場</span>，<br/>找 3 種<span class="text-pink-600 font-bold">臺灣種的蔬果</span>！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Target: null };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#a855f7','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：彩虹顏色配對 ============
  const L1_FOODS = [
    { name: '番茄',   color: 'red',    fill: '#ef4444', emoji: '🍅' },
    { name: '玉米',   color: 'yellow', fill: '#eab308', emoji: '🌽' },
    { name: '青菜',   color: 'green',  fill: '#22c55e', emoji: '🥬' },
    { name: '葡萄',   color: 'purple', fill: '#a855f7', emoji: '🍇' },
    { name: '白蘿蔔', color: 'white',  fill: '#f3f4f6', emoji: '🥒' }
  ];
  const COLOR_ZH = { red: '紅色', yellow: '黃色', green: '綠色', purple: '紫色', white: '白色' };

  function loadLevel1() {
    const target = L1_FOODS[Math.floor(Math.random()*L1_FOODS.length)];
    STATE.l1Target = target.color;
    document.getElementById('l1-color-hint').textContent = COLOR_ZH[target.color] + ' 的蔬果';
    document.getElementById('l1-color-hint').style.color = target.fill === '#f3f4f6' ? '#6b7280' : target.fill;
    document.getElementById('l1-scene').innerHTML = `<circle cx="50" cy="50" r="38" fill="${target.fill}" stroke="#d1d5db" stroke-width="2"/>`;

    // 取 4 個選項（含正解）
    const pool = L1_FOODS.slice().sort(() => Math.random()-0.5);
    const chosen = [target];
    for (const f of pool) {
      if (chosen.length >= 4) break;
      if (!chosen.includes(f)) chosen.push(f);
    }
    chosen.sort(() => Math.random()-0.5);

    const box = document.getElementById('l1-options');
    box.innerHTML = '';
    chosen.forEach(f => {
      const b = document.createElement('button');
      b.className = 'big-btn bg-amber-100 hover:bg-amber-200';
      b.dataset.ans = f.color;
      b.innerHTML = `<div class="text-5xl">${f.emoji}</div><div class="text-xl mt-1">${f.name}</div>`;
      b.onclick = () => l1Pick(b);
      box.appendChild(b);
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Target) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#l1-options button').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1600);
    } else {
      fb.textContent = '😊 再看看顏色～';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 ============
  const L2_ITEMS = [
    { id: 'watermelon', label: '花蓮西瓜', origin: 'local', emoji: '🍉' },
    { id: 'mango',      label: '臺南芒果', origin: 'local', emoji: '🥭' },
    { id: 'pineapple',  label: '屏東鳳梨', origin: 'local', emoji: '🍍' },
    { id: 'kiwi',       label: '紐西蘭奇異果', origin: 'far', emoji: '🥝' },
    { id: 'cherry',     label: '美國櫻桃', origin: 'far', emoji: '🍒' },
    { id: 'durian',     label: '泰國榴槤', origin: 'far', emoji: '🟤' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-4xl p-3';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.origin = it.origin;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-base text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      d.addEventListener('click', () => selectTouch(d));
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
      z.addEventListener('click', () => {
        if (l2Selected) {
          handleL2Drop(l2Selected, z);
          l2Selected.classList.remove('ring-4','ring-pink-400');
          l2Selected = null;
        }
      });
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.origin === z.dataset.origin) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      src.onclick = null;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！食物地圖大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想，它從哪裡來？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch/click fallback ---
  let l2Selected = null;
  function selectTouch(el) {
    if (!el.draggable) return;
    if (l2Selected && l2Selected !== el) l2Selected.classList.remove('ring-4','ring-pink-400');
    if (l2Selected === el) {
      el.classList.remove('ring-4','ring-pink-400');
      l2Selected = null;
    } else {
      l2Selected = el;
      el.classList.add('ring-4','ring-pink-400');
    }
  }
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    // 讓 touch 裝置用「點選 → 點目的地」流程
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
      if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
      l2Selected = null;
    }
  });

  // ============ 關卡 3：選 3 個彩虹蔬果 ============
  const L3_ITEMS = [
    { id: 'tomato',  label: '番茄',   emoji: '🍅', correct: true  },
    { id: 'corn',    label: '玉米',   emoji: '🌽', correct: true  },
    { id: 'veggie',  label: '青菜',   emoji: '🥬', correct: true  },
    { id: 'candy',   label: '糖果',   emoji: '🍬', correct: false },
    { id: 'soda',    label: '汽水',   emoji: '🥤', correct: false },
    { id: 'chips',   label: '洋芋片', emoji: '🍟', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-amber-50 hover:bg-amber-100 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-amber-50');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-amber-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！彩虹便當完成！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 選 3 個蔬果～糖糖不是蔬果喔！';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
