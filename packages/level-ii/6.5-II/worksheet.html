<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>交通工具小偵探 — 小熊嘟嘟的綠色旅行</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #d1fae5 0%, #fef3c7 50%, #ffedd5 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bbf7d0)} }
  .roll { animation: roll 1.5s linear infinite; }
  @keyframes roll { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #bbf7d0 !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小熊嘟嘟 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bear">
      <!-- 小熊頭＋耳朵 -->
      <circle cx="50" cy="50" r="40" fill="#8b5e3c"/>
      <circle cx="25" cy="30" r="12" fill="#8b5e3c"/>
      <circle cx="75" cy="30" r="12" fill="#8b5e3c"/>
      <circle cx="25" cy="30" r="6" fill="#fde68a"/>
      <circle cx="75" cy="30" r="6" fill="#fde68a"/>
      <!-- 安全帽 -->
      <path d="M 20 28 Q 50 5 80 28 L 80 38 L 20 38 Z" fill="#10b981"/>
      <rect x="20" y="36" width="60" height="4" fill="#065f46"/>
      <!-- 眼睛 -->
      <circle cx="40" cy="50" r="4" fill="black"/>
      <circle cx="60" cy="50" r="4" fill="black"/>
      <circle cx="41" cy="49" r="1.5" fill="white"/>
      <circle cx="61" cy="49" r="1.5" fill="white"/>
      <!-- 鼻子嘴巴 -->
      <ellipse cx="50" cy="65" rx="8" ry="6" fill="#fde68a"/>
      <circle cx="50" cy="63" r="3" fill="black"/>
      <path d="M 40 73 Q 50 82 60 73" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-emerald-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#bear"/></svg>
    <span>小熊嘟嘟的綠色旅行</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bear"/></svg>
    <h1 class="text-4xl font-extrabold text-emerald-600 mt-4">嗨！我是嘟嘟！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要和我一起當<span class="text-orange-500 font-bold">交通小偵探</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-emerald-400 hover:bg-emerald-300 text-white mt-6">開始</button>
  </section>

  <!-- 關卡 1：猜猜看是什麼交通工具 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-emerald-700">嘟嘟：這是什麼交通工具？點一點！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-orange-600 mb-2">下面這台是...</div>
      <svg id="l1-scene" width="220" height="200" viewBox="0 0 200 140" class="mx-auto"></svg>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-sky-200 hover:bg-sky-100" data-ans="bike" onclick="l1Pick(this)">
        <div class="text-5xl">🚲</div>
        <div class="text-lg font-bold mt-1">腳踏車</div>
      </button>
      <button class="big-btn bg-sky-200 hover:bg-sky-100" data-ans="bus" onclick="l1Pick(this)">
        <div class="text-5xl">🚌</div>
        <div class="text-lg font-bold mt-1">公車</div>
      </button>
      <button class="big-btn bg-sky-200 hover:bg-sky-100" data-ans="car" onclick="l1Pick(this)">
        <div class="text-5xl">🚗</div>
        <div class="text-lg font-bold mt-1">汽車</div>
      </button>
      <button class="big-btn bg-sky-200 hover:bg-sky-100" data-ans="walk" onclick="l1Pick(this)">
        <div class="text-5xl">👣</div>
        <div class="text-lg font-bold mt-1">走路</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉分類：地球笑 vs 皺眉 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-emerald-700">嘟嘟：地球喜歡誰？把交通工具拖到正確的地球！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-type="green">
        <div class="text-6xl">🌍😊</div>
        <div class="text-2xl font-bold text-green-600">地球開心</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-orange-400" data-type="pollute">
        <div class="text-6xl">🌍😟</div>
        <div class="text-2xl font-bold text-orange-600">地球皺眉</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：公車大力士 — 把人送上公車 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-emerald-700">嘟嘟：幫忙選 3 種對地球好的交通工具！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-emerald-400 hover:bg-emerald-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bear"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-emerald-600 mt-4">你是超棒的交通小偵探！</h1>
    <p class="text-2xl text-gray-700 mt-4">嘟嘟送你一張 <span class="text-orange-500 font-bold">綠色地球守護徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-emerald-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">這個禮拜和爸爸媽媽一起<br/><span class="text-orange-600 font-bold">走路或騎腳踏車一次</span>，回來告訴嘟嘟你看到什麼！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-emerald-400 hover:bg-emerald-300 text-white mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Ans: 'bike' };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#10b981','#f472b6','#fbbf24','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：點擊配對（根據 SVG 猜交通工具）============
  function loadLevel1() {
    const scenes = [
      { key: 'bike', svg: '<circle cx="60" cy="100" r="22" fill="none" stroke="#1f2937" stroke-width="5"/><circle cx="140" cy="100" r="22" fill="none" stroke="#1f2937" stroke-width="5"/><line x1="60" y1="100" x2="100" y2="60" stroke="#10b981" stroke-width="5"/><line x1="100" y1="60" x2="140" y2="100" stroke="#10b981" stroke-width="5"/><line x1="100" y1="60" x2="100" y2="100" stroke="#10b981" stroke-width="5"/><line x1="60" y1="100" x2="100" y2="100" stroke="#10b981" stroke-width="5"/><rect x="95" y="45" width="20" height="6" fill="#f97316"/>' },
      { key: 'bus',  svg: '<rect x="30" y="40" width="140" height="60" rx="10" fill="#fbbf24" stroke="#78350f" stroke-width="3"/><rect x="40" y="50" width="25" height="25" fill="#bae6fd"/><rect x="75" y="50" width="25" height="25" fill="#bae6fd"/><rect x="110" y="50" width="25" height="25" fill="#bae6fd"/><rect x="145" y="50" width="18" height="25" fill="#bae6fd"/><circle cx="60" cy="110" r="14" fill="#1f2937"/><circle cx="140" cy="110" r="14" fill="#1f2937"/><circle cx="60" cy="110" r="6" fill="#9ca3af"/><circle cx="140" cy="110" r="6" fill="#9ca3af"/>' },
      { key: 'car',  svg: '<path d="M 30 90 L 60 60 L 140 60 L 170 90 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/><rect x="30" y="85" width="140" height="25" rx="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/><rect x="70" y="65" width="28" height="20" fill="#bae6fd"/><rect x="104" y="65" width="28" height="20" fill="#bae6fd"/><circle cx="60" cy="115" r="12" fill="#1f2937"/><circle cx="140" cy="115" r="12" fill="#1f2937"/><ellipse cx="20" cy="82" rx="12" ry="6" fill="#9ca3af" opacity="0.7"/>' },
      { key: 'walk', svg: '<circle cx="100" cy="35" r="15" fill="#fed7aa"/><rect x="92" y="48" width="16" height="35" fill="#3b82f6"/><line x1="100" y1="65" x2="85" y2="75" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/><line x1="100" y1="65" x2="115" y2="75" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/><line x1="96" y1="82" x2="88" y2="110" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/><line x1="104" y1="82" x2="115" y2="115" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/><ellipse cx="85" cy="115" rx="10" ry="4" fill="#92400e"/><ellipse cx="120" cy="120" rx="10" ry="4" fill="#92400e"/>' }
    ];
    const pick = scenes[Math.floor(Math.random()*scenes.length)];
    STATE.l1Ans = pick.key;
    document.getElementById('l1-scene').innerHTML = pick.svg;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Ans) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 再看一次，試試看！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 ============
  const L2_ITEMS = [
    { id: 'walk',  label: '走路',   type: 'green',    emoji: '👣' },
    { id: 'bike',  label: '腳踏車', type: 'green',    emoji: '🚲' },
    { id: 'bus',   label: '公車',   type: 'green',    emoji: '🚌' },
    { id: 'car',   label: '汽車',   type: 'pollute',  emoji: '🚗' },
    { id: 'moto',  label: '摩托車', type: 'pollute',  emoji: '🏍️' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.type = it.type;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.type === z.dataset.type) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！地球大使！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 想一想：哪個會冒黑煙？再試試～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-emerald-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-emerald-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-emerald-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選 (圖示按鈕) ============
  const L3_ITEMS = [
    { id: 'walk',   label: '走路',    emoji: '👣', correct: true  },
    { id: 'bike',   label: '腳踏車',  emoji: '🚲', correct: true  },
    { id: 'bus',    label: '公車',    emoji: '🚌', correct: true  },
    { id: 'car',    label: '一個人開車', emoji: '🚗', correct: false },
    { id: 'moto',   label: '摩托車',  emoji: '🏍️', correct: false },
    { id: 'plane',  label: '搭飛機玩', emoji: '✈️', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-emerald-50 hover:bg-emerald-100 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-emerald-50');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-emerald-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！地球謝謝你！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：哪些不會冒煙？選 3 個～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
