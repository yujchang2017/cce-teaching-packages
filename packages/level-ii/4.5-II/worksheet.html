<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>地球小英雄 — 阿波波的任務</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef9c3 0%, #bbf7d0 50%, #bae6fd 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fde047)} }
  .spin-slow { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小刺蝟阿波波 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="hedgehog">
      <!-- 身體 -->
      <ellipse cx="50" cy="58" rx="36" ry="30" fill="#a16207"/>
      <!-- 刺 -->
      <g fill="#78350f">
        <polygon points="20,40 25,25 30,40"/>
        <polygon points="30,32 35,18 40,32"/>
        <polygon points="42,28 48,14 54,28"/>
        <polygon points="55,30 62,16 68,30"/>
        <polygon points="65,38 72,24 78,38"/>
      </g>
      <!-- 臉 (淺色) -->
      <ellipse cx="55" cy="62" rx="22" ry="20" fill="#fde68a"/>
      <!-- 鼻子 -->
      <circle cx="75" cy="62" r="4" fill="#1f2937"/>
      <!-- 眼睛 -->
      <circle cx="62" cy="55" r="3.5" fill="#1f2937"/>
      <circle cx="63" cy="54" r="1" fill="white"/>
      <!-- 嘴巴 -->
      <path d="M 68 68 Q 72 72 75 68" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 臉頰紅 -->
      <circle cx="60" cy="68" r="3" fill="#f472b6" opacity="0.6"/>
      <!-- 小披風 -->
      <path d="M 20 50 Q 15 70 25 82" stroke="#ef4444" stroke-width="6" fill="#ef4444"/>
    </g>
    <!-- 地球 -->
    <g id="earth">
      <circle cx="50" cy="50" r="40" fill="#38bdf8"/>
      <path d="M 20 45 Q 35 30 50 40 Q 60 50 45 60 Q 30 65 20 55 Z" fill="#22c55e"/>
      <path d="M 55 25 Q 70 30 75 45 Q 70 55 60 50 Z" fill="#22c55e"/>
      <path d="M 55 65 Q 70 70 80 60 Q 75 80 60 82 Q 50 75 55 65 Z" fill="#22c55e"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-800">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#hedgehog"/></svg>
    <span>阿波波的地球任務</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#hedgehog"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-700 mt-4">嗨！我是阿波波！</h1>
    <p class="text-2xl text-gray-700 mt-4">地球媽媽有一點<span class="text-pink-500 font-bold">發燒</span>了，</p>
    <p class="text-2xl text-gray-700 mt-2">要跟我一起當<span class="text-green-600 font-bold">地球小英雄</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-4">一起闖 3 個任務！</p>
    <button onclick="startGame()" class="big-btn bg-green-400 hover:bg-green-300 text-white mt-6">出發！</button>
  </section>

  <!-- 關卡 1：關關關（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#hedgehog"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿波波：沒有人用的電器，要怎麼辦？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-xl text-pink-600 mb-2">房間裡沒人，燈還亮著...</div>
      <svg width="220" height="160" viewBox="0 0 220 160" class="mx-auto">
        <!-- 房間 -->
        <rect x="10" y="10" width="200" height="140" fill="#fef3c7" stroke="#d97706" stroke-width="3" rx="8"/>
        <!-- 燈 -->
        <line x1="110" y1="10" x2="110" y2="35" stroke="#78716c" stroke-width="3"/>
        <circle cx="110" cy="50" r="20" fill="#fde047" class="shine"/>
        <g stroke="#facc15" stroke-width="3">
          <line x1="110" y1="20" x2="110" y2="28"/>
          <line x1="88" y1="50" x2="95" y2="50"/>
          <line x1="125" y1="50" x2="132" y2="50"/>
        </g>
        <!-- 空椅子 -->
        <rect x="40" y="100" width="30" height="30" fill="#a16207"/>
        <rect x="40" y="80" width="30" height="25" fill="#a16207"/>
        <!-- 空電視 -->
        <rect x="130" y="90" width="60" height="45" fill="#1f2937" rx="4"/>
        <rect x="135" y="95" width="50" height="35" fill="#4b5563"/>
        <text x="150" y="120" fill="#fbbf24" font-size="14" font-weight="bold">ON</text>
      </svg>
    </div>
    <p class="text-xl text-center text-gray-600 mb-3">點一個最棒的小英雄行動！</p>
    <div class="grid grid-cols-2 gap-4">
      <button class="big-btn bg-green-300 hover:bg-green-200" data-ans="off" onclick="l1Pick(this)">
        <div class="text-5xl">💡</div>
        <div class="text-xl font-bold text-green-800 mt-1">關燈！啪！</div>
      </button>
      <button class="big-btn bg-pink-300 hover:bg-pink-200" data-ans="more" onclick="l1Pick(this)">
        <div class="text-5xl">✨</div>
        <div class="text-xl font-bold text-pink-800 mt-1">再多開一盞</div>
      </button>
      <button class="big-btn bg-blue-300 hover:bg-blue-200" data-ans="off" onclick="l1Pick(this)">
        <div class="text-5xl">📺</div>
        <div class="text-xl font-bold text-blue-800 mt-1">關電視！</div>
      </button>
      <button class="big-btn bg-yellow-300 hover:bg-yellow-200" data-ans="leave" onclick="l1Pick(this)">
        <div class="text-5xl">🚪</div>
        <div class="text-xl font-bold text-yellow-900 mt-1">走開就好</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉—有用/沒用的行動 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#hedgehog"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿波波：把愛地球的小行動拖到 💚 這邊！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-zone="good">
        <div class="text-6xl">💚</div>
        <div class="text-2xl font-bold text-green-700">愛地球</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-gray-400" data-zone="bad">
        <div class="text-6xl">😵</div>
        <div class="text-2xl font-bold text-gray-700">地球累累</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：拼出我的英雄宣言（按順序點 3 個圖示） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#hedgehog"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿波波：為地球許下 3 個小英雄願望吧！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點 3 個你想做的行動）</p>
    <div id="l3-slots" class="flex justify-center gap-3 my-4">
      <div class="w-20 h-20 rounded-2xl bg-yellow-100 border-4 border-dashed border-yellow-400 flex items-center justify-center text-3xl" data-slot="0">?</div>
      <div class="w-20 h-20 rounded-2xl bg-yellow-100 border-4 border-dashed border-yellow-400 flex items-center justify-center text-3xl" data-slot="1">?</div>
      <div class="w-20 h-20 rounded-2xl bg-yellow-100 border-4 border-dashed border-yellow-400 flex items-center justify-center text-3xl" data-slot="2">?</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個行動按鈕 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">許願！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#hedgehog"/></svg>
    </div>
    <div class="flex justify-center items-center gap-2 mt-4">
      <div class="text-6xl">🏅</div>
      <svg width="80" height="80" viewBox="0 0 100 100" class="spin-slow"><use href="#earth"/></svg>
      <div class="text-6xl">🏅</div>
    </div>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">你是地球小英雄！</h1>
    <p class="text-2xl text-gray-700 mt-4">阿波波送你一個 <span class="text-pink-500 font-bold">地球守護徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小英雄回家任務</p>
      <p class="text-2xl mt-2">這個週末，和爸爸媽媽一起<br/>
      <span class="text-green-700 font-bold">關燈半小時</span>，<br/>
      點一根小蠟燭，說說開心事！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    show('level1');
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  // ============ 關卡 1：選對的關電器 ============
  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === 'off') {
      fb.textContent = '🎉 太棒！你幫地球省了壞氣體！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-600 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，哪一個會幫到地球呢？';
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉—好／累 ============
  const L2_ITEMS = [
    { id: 'walk',    label: '走路上學',   zone: 'good', emoji: '🚶' },
    { id: 'eatall',  label: '吃光便當',   zone: 'good', emoji: '🍱' },
    { id: 'bottle',  label: '帶水壺',     zone: 'good', emoji: '🧴' },
    { id: 'waste',   label: '丟一半便當', zone: 'bad',  emoji: '🗑️' },
    { id: 'lights',  label: '燈全開',     zone: 'bad',  emoji: '💡' },
    { id: 'water',   label: '水龍頭不關', zone: 'bad',  emoji: '🚰' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg p-3';
      d.style.width = '100px';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.zone = it.zone;
      d.innerHTML = `<div class="text-4xl">${it.emoji}</div><div class="text-sm text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.zone === z.dataset.zone) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 全部分對啦！地球笑咪咪！';
        fb.className = 'text-3xl font-bold text-green-600 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想！這個會讓地球累，還是開心？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：點 3 個願望 ============
  const L3_ITEMS = [
    { id: 'light',   label: '關燈',     emoji: '💡' },
    { id: 'walk',    label: '走路',     emoji: '🚶' },
    { id: 'finish',  label: '吃光光',   emoji: '🍚' },
    { id: 'plant',   label: '種植物',   emoji: '🌱' },
    { id: 'bird',    label: '餵小鳥',   emoji: '🐦' },
    { id: 'water',   label: '省水',     emoji: '💧' }
  ];
  const l3Picked = [];

  function loadLevel3() {
    l3Picked.length = 0;
    // clear slots
    document.querySelectorAll('#l3-slots [data-slot]').forEach(s => s.textContent = '?');
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-3 flex flex-col items-center';
      b.dataset.id = it.id;
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => pickL3(it, b);
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function pickL3(it, btn) {
    // toggle
    const idx = l3Picked.findIndex(x => x.id === it.id);
    if (idx >= 0) {
      l3Picked.splice(idx, 1);
      btn.classList.remove('ring-4','ring-green-400','bg-green-100');
      btn.classList.add('bg-sky-100');
    } else if (l3Picked.length < 3) {
      l3Picked.push(it);
      btn.classList.add('ring-4','ring-green-400','bg-green-100');
      btn.classList.remove('bg-sky-100');
    } else {
      // already 3 picked — gentle wiggle
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
    // refresh slots
    for (let i = 0; i < 3; i++) {
      const slot = document.querySelector(`#l3-slots [data-slot="${i}"]`);
      slot.textContent = l3Picked[i] ? l3Picked[i].emoji : '?';
      if (l3Picked[i]) slot.classList.add('popin');
    }
  }

  function l3Check() {
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (l3Picked.length === 3) {
      fb.textContent = '🎉 願望許好了！你是真正的小英雄！';
      fb.className = 'text-2xl font-bold text-green-600 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 再選一些小英雄行動吧！要 3 個喔～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
