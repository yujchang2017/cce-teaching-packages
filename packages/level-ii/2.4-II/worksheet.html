<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>食物從哪裡來 — 小兔子阿菜的菜園冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #dcfce7 0%, #fef3c7 60%, #fee2e2 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #86efac)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小兔子阿菜 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bunny">
      <!-- 耳朵 -->
      <ellipse cx="32" cy="15" rx="7" ry="18" fill="#fafafa"/>
      <ellipse cx="32" cy="15" rx="3" ry="12" fill="#fbcfe8"/>
      <ellipse cx="68" cy="15" rx="7" ry="18" fill="#fafafa"/>
      <ellipse cx="68" cy="15" rx="3" ry="12" fill="#fbcfe8"/>
      <!-- 臉 -->
      <circle cx="50" cy="55" r="35" fill="#fafafa"/>
      <!-- 眼睛 -->
      <circle cx="38" cy="50" r="4" fill="black"/>
      <circle cx="62" cy="50" r="4" fill="black"/>
      <circle cx="39" cy="48" r="1.2" fill="white"/>
      <circle cx="63" cy="48" r="1.2" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="62" rx="4" ry="3" fill="#f472b6"/>
      <!-- 嘴巴 -->
      <path d="M 44 70 Q 50 75 56 70" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <circle cx="28" cy="62" r="4" fill="#fecaca" opacity="0.7"/>
      <circle cx="72" cy="62" r="4" fill="#fecaca" opacity="0.7"/>
      <!-- 草帽 -->
      <ellipse cx="50" cy="25" rx="28" ry="5" fill="#ca8a04"/>
      <path d="M 35 25 Q 50 10 65 25 Z" fill="#eab308"/>
      <rect x="38" y="22" width="24" height="2" fill="#b45309"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-green-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#bunny"/></svg>
    <span>小兔子阿菜的菜園冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bunny"/></svg>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">嗨！我是阿菜！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-pink-500 font-bold">小農夫</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">出發！</button>
  </section>

  <!-- 關卡 1：食物兩大家族 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bunny"/></svg>
      <p class="text-2xl font-bold text-green-700">阿菜：這是植物還是動物家族？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">下面這樣食物是...</div>
      <div id="l1-scene" class="mx-auto w-40 h-40 flex items-center justify-center text-8xl"></div>
      <div id="l1-label" class="text-2xl font-bold text-gray-700 mt-2"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-green-300 hover:bg-green-200" data-ans="plant" onclick="l1Pick(this)">
        <span class="text-5xl">🌱</span><div class="text-xl font-bold mt-1">植物家族</div>
      </button>
      <button class="big-btn bg-red-300 hover:bg-red-200" data-ans="animal" onclick="l1Pick(this)">
        <span class="text-5xl">🐄</span><div class="text-xl font-bold mt-1">動物家族</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <div class="text-center mt-2" id="l1-progress-txt"></div>
  </section>

  <!-- 關卡 2：拖拉彩虹餐盤 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bunny"/></svg>
      <p class="text-2xl font-bold text-green-700">阿菜：幫我做彩虹餐盤！把蔬果拖到『蔬果』圈，把肉蛋奶拖到『蛋白質』圈！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-group="plant">
        <div class="text-6xl">🌈</div>
        <div class="text-2xl font-bold text-green-600">蔬果</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-red-400" data-group="animal">
        <div class="text-6xl">💪</div>
        <div class="text-2xl font-bold text-red-600">蛋白質</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：吃光光小英雄（多選） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bunny"/></svg>
      <p class="text-2xl font-bold text-green-700">阿菜：選 3 個『好農夫小英雄』的行動！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bunny"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-600 mt-4">你是超棒的小農夫！</h1>
    <p class="text-2xl text-gray-700 mt-4">阿菜送你一張 <span class="text-pink-500 font-bold">金色紅蘿蔔徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚餐，和爸爸媽媽一起數一數桌上<br/><span class="text-pink-600 font-bold">有幾種顏色的食物</span>，看看能不能湊成彩虹！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：食物分類 ============
  const L1_FOODS = [
    { emoji: '🍎', label: '蘋果', ans: 'plant' },
    { emoji: '🥕', label: '紅蘿蔔', ans: 'plant' },
    { emoji: '🍚', label: '米飯', ans: 'plant' },
    { emoji: '🥚', label: '雞蛋', ans: 'animal' },
    { emoji: '🥛', label: '牛奶', ans: 'animal' },
    { emoji: '🐟', label: '魚', ans: 'animal' }
  ];
  let l1Q = 0, l1Correct = 0;
  let l1Pool = [];

  function loadLevel1() {
    l1Q = 0; l1Correct = 0;
    l1Pool = L1_FOODS.slice().sort(() => Math.random()-0.5).slice(0, 4);
    showL1Q();
  }

  function showL1Q() {
    const f = l1Pool[l1Q];
    document.getElementById('l1-scene').innerHTML = `<div>${f.emoji}</div>`;
    document.getElementById('l1-scene').dataset.ans = f.ans;
    document.getElementById('l1-label').textContent = f.label;
    document.getElementById('l1-feedback').classList.add('hide');
    document.getElementById('l1-progress-txt').innerHTML = `<span class="text-lg text-gray-500">第 ${l1Q+1} / ${l1Pool.length} 題</span>`;
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    const ans = document.getElementById('l1-scene').dataset.ans;
    fb.classList.remove('hide');
    if (btn.dataset.ans === ans) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      l1Correct++;
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        l1Q++;
        if (l1Q >= l1Pool.length) {
          confetti();
          setTimeout(() => {
            STATE.level = 2;
            drawProgress();
            loadLevel2();
            show('level2');
          }, 1200);
        } else {
          showL1Q();
        }
      }, 1200);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 ============
  const L2_ITEMS = [
    { id: 'tomato',  label: '番茄',   group: 'plant',  emoji: '🍅' },
    { id: 'banana',  label: '香蕉',   group: 'plant',  emoji: '🍌' },
    { id: 'broccoli',label: '青花菜', group: 'plant',  emoji: '🥦' },
    { id: 'egg',     label: '雞蛋',   group: 'animal', emoji: '🥚' },
    { id: 'chicken', label: '雞腿',   group: 'animal', emoji: '🍗' },
    { id: 'milk',    label: '牛奶',   group: 'animal', emoji: '🥛' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.group = it.group;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.group === z.dataset.group) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！彩虹餐盤完成！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想一想：它從植物來、還是動物來？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選（永續飲食小英雄）============
  const L3_ITEMS = [
    { id: 'finish',  label: '吃光光', emoji: '🍽️', correct: true  },
    { id: 'season',  label: '吃當季', emoji: '🍊', correct: true  },
    { id: 'local',   label: '吃在地', emoji: '🏡', correct: true  },
    { id: 'waste',   label: '剩很多',  emoji: '🗑️', correct: false },
    { id: 'far',     label: '買遠方',  emoji: '✈️', correct: false },
    { id: 'rainbow', label: '只吃薯條', emoji: '🍟', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你是好農夫小英雄！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：農夫朋友會開心的行動是哪 3 個？';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
