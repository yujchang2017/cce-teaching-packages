<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>不一樣的我們 — 小星星的溫暖旅行</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #fce7f3 50%, #ede9fe 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1.2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fbbf24)} }
  .twinkle { animation: twinkle 1.8s infinite ease-in-out; }
  @keyframes twinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.92)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
  .star-btn { cursor: pointer; transition: transform 0.15s; }
  .star-btn:hover { transform: scale(1.1); }
  .star-btn:active { transform: scale(0.95); }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小星星 SVG (7 顆不同顏色，可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="star-base">
      <polygon points="50,10 62,40 95,42 68,62 78,95 50,75 22,95 32,62 5,42 38,40" />
    </g>
    <g id="star-mei"><!-- 美美星星（粉紅、戴蝴蝶結） -->
      <polygon points="50,10 62,40 95,42 68,62 78,95 50,75 22,95 32,62 5,42 38,40" fill="#ec4899"/>
      <circle cx="42" cy="45" r="3" fill="black"/>
      <circle cx="58" cy="45" r="3" fill="black"/>
      <path d="M 42 55 Q 50 62 58 55" stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 25 20 Q 30 15 35 20 Q 32 22 25 20 Z" fill="#fbbf24"/>
    </g>
    <g id="star-hai"><!-- 海海星星（藍、住海邊） -->
      <polygon points="50,10 62,40 95,42 68,62 78,95 50,75 22,95 32,62 5,42 38,40" fill="#3b82f6"/>
      <circle cx="42" cy="45" r="3" fill="white"/>
      <circle cx="58" cy="45" r="3" fill="white"/>
      <path d="M 42 55 Q 50 60 58 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="star-shan"><!-- 山山星星（綠、住山上） -->
      <polygon points="50,10 62,40 95,42 68,62 78,95 50,75 22,95 32,62 5,42 38,40" fill="#10b981"/>
      <circle cx="42" cy="45" r="3" fill="white"/>
      <circle cx="58" cy="45" r="3" fill="white"/>
      <path d="M 42 55 Q 50 60 58 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="star-cheng"><!-- 城城星星（紫、住城市） -->
      <polygon points="50,10 62,40 95,42 68,62 78,95 50,75 22,95 32,62 5,42 38,40" fill="#8b5cf6"/>
      <circle cx="42" cy="45" r="3" fill="white"/>
      <circle cx="58" cy="45" r="3" fill="white"/>
      <path d="M 42 55 Q 50 60 58 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-pink-600">
    <svg width="60" height="60" viewBox="0 0 100 100" class="twinkle"><use href="#star-mei"/></svg>
    <span>小星星的溫暖旅行</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <div class="flex justify-center gap-2 mb-2">
      <svg width="70" height="70" viewBox="0 0 100 100" class="bounce"><use href="#star-mei"/></svg>
      <svg width="70" height="70" viewBox="0 0 100 100" class="bounce" style="animation-delay:0.2s"><use href="#star-hai"/></svg>
      <svg width="70" height="70" viewBox="0 0 100 100" class="bounce" style="animation-delay:0.4s"><use href="#star-shan"/></svg>
      <svg width="70" height="70" viewBox="0 0 100 100" class="bounce" style="animation-delay:0.6s"><use href="#star-cheng"/></svg>
    </div>
    <h1 class="text-4xl font-extrabold text-pink-600 mt-2">嗨！我們是小星星！</h1>
    <p class="text-2xl text-gray-700 mt-4">我們每一顆都<span class="text-purple-500 font-bold">不一樣</span>，但都很<span class="text-pink-500 font-bold">棒</span>！</p>
    <p class="text-xl text-gray-600 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：一樣天氣不一樣故事（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#star-mei"/></svg>
      <p class="text-2xl font-bold text-pink-600">美美：颱風來了！誰家會淹水？</p>
    </div>
    <div class="text-center my-4">
      <div class="text-2xl font-bold text-blue-600 mb-2">海邊／山上／城市，一樣是颱風 ☁️</div>
      <svg width="280" height="120" viewBox="0 0 280 120" class="mx-auto">
        <!-- 颱風雲 -->
        <ellipse cx="140" cy="30" rx="60" ry="20" fill="#64748b"/>
        <text x="140" y="36" text-anchor="middle" font-size="18" fill="white" font-weight="bold">颱風</text>
        <!-- 雨 -->
        <line x1="100" y1="55" x2="95" y2="75" stroke="#3b82f6" stroke-width="3"/>
        <line x1="140" y1="55" x2="135" y2="75" stroke="#3b82f6" stroke-width="3"/>
        <line x1="180" y1="55" x2="175" y2="75" stroke="#3b82f6" stroke-width="3"/>
      </svg>
      <div class="text-xl text-gray-600 mt-2">想一想：哪個朋友最容易淹水？</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <button class="big-btn bg-blue-100 hover:bg-blue-200 text-lg p-2" data-ans="hai" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><use href="#star-hai"/></svg>
        <div class="text-lg mt-1 text-blue-700 font-bold">海邊</div>
        <div class="text-4xl">🌊</div>
      </button>
      <button class="big-btn bg-green-100 hover:bg-green-200 text-lg p-2" data-ans="shan" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><use href="#star-shan"/></svg>
        <div class="text-lg mt-1 text-green-700 font-bold">山上</div>
        <div class="text-4xl">⛰️</div>
      </button>
      <button class="big-btn bg-purple-100 hover:bg-purple-200 text-lg p-2" data-ans="cheng" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><use href="#star-cheng"/></svg>
        <div class="text-lg mt-1 text-purple-700 font-bold">城市</div>
        <div class="text-4xl">🏢</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：挺身小隊（多選同理行動） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#star-hai"/></svg>
      <p class="text-2xl font-bold text-blue-600">海海：我的朋友沒冷氣，好熱喔…</p>
    </div>
    <div class="text-center my-3">
      <div class="text-xl text-gray-700">有一位朋友家裡沒有冷氣，熱天很辛苦。</div>
      <div class="text-xl text-pink-600 font-bold mt-1">你可以怎麼幫他？選 2-3 個好方法！</div>
      <div class="text-lg text-gray-500 mt-1">（點一下選好，再點一下可以取消）</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l2-items">
      <!-- 6 個項目動態產生 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l2Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l2-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 關卡 3：地球笑 vs 地球哭（拖拉） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#star-shan"/></svg>
      <p class="text-2xl font-bold text-green-600">山山：把行為拖到對的地球臉！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l3-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-300" data-kind="good">
        <div class="text-6xl">😊</div>
        <div class="text-2xl font-bold text-green-600">地球笑</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-gray-400" data-kind="bad">
        <div class="text-6xl">😟</div>
        <div class="text-2xl font-bold text-gray-600">地球哭</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l3-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine flex justify-center gap-3">
      <svg width="100" height="100" viewBox="0 0 100 100" class="twinkle"><use href="#star-mei"/></svg>
      <svg width="100" height="100" viewBox="0 0 100 100" class="twinkle" style="animation-delay:0.3s"><use href="#star-hai"/></svg>
      <svg width="100" height="100" viewBox="0 0 100 100" class="twinkle" style="animation-delay:0.6s"><use href="#star-shan"/></svg>
      <svg width="100" height="100" viewBox="0 0 100 100" class="twinkle" style="animation-delay:0.9s"><use href="#star-cheng"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-pink-600 mt-4">你是最棒的小星星！</h1>
    <p class="text-2xl text-gray-700 mt-4">你已經學會<span class="text-purple-500 font-bold">欣賞不一樣</span>、<span class="text-blue-500 font-bold">挺身幫朋友</span>、<span class="text-green-500 font-bold">愛地球</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">回家小任務 💛</p>
      <p class="text-2xl mt-2">今天晚上，<br/>打個電話給<span class="text-pink-600 font-bold">阿公阿嬤</span>，<br/>問他們：「今天會不會太熱？要不要喝水？」</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#a78bfa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    show('level1');
  }

  // ============ 關卡 1：點擊配對 ============
  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === 'hai') {
      fb.textContent = '🎉 對！海邊最容易淹水～';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      const hint = btn.dataset.ans === 'shan' ?
        '😊 山上比較怕石頭滑下來喔～再想想！' :
        '😊 城市比較怕停電喔～再試試！';
      fb.textContent = hint;
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：多選（挺身行動） ============
  const L2_ITEMS = [
    { id: 'water',   label: '送他水',      emoji: '💧', correct: true  },
    { id: 'fan',     label: '借他電扇',    emoji: '🪭', correct: true  },
    { id: 'phone',   label: '打電話關心',  emoji: '📞', correct: true  },
    { id: 'laugh',   label: '笑他沒冷氣',  emoji: '😂', correct: false },
    { id: 'ignore',  label: '不理他',      emoji: '🙄', correct: false },
    { id: 'hide',    label: '躲起來',      emoji: '🏃', correct: false }
  ];
  const l2Picked = new Set();

  function loadLevel2() {
    l2Picked.clear();
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-pink-50 hover:bg-pink-100 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l2Picked.has(it.id)) {
          l2Picked.delete(it.id);
          b.classList.remove('ring-4','ring-pink-400','bg-pink-200');
          b.classList.add('bg-pink-50');
        } else {
          l2Picked.add(it.id);
          b.classList.add('ring-4','ring-pink-400','bg-pink-200');
          b.classList.remove('bg-pink-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function l2Check() {
    const correctIds = L2_ITEMS.filter(x => x.correct).map(x => x.id);
    const pickedCorrect = correctIds.filter(id => l2Picked.has(id));
    const pickedWrong = Array.from(l2Picked).filter(id => !correctIds.includes(id));
    const fb = document.getElementById('l2-feedback');
    fb.classList.remove('hide');
    if (pickedCorrect.length >= 2 && pickedWrong.length === 0) {
      fb.textContent = '🎉 你是超級挺身小隊！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 3;
        drawProgress();
        loadLevel3();
        show('level3');
      }, 1800);
    } else if (pickedWrong.length > 0) {
      fb.textContent = '😊 笑別人／不理他不是好方法～想想怎麼幫他！';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    } else {
      fb.textContent = '😊 再選 1-2 個幫忙的方法～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  // ============ 關卡 3：拖拉分類 ============
  const L3_ITEMS = [
    { id: 'walk',   label: '走路',        emoji: '🚶', kind: 'good' },
    { id: 'bike',   label: '騎腳踏車',    emoji: '🚲', kind: 'good' },
    { id: 'light',  label: '關燈',        emoji: '💡', kind: 'good' },
    { id: 'car',    label: '開很多車',    emoji: '🚗', kind: 'bad'  },
    { id: 'tv',     label: '電視開很久',  emoji: '📺', kind: 'bad'  },
    { id: 'water',  label: '一直沖水',    emoji: '🚿', kind: 'bad'  }
  ];
  let l3Correct = 0;
  let l3Total = L3_ITEMS.length;

  function loadLevel3() {
    l3Correct = 0;
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-4xl p-3';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.kind = it.kind;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-base text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level3 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l3-items [data-id="${id}"]`);
        if (!src) return;
        handleL3Drop(src, z);
      };
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function handleL3Drop(src, z) {
    if (src.dataset.kind === z.dataset.kind) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l3Correct++;
      if (l3Correct === l3Total) {
        const fb = document.getElementById('l3-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！地球超愛你！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 4;
          drawProgress();
          show('finale');
          setTimeout(confetti, 300);
          setTimeout(confetti, 900);
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l3-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想～走路是地球笑、開很多車是地球哭';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l3Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l3Selected) l3Selected.classList.remove('ring-4','ring-pink-400');
    l3Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l3Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL3Drop(l3Selected, zone);
    }
    l3Selected.classList.remove('ring-4','ring-pink-400');
    l3Selected = null;
  });

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
