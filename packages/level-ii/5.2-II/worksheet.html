<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>寶物大旅行 — 小松鼠抱抱的三個小任務</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #fce7f3 50%, #dcfce7 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .float-up { animation: floatUp 0.8s ease-out both; }
  @keyframes floatUp { 0%{transform:translateY(20px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠抱抱 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 身體 -->
      <ellipse cx="50" cy="62" rx="28" ry="26" fill="#c2410c"/>
      <!-- 大尾巴 -->
      <path d="M 78 60 Q 95 40 88 20 Q 80 5 70 20 Q 75 35 72 55 Z" fill="#d97706"/>
      <!-- 頭 -->
      <circle cx="50" cy="38" r="22" fill="#c2410c"/>
      <!-- 耳朵 -->
      <ellipse cx="34" cy="22" rx="6" ry="10" fill="#9a3412"/>
      <ellipse cx="66" cy="22" rx="6" ry="10" fill="#9a3412"/>
      <ellipse cx="34" cy="24" rx="3" ry="5" fill="#fbbf24"/>
      <ellipse cx="66" cy="24" rx="3" ry="5" fill="#fbbf24"/>
      <!-- 肚子 -->
      <ellipse cx="50" cy="68" rx="16" ry="18" fill="#fed7aa"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="36" r="4" fill="white"/>
      <circle cx="58" cy="36" r="4" fill="white"/>
      <circle cx="43" cy="37" r="2.5" fill="black"/>
      <circle cx="59" cy="37" r="2.5" fill="black"/>
      <!-- 鼻子嘴巴 -->
      <ellipse cx="50" cy="44" rx="2.5" ry="2" fill="#78350f"/>
      <path d="M 45 48 Q 50 52 55 48" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <circle cx="36" cy="44" r="3" fill="#fda4af" opacity="0.6"/>
      <circle cx="64" cy="44" r="3" fill="#fda4af" opacity="0.6"/>
      <!-- 小手抱著愛心 -->
      <circle cx="50" cy="62" r="6" fill="#ef4444"/>
      <text x="50" y="65" text-anchor="middle" font-size="10" fill="white">♥</text>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-orange-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>抱抱的寶物旅行</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">嗨！我是抱抱！</h1>
    <p class="text-2xl text-gray-700 mt-4">我愛收集<span class="text-pink-500 font-bold">「不要的東西」</span>！</p>
    <p class="text-2xl text-gray-700 mt-2">一起來救寶物嗎？</p>
    <p class="text-xl text-gray-500 mt-3">共 3 個小任務！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">出發！</button>
  </section>

  <!-- 關卡 1：點一點 — 這個東西，選什麼好？ -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">抱抱：這個東西，你想怎麼辦？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">看看這個寶物...</div>
      <div id="l1-item" class="text-8xl">🧸</div>
      <div id="l1-label" class="text-2xl font-bold text-gray-700 mt-2">還能玩的舊玩具熊</div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-green-200 hover:bg-green-100 text-green-900" data-ans="give" onclick="l1Pick(this)">
        <div class="text-5xl">🎁</div>
        <div class="text-xl mt-1">送給別人</div>
      </button>
      <button class="big-btn bg-blue-200 hover:bg-blue-100 text-blue-900" data-ans="reuse" onclick="l1Pick(this)">
        <div class="text-5xl">🔄</div>
        <div class="text-xl mt-1">再用一次</div>
      </button>
      <button class="big-btn bg-yellow-200 hover:bg-yellow-100 text-amber-900" data-ans="repair" onclick="l1Pick(this)">
        <div class="text-5xl">🔧</div>
        <div class="text-xl mt-1">修修看</div>
      </button>
      <button class="big-btn bg-gray-200 hover:bg-gray-100 text-gray-700" data-ans="trash" onclick="l1Pick(this)">
        <div class="text-5xl">🗑️</div>
        <div class="text-xl mt-1">丟掉</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉分類 — 把東西放到對的桶子 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">抱抱：把寶物放到對的桶！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（可以用拖的，也可以先點物品再點桶子）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-bin="paper">
        <div class="text-5xl">📄</div>
        <div class="text-xl font-bold text-green-700 mt-1">紙</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-yellow-400" data-bin="bottle">
        <div class="text-5xl">🍼</div>
        <div class="text-xl font-bold text-amber-700 mt-1">瓶罐</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-pink-400" data-bin="give">
        <div class="text-5xl">🎁</div>
        <div class="text-xl font-bold text-pink-700 mt-1">送人</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：多選 — 家裡找 3 個可以再用的 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">抱抱：找 3 個可以再用的寶物！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（點一下就選好，再點一下取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">你是超棒的寶物救援員！</h1>
    <p class="text-2xl text-gray-700 mt-4">抱抱送你一張 <span class="text-pink-500 font-bold">金色寶物徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天回家，和爸爸媽媽一起找<br/><span class="text-pink-600 font-bold">3 件還能再用的寶物</span>，<br/>想想它們的新旅行！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：點擊選擇（四個選項中，最好的是送人） ============
  // 情境 = 還能玩的舊玩具熊 → 最好的選擇：送人；再用也 OK；修和丟不最好
  const L1_SCENARIOS = [
    { emoji: '🧸', label: '還能玩的舊玩具熊', best: ['give','reuse'] },
    { emoji: '👕', label: '不合身的舊衣服',   best: ['give'] },
    { emoji: '🍼', label: '喝完的塑膠瓶',     best: ['reuse'] }
  ];
  let l1Current = null;

  function loadLevel1() {
    l1Current = L1_SCENARIOS[Math.floor(Math.random()*L1_SCENARIOS.length)];
    document.getElementById('l1-item').textContent = l1Current.emoji;
    document.getElementById('l1-label').textContent = l1Current.label;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (l1Current.best.includes(btn.dataset.ans)) {
      fb.textContent = '🎉 好棒！這是寶物的新旅行！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else if (btn.dataset.ans === 'trash') {
      fb.textContent = '😊 想一想，還能用嗎？再試試～';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    } else {
      fb.textContent = '😊 也不錯，但還有更棒的！再試試～';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉分類（6 物品到 3 桶） ============
  const L2_ITEMS = [
    { id: 'book',    label: '舊繪本',   bin: 'paper',  emoji: '📖' },
    { id: 'news',    label: '報紙',     bin: 'paper',  emoji: '📰' },
    { id: 'bottle',  label: '寶特瓶',   bin: 'bottle', emoji: '🧴' },
    { id: 'can',     label: '鐵鋁罐',   bin: 'bottle', emoji: '🥫' },
    { id: 'toy',     label: '舊玩具',   bin: 'give',   emoji: '🎮' },
    { id: 'clothes', label: '小的衣服', bin: 'give',   emoji: '👚' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-4xl p-3';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.bin = it.bin;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-sm text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      d.addEventListener('click', () => startTouchDrag(d, { preventDefault: () => {} }));
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
      z.onclick = () => {
        if (l2Selected) handleL2Drop(l2Selected, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.bin === z.dataset.bin) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      src.onclick = null;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！寶物分類大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-3xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想看～紙、瓶罐、還是送人？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
    if (l2Selected) {
      l2Selected.classList.remove('ring-4','ring-pink-400');
      l2Selected = null;
    }
  }

  // --- touch / click fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    if (e && e.preventDefault) e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    } else {
      l2Selected.classList.remove('ring-4','ring-pink-400');
      l2Selected = null;
    }
  });

  // ============ 關卡 3：多選（6 個家中物品，選 3 個可以再用的） ============
  const L3_ITEMS = [
    { id: 'bottle2', label: '空瓶子',   emoji: '🍾', reusable: true  },
    { id: 'box',     label: '紙箱',     emoji: '📦', reusable: true  },
    { id: 'cloth',   label: '不合衣服', emoji: '👕', reusable: true  },
    { id: 'banana',  label: '香蕉皮',   emoji: '🍌', reusable: false },
    { id: 'gum',     label: '口香糖渣', emoji: '🍬', reusable: false },
    { id: 'tissue',  label: '用過衛生紙', emoji: '🧻', reusable: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-base font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.reusable).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你找到所有寶物了！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：香蕉皮可以再用嗎？選 3 個～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
