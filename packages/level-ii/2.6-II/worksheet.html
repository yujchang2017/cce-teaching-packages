<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大自然小隊長 — 小松鼠可可的森林探險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #d1fae5 0%, #fef3c7 50%, #fecdd3 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .twinkle { animation: twinkle 1.5s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.4; transform:scale(1.2)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  /* 早幼必備：SVG 內 text 不吃事件，避免拖拉/點擊失效 */
  svg text, svg tspan { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
  .pick-selected { outline: 6px solid #f472b6; outline-offset: 4px; transform: scale(1.08); }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠可可 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 身體 -->
      <ellipse cx="50" cy="62" rx="28" ry="30" fill="#d97706"/>
      <!-- 頭 -->
      <circle cx="50" cy="38" r="22" fill="#d97706"/>
      <!-- 耳朵 -->
      <ellipse cx="33" cy="22" rx="7" ry="10" fill="#d97706"/>
      <ellipse cx="67" cy="22" rx="7" ry="10" fill="#d97706"/>
      <ellipse cx="33" cy="22" rx="3" ry="5" fill="#fbbf24"/>
      <ellipse cx="67" cy="22" rx="3" ry="5" fill="#fbbf24"/>
      <!-- 尾巴 (大蓬鬆) -->
      <path d="M 75 70 Q 95 55 90 30 Q 88 15 78 20 Q 85 40 75 55" fill="#c2410c"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="38" r="4" fill="black"/>
      <circle cx="58" cy="38" r="4" fill="black"/>
      <circle cx="43" cy="37" r="1.5" fill="white"/>
      <circle cx="59" cy="37" r="1.5" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="46" rx="3" ry="2" fill="#78350f"/>
      <!-- 嘴 -->
      <path d="M 46 50 Q 50 54 54 50" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <circle cx="36" cy="45" r="3" fill="#fca5a5" opacity="0.6"/>
      <circle cx="64" cy="45" r="3" fill="#fca5a5" opacity="0.6"/>
      <!-- 花冠（小花環） -->
      <circle cx="40" cy="15" r="3" fill="#f472b6"/>
      <circle cx="50" cy="12" r="3" fill="#fde047"/>
      <circle cx="60" cy="15" r="3" fill="#a78bfa"/>
    </g>
    <!-- 橡果 -->
    <g id="acorn">
      <ellipse cx="50" cy="60" rx="18" ry="22" fill="#a16207"/>
      <ellipse cx="50" cy="35" rx="22" ry="10" fill="#78350f"/>
      <line x1="50" y1="22" x2="50" y2="30" stroke="#78350f" stroke-width="3"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-emerald-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>可可的森林探險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar"></div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-emerald-700 mt-4">嗨！我是可可！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-pink-500 font-bold">大自然小隊長</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個好玩的關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：臺灣特有種配對（點擊） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-emerald-700">可可：哪一個是<span class="text-pink-600">只有臺灣</span>才有的朋友？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">看看牠／它的特徵...</div>
      <div id="l1-hint" class="text-2xl text-amber-700 font-bold bg-yellow-100 rounded-2xl p-4 my-2"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6" id="l1-choices">
      <!-- 4 個大按鈕會由 JS 產生 -->
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉（把東西放對家：森林／海洋） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-emerald-700">可可：幫小動物找家！把牠們拖到對的地方～</p>
    </div>
    <p class="text-lg text-center text-gray-500">（手機：先點一下，再點到家的地方）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-emerald-400 bg-emerald-50" data-home="forest">
        <div class="text-6xl">🌳</div>
        <div class="text-2xl font-bold text-emerald-700">森林</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-blue-400 bg-blue-50" data-home="ocean">
        <div class="text-6xl">🌊</div>
        <div class="text-2xl font-bold text-blue-700">海洋</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：愛地球小行動（多選） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-emerald-700">可可：地球日到了！選 3 件<span class="text-pink-600">愛地球</span>的好行動！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選，再點一下取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目由 JS 產生 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆🌳</div>
    <h1 class="text-4xl font-extrabold text-emerald-700 mt-4">你是超棒的大自然小隊長！</h1>
    <p class="text-2xl text-gray-700 mt-4">可可送你一張 <span class="text-pink-500 font-bold">森林金牌徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家跟爸媽做）</p>
      <p class="text-2xl mt-2">這個週末，和爸爸媽媽一起去公園散步，<br/><span class="text-pink-600 font-bold">找 1 朵花、1 片葉子、1 隻小蟲</span>，跟牠們說聲「謝謝你」！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#a78bfa'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：臺灣特有種配對 ============
  const L1_ROUNDS = [
    {
      hint: '胸前有大大的白色 V 字，住在臺灣深山裡！',
      answer: 'bear',
      choices: [
        { key: 'bear', emoji: '🐻', label: '臺灣黑熊' },
        { key: 'panda', emoji: '🐼', label: '大熊貓' },
        { key: 'dog', emoji: '🐶', label: '小狗狗' },
        { key: 'cat', emoji: '🐱', label: '小貓咪' }
      ]
    },
    {
      hint: '藍藍的大翅膀，長長的尾巴，臺灣的特別鳥！',
      answer: 'bluemagpie',
      choices: [
        { key: 'chicken', emoji: '🐔', label: '小雞' },
        { key: 'bluemagpie', emoji: '🦜', label: '臺灣藍鵲' },
        { key: 'duck', emoji: '🦆', label: '鴨子' },
        { key: 'owl', emoji: '🦉', label: '貓頭鷹' }
      ]
    }
  ];

  function loadLevel1() {
    const round = L1_ROUNDS[Math.floor(Math.random()*L1_ROUNDS.length)];
    STATE.l1Answer = round.answer;
    document.getElementById('l1-hint').textContent = round.hint;
    const box = document.getElementById('l1-choices');
    box.innerHTML = '';
    // 打散順序
    const shuffled = round.choices.slice().sort(() => Math.random()-0.5);
    shuffled.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'big-btn bg-emerald-200 hover:bg-emerald-100 text-emerald-900';
      btn.dataset.ans = ch.key;
      btn.innerHTML = `<div class="text-6xl">${ch.emoji}</div><div class="text-xl mt-1">${ch.label}</div>`;
      btn.onclick = () => l1Pick(btn);
      box.appendChild(btn);
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Answer) {
      fb.textContent = '🎉 答對啦！就是牠！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#l1-choices button').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉（小動物找家） ============
  const L2_ITEMS = [
    { id: 'squirrel', label: '松鼠',   home: 'forest', emoji: '🐿️' },
    { id: 'deer',     label: '梅花鹿', home: 'forest', emoji: '🦌' },
    { id: 'fish',     label: '小魚',   home: 'ocean',  emoji: '🐟' },
    { id: 'whale',    label: '鯨魚',   home: 'ocean',  emoji: '🐳' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.home = it.home;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.home === z.dataset.home) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！動物都回家囉！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想～這個朋友住哪裡呢？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback：先點選，再點區域放 ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：愛地球行動多選 ============
  const L3_ITEMS = [
    { id: 'pickup',   label: '撿垃圾',     emoji: '🗑️', correct: true  },
    { id: 'plant',    label: '種小花',     emoji: '🌱', correct: true  },
    { id: 'save',     label: '關燈',       emoji: '💡', correct: true  },
    { id: 'hunt',     label: '抓小動物',   emoji: '🚫', correct: false },
    { id: 'waste',    label: '浪費水',     emoji: '💦', correct: false },
    { id: 'cut',      label: '砍大樹',     emoji: '🪓', correct: false }
  ];
  let l3Selected = new Set();

  function loadLevel3() {
    l3Selected = new Set();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const btn = document.createElement('button');
      btn.className = 'big-btn bg-white text-amber-900 border-4 border-emerald-300';
      btn.dataset.id = it.id;
      btn.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="text-base mt-1">${it.label}</div>`;
      btn.onclick = () => l3Toggle(btn, it);
      box.appendChild(btn);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Toggle(btn, it) {
    if (l3Selected.has(it.id)) {
      l3Selected.delete(it.id);
      btn.classList.remove('pick-selected');
    } else {
      if (l3Selected.size >= 3) {
        // 已選滿 3 個，提示
        const fb = document.getElementById('l3-feedback');
        fb.classList.remove('hide');
        fb.textContent = '😊 只能選 3 個喔～要換一個嗎？';
        fb.className = 'text-xl font-bold text-orange-500 mt-3';
        return;
      }
      l3Selected.add(it.id);
      btn.classList.add('pick-selected');
    }
  }

  function l3Check() {
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (l3Selected.size !== 3) {
      fb.textContent = '😊 選 3 個愛地球的好行動喔！';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
      return;
    }
    const allGood = [...l3Selected].every(id => L3_ITEMS.find(x => x.id === id).correct);
    if (allGood) {
      fb.textContent = '🎉 太棒了！你真的很愛地球！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        confetti();
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，哪一個會傷害地球呢？';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    drawProgress();
    show('intro');
  }

  // 初始化
  drawProgress();
</script>

</body>
</html>
