<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>東西再玩一次 — 小松鼠咪咪的寶物箱</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #d9f99d 60%, #ffe4e6 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fde68a)} }
  .sparkle { animation: sparkle 1.5s infinite; }
  @keyframes sparkle { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠咪咪 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 尾巴 -->
      <path d="M 15 60 Q 5 30 20 15 Q 35 25 30 50 Z" fill="#c2410c"/>
      <path d="M 20 55 Q 12 35 22 22 Q 30 30 28 48 Z" fill="#f97316"/>
      <!-- 身體 -->
      <ellipse cx="55" cy="60" rx="28" ry="30" fill="#ea580c"/>
      <ellipse cx="55" cy="68" rx="18" ry="20" fill="#fed7aa"/>
      <!-- 頭 -->
      <circle cx="55" cy="35" r="22" fill="#ea580c"/>
      <!-- 耳朵 -->
      <ellipse cx="42" cy="20" rx="6" ry="9" fill="#ea580c"/>
      <ellipse cx="68" cy="20" rx="6" ry="9" fill="#ea580c"/>
      <ellipse cx="42" cy="22" rx="3" ry="5" fill="#fed7aa"/>
      <ellipse cx="68" cy="22" rx="3" ry="5" fill="#fed7aa"/>
      <!-- 眼睛 -->
      <circle cx="48" cy="35" r="4" fill="black"/>
      <circle cx="62" cy="35" r="4" fill="black"/>
      <circle cx="49" cy="34" r="1.5" fill="white"/>
      <circle cx="63" cy="34" r="1.5" fill="white"/>
      <!-- 鼻子嘴巴 -->
      <ellipse cx="55" cy="43" rx="3" ry="2" fill="black"/>
      <path d="M 48 47 Q 55 54 62 47" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-orange-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>咪咪的寶物箱</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar"></div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">嗨！我是咪咪！</h1>
    <p class="text-2xl text-gray-700 mt-4">想跟我一起找<span class="text-green-600 font-bold">寶物</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：垃圾還是寶物？（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">咪咪：這個東西是垃圾還是寶物？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-xl font-bold text-pink-600 mb-2">看看這個...</div>
      <div id="l1-item-box" class="inline-block">
        <svg id="l1-item" width="180" height="180" viewBox="0 0 100 100" class="mx-auto"></svg>
        <div id="l1-item-label" class="text-2xl font-bold text-gray-700 mt-2"></div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-red-300 hover:bg-red-200" data-ans="trash" onclick="l1Pick(this)">
        <div class="text-5xl">🗑️</div>
        <div class="text-lg mt-1">只能丟掉</div>
      </button>
      <button class="big-btn bg-green-300 hover:bg-green-200" data-ans="treasure" onclick="l1Pick(this)">
        <div class="text-5xl">✨</div>
        <div class="text-lg mt-1">可以再用</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <p id="l1-progress" class="text-center text-lg text-gray-500 mt-2"></p>
  </section>

  <!-- 關卡 2：分類回收（拖拉到 3 個箱子） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">咪咪：把東西拖到對的回收箱！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-blue-400 bg-blue-50" data-bin="paper">
        <div class="text-5xl">📘</div>
        <div class="text-xl font-bold text-blue-700 mt-1">紙</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-yellow-500 bg-yellow-50" data-bin="plastic">
        <div class="text-5xl">🧴</div>
        <div class="text-xl font-bold text-yellow-700 mt-1">塑膠</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-green-500 bg-green-50" data-bin="metal">
        <div class="text-5xl">🥫</div>
        <div class="text-xl font-bold text-green-700 mt-1">鐵鋁罐</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：升級改造魔法（點擊配對舊物與新寶貝） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-orange-700">咪咪：舊東西變什麼新寶貝？</p>
    </div>
    <p class="text-lg text-center text-gray-600">（先點一下舊東西，再點一下它可以變的新寶貝）</p>
    <div class="mt-4">
      <div class="text-lg font-bold text-orange-800 mb-2">舊東西 👇</div>
      <div class="grid grid-cols-3 gap-3" id="l3-olds"></div>
      <div class="text-lg font-bold text-green-800 mt-6 mb-2">新寶貝 👇</div>
      <div class="grid grid-cols-3 gap-3" id="l3-news"></div>
    </div>
    <p id="l3-feedback" class="text-2xl text-center font-bold hide mt-3"></p>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">你是咪咪的寶物小達人！</h1>
    <p class="text-2xl text-gray-700 mt-4">咪咪送你一張 <span class="text-green-600 font-bold">升級改造金徽章</span>！</p>
    <div class="flex justify-center gap-4 mt-4">
      <span class="text-5xl sparkle">✨</span>
      <span class="text-5xl sparkle" style="animation-delay:.3s">🌟</span>
      <span class="text-5xl sparkle" style="animation-delay:.6s">✨</span>
    </div>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-orange-800">回家小任務 🏠</p>
      <p class="text-2xl mt-2">找 <span class="text-green-600 font-bold">1 個</span> 家裡舊東西，<br/>和爸爸媽媽一起把它<span class="text-pink-600 font-bold">變成新寶貝</span>！</p>
      <p class="text-lg text-gray-600 mt-2">(寶特瓶 → 花盆？舊襪子 → 小玩偶？)</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#a855f7'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：垃圾 vs 寶物 ============
  // 所有東西其實都是「寶物（可再用／可回收）」，這是核心教育訊息
  const L1_ITEMS = [
    { label: '寶特瓶', ans: 'treasure', svg: '<rect x="40" y="25" width="20" height="8" fill="#60a5fa"/><rect x="38" y="33" width="24" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><rect x="40" y="40" width="20" height="8" fill="#3b82f6"/>' },
    { label: '紙箱',   ans: 'treasure', svg: '<path d="M 20 40 L 50 25 L 80 40 L 80 80 L 20 80 Z" fill="#d6a574" stroke="#92400e" stroke-width="2"/><line x1="50" y1="25" x2="50" y2="80" stroke="#92400e" stroke-width="2"/>' },
    { label: '舊襪子', ans: 'treasure', svg: '<path d="M 35 20 L 35 55 Q 35 70 45 70 L 70 70 Q 75 70 75 65 L 75 60 Q 75 55 70 55 L 55 55 L 55 20 Z" fill="#f472b6" stroke="#be185d" stroke-width="2"/><circle cx="45" cy="30" r="3" fill="#fef3c7"/><circle cx="45" cy="40" r="3" fill="#fef3c7"/>' },
    { label: '鐵鋁罐', ans: 'treasure', svg: '<rect x="35" y="20" width="30" height="60" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/><rect x="35" y="28" width="30" height="4" fill="#e0e7ff"/><ellipse cx="50" cy="20" rx="15" ry="4" fill="#cbd5e1"/>' }
  ];
  let l1Index = 0;
  let l1Correct = 0;

  function loadLevel1() {
    l1Index = 0;
    l1Correct = 0;
    showL1Item();
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function showL1Item() {
    const it = L1_ITEMS[l1Index];
    document.getElementById('l1-item').innerHTML = it.svg;
    document.getElementById('l1-item-label').textContent = it.label;
    document.getElementById('l1-progress').textContent = `第 ${l1Index + 1} / ${L1_ITEMS.length} 個`;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const it = L1_ITEMS[l1Index];
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === it.ans) {
      l1Correct++;
      fb.textContent = '🎉 答對啦！它還可以再用！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-green-500 popin';
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      confetti();
      setTimeout(() => {
        l1Index++;
        if (l1Index >= L1_ITEMS.length) {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        } else {
          showL1Item();
        }
      }, 1400);
    } else {
      fb.textContent = '😊 想一想：它真的只能丟嗎？';
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：分類拖拉 ============
  const L2_ITEMS = [
    { id: 'newspaper', label: '報紙',     bin: 'paper',   emoji: '📰' },
    { id: 'bottle',    label: '寶特瓶',   bin: 'plastic', emoji: '🧴' },
    { id: 'can',       label: '鋁罐',     bin: 'metal',   emoji: '🥫' },
    { id: 'book',      label: '舊書',     bin: 'paper',   emoji: '📚' },
    { id: 'bag',       label: '塑膠袋',   bin: 'plastic', emoji: '🛍️' },
    { id: 'tin',       label: '鐵罐',     bin: 'metal',   emoji: '🍱' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg p-3';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.bin = it.bin;
      d.innerHTML = `<div class="text-4xl">${it.emoji}</div><div class="text-base text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.bin === z.dataset.bin) {
      src.classList.add('popin');
      src.classList.remove('cursor-grab');
      src.draggable = false;
      z.appendChild(src);
      l2Correct++;
      const fb = document.getElementById('l2-feedback');
      if (l2Correct === L2_ITEMS.length) {
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！分類大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        fb.classList.remove('hide');
        fb.textContent = `✨ 做到 ${l2Correct} / ${L2_ITEMS.length} 個！繼續～`;
        fb.className = 'text-xl font-bold text-green-500 popin';
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再試試看！想一想它是什麼做的～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：升級改造配對（先點舊物，再點新寶貝） ============
  const L3_PAIRS = [
    { id: 'p1', old: { emoji: '🧴', label: '寶特瓶' },  neu: { emoji: '🪴', label: '花盆' } },
    { id: 'p2', old: { emoji: '🧦', label: '舊襪子' },  neu: { emoji: '🧸', label: '小玩偶' } },
    { id: 'p3', old: { emoji: '📦', label: '紙箱' },    neu: { emoji: '🏠', label: '小房子' } }
  ];
  let l3Old = null;
  let l3Matched = 0;

  function loadLevel3() {
    l3Old = null;
    l3Matched = 0;
    const oldBox = document.getElementById('l3-olds');
    const newBox = document.getElementById('l3-news');
    oldBox.innerHTML = '';
    newBox.innerHTML = '';

    L3_PAIRS.slice().sort(() => Math.random()-0.5).forEach(p => {
      const o = document.createElement('button');
      o.className = 'card bg-orange-100 hover:bg-orange-200 p-3 flex flex-col items-center';
      o.dataset.pair = p.id;
      o.innerHTML = `<div class="text-5xl">${p.old.emoji}</div><div class="mt-1 text-base font-bold">${p.old.label}</div>`;
      o.onclick = () => selectOld(o);
      oldBox.appendChild(o);
    });

    L3_PAIRS.slice().sort(() => Math.random()-0.5).forEach(p => {
      const n = document.createElement('button');
      n.className = 'card bg-green-100 hover:bg-green-200 p-3 flex flex-col items-center';
      n.dataset.pair = p.id;
      n.innerHTML = `<div class="text-5xl">${p.neu.emoji}</div><div class="mt-1 text-base font-bold">${p.neu.label}</div>`;
      n.onclick = () => selectNew(n);
      newBox.appendChild(n);
    });

    document.getElementById('l3-feedback').classList.add('hide');
  }

  function selectOld(btn) {
    if (btn.disabled) return;
    if (l3Old) l3Old.classList.remove('ring-4','ring-pink-400');
    l3Old = btn;
    btn.classList.add('ring-4','ring-pink-400');
  }

  function selectNew(btn) {
    if (btn.disabled) return;
    const fb = document.getElementById('l3-feedback');
    if (!l3Old) {
      fb.classList.remove('hide');
      fb.textContent = '😊 先點一個舊東西喔！';
      fb.className = 'text-xl text-center font-bold text-orange-500 mt-3';
      return;
    }
    fb.classList.remove('hide');
    if (l3Old.dataset.pair === btn.dataset.pair) {
      l3Old.classList.remove('ring-4','ring-pink-400');
      l3Old.classList.add('bg-green-200');
      btn.classList.add('bg-green-200');
      l3Old.disabled = true;
      btn.disabled = true;
      l3Old = null;
      l3Matched++;
      fb.textContent = '🎉 配對成功！魔法變出來了！';
      fb.className = 'text-2xl text-center font-bold text-green-500 popin mt-3';
      confetti();
      if (l3Matched === L3_PAIRS.length) {
        setTimeout(() => {
          STATE.level = 4;
          drawProgress();
          show('finale');
          setTimeout(confetti, 300);
          setTimeout(confetti, 900);
          setTimeout(confetti, 1500);
        }, 1500);
      }
    } else {
      btn.classList.add('wiggle');
      fb.textContent = '😊 想一想：他們有關係嗎？';
      fb.className = 'text-xl text-center font-bold text-orange-500 mt-3';
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
