<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天氣小偵探 — 小熊波波的天氣旅行</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #ffe4e6 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小熊波波 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bear">
      <circle cx="50" cy="50" r="40" fill="#d97706"/>
      <circle cx="25" cy="30" r="12" fill="#d97706"/>
      <circle cx="75" cy="30" r="12" fill="#d97706"/>
      <circle cx="25" cy="30" r="6" fill="#fbbf24"/>
      <circle cx="75" cy="30" r="6" fill="#fbbf24"/>
      <circle cx="40" cy="45" r="4" fill="black"/>
      <circle cx="60" cy="45" r="4" fill="black"/>
      <ellipse cx="50" cy="60" rx="8" ry="6" fill="#fbbf24"/>
      <circle cx="50" cy="58" r="3" fill="black"/>
      <path d="M 40 68 Q 50 78 60 68" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#bear"/></svg>
    <span>小熊波波的天氣旅行</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bear"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">嗨！我是波波！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-pink-500 font-bold">天氣小偵探</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：今天天氣點一點 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-amber-700">波波：今天是什麼天氣？點一點你覺得對的！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">下面這張圖是...</div>
      <svg id="l1-scene" width="200" height="200" viewBox="0 0 100 100" class="mx-auto"></svg>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-blue-300 hover:bg-blue-200" data-ans="sun" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><circle cx="50" cy="50" r="28" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5"><line x1="50" y1="5" x2="50" y2="20"/><line x1="50" y1="80" x2="50" y2="95"/><line x1="5" y1="50" x2="20" y2="50"/><line x1="80" y1="50" x2="95" y2="50"/></g></svg>
      </button>
      <button class="big-btn bg-blue-300 hover:bg-blue-200" data-ans="rain" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><ellipse cx="50" cy="35" rx="32" ry="18" fill="#9ca3af"/><line x1="35" y1="60" x2="30" y2="80" stroke="#3b82f6" stroke-width="4"/><line x1="50" y1="60" x2="45" y2="80" stroke="#3b82f6" stroke-width="4"/><line x1="65" y1="60" x2="60" y2="80" stroke="#3b82f6" stroke-width="4"/></svg>
      </button>
      <button class="big-btn bg-blue-300 hover:bg-blue-200" data-ans="wind" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><path d="M 15 35 Q 55 35 75 30 Q 85 28 80 45 Q 75 50 60 45" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M 10 60 Q 50 60 70 55" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="big-btn bg-blue-300 hover:bg-blue-200" data-ans="snow" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><g stroke="#60a5fa" stroke-width="4" fill="none"><line x1="50" y1="20" x2="50" y2="80"/><line x1="20" y1="50" x2="80" y2="50"/><line x1="28" y1="28" x2="72" y2="72"/><line x1="72" y1="28" x2="28" y2="72"/></g></svg>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉四季 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-amber-700">波波：把衣服拖到對的季節！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-pink-300" data-season="summer">
        <div class="text-6xl">☀️</div>
        <div class="text-2xl font-bold text-pink-600">夏天</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-blue-300" data-season="winter">
        <div class="text-6xl">❄️</div>
        <div class="text-2xl font-bold text-blue-600">冬天</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：颱風來了，滑桿準備 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#bear"/></svg>
      <p class="text-2xl font-bold text-amber-700">波波：颱風要來了！幫我找 3 樣最重要的東西！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#bear"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">你是超棒的天氣小偵探！</h1>
    <p class="text-2xl text-gray-700 mt-4">波波送你一張 <span class="text-pink-500 font-bold">金牌偵探徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起抬頭看天空，<br/><span class="text-pink-600 font-bold">數一數有幾朵雲</span>，告訴他們雲像什麼動物！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Scene: 'sun' };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：點擊配對 ============
  function loadLevel1() {
    const scenes = [
      { key: 'sun',  svg: '<circle cx="50" cy="50" r="28" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5"><line x1="50" y1="5" x2="50" y2="20"/><line x1="50" y1="80" x2="50" y2="95"/><line x1="5" y1="50" x2="20" y2="50"/><line x1="80" y1="50" x2="95" y2="50"/><line x1="20" y1="20" x2="30" y2="30"/><line x1="70" y1="30" x2="80" y2="20"/></g>' },
      { key: 'rain', svg: '<ellipse cx="50" cy="35" rx="34" ry="18" fill="#9ca3af"/><line x1="35" y1="60" x2="30" y2="85" stroke="#3b82f6" stroke-width="5"/><line x1="50" y1="60" x2="45" y2="85" stroke="#3b82f6" stroke-width="5"/><line x1="65" y1="60" x2="60" y2="85" stroke="#3b82f6" stroke-width="5"/>' }
    ];
    const pick = scenes[Math.floor(Math.random()*scenes.length)];
    STATE.l1Scene = pick.key;
    document.getElementById('l1-scene').innerHTML = pick.svg;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Scene) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 ============
  const L2_ITEMS = [
    { id: 'tshirt',  label: 'T 恤',   season: 'summer', emoji: '👕' },
    { id: 'fan',     label: '扇子',   season: 'summer', emoji: '🪭' },
    { id: 'coat',    label: '外套',   season: 'winter', emoji: '🧥' },
    { id: 'gloves',  label: '手套',   season: 'winter', emoji: '🧤' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.season = it.season;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.season === z.dataset.season) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！季節大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再試試看！想想看夏天熱熱的、冬天冷冷的～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選 (圖示按鈕) ============
  const L3_ITEMS = [
    { id: 'water',  label: '水',        emoji: '💧', correct: true  },
    { id: 'flash',  label: '手電筒',    emoji: '🔦', correct: true  },
    { id: 'food',   label: '餅乾',      emoji: '🍪', correct: true  },
    { id: 'toy',    label: '玩具',      emoji: '🧸', correct: false },
    { id: 'ball',   label: '球',        emoji: '⚽', correct: false },
    { id: 'ice',    label: '冰淇淋',    emoji: '🍦', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你準備好了！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：颱風天要不要玩玩具？選 3 個最重要的～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
