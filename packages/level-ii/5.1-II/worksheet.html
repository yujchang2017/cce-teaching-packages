<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小豆苗的成長日記 — 豆豆的寶藏冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #d9f99d 0%, #fef3c7 50%, #ffe4e6 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bef264)} }
  .grow { animation: grow 3s ease-in-out infinite; }
  @keyframes grow { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.08)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #bef264 !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小豆苗豆豆 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="sprout">
      <!-- 花盆 -->
      <path d="M 30 80 L 70 80 L 65 95 L 35 95 Z" fill="#d97706"/>
      <rect x="28" y="76" width="44" height="6" rx="2" fill="#b45309"/>
      <!-- 莖 -->
      <path d="M 50 75 Q 48 55 50 40" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 左葉 -->
      <ellipse cx="38" cy="50" rx="14" ry="8" fill="#22c55e" transform="rotate(-30 38 50)"/>
      <!-- 右葉 -->
      <ellipse cx="62" cy="45" rx="14" ry="8" fill="#22c55e" transform="rotate(30 62 45)"/>
      <!-- 頭（豆子）-->
      <circle cx="50" cy="30" r="16" fill="#84cc16"/>
      <!-- 眼睛 -->
      <circle cx="44" cy="28" r="3" fill="black"/>
      <circle cx="56" cy="28" r="3" fill="black"/>
      <!-- 光點 -->
      <circle cx="45" cy="27" r="1" fill="white"/>
      <circle cx="57" cy="27" r="1" fill="white"/>
      <!-- 嘴 -->
      <path d="M 44 35 Q 50 40 56 35" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 紅腮 -->
      <circle cx="40" cy="33" r="2" fill="#fb7185" opacity="0.6"/>
      <circle cx="60" cy="33" r="2" fill="#fb7185" opacity="0.6"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-green-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#sprout"/></svg>
    <span>小豆苗的成長日記</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#sprout"/></svg>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">嗨！我是豆豆！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起找<span class="text-pink-500 font-bold">寶藏資源</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：點選「資源寶藏」vs「不是資源」 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#sprout"/></svg>
      <p class="text-2xl font-bold text-green-700">豆豆：哪些是我們需要的寶藏？點一點！</p>
    </div>
    <p class="text-xl text-center text-gray-600 mb-3">（選 3 個一定需要的）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l1-items">
      <!-- 6 個項目：3 對 3 錯 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l1Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l1-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 關卡 2：拖拉 — 豆苗成長需要什麼？ -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#sprout"/></svg>
      <p class="text-2xl font-bold text-green-700">豆豆：把成長魔法拖給我！</p>
    </div>
    <!-- 中央豆豆 -->
    <div class="flex justify-center my-4">
      <div class="dropzone card text-center p-6 border-4 border-dashed border-green-400 bg-green-50" data-zone="sprout" style="min-width:200px;min-height:200px">
        <svg width="140" height="140" viewBox="0 0 100 100" class="mx-auto grow"><use href="#sprout"/></svg>
        <div class="text-xl font-bold text-green-700 mt-2">把魔法拖到我身上！</div>
        <div id="l2-collected" class="flex gap-2 justify-center mt-2"></div>
      </div>
    </div>
    <p class="text-lg text-center text-gray-600">（下面 5 個，找出 3 個成長魔法：陽光、水、時間）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：節約小英雄 — 幫豆豆節省資源 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#sprout"/></svg>
      <p class="text-2xl font-bold text-green-700">豆豆：哪些是「節約小英雄」？</p>
    </div>
    <p class="text-xl text-center text-gray-600">（選出愛護資源的好行為，點選後變綠色）</p>
    <div class="grid grid-cols-2 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#sprout"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">你是超棒的資源小英雄！</h1>
    <p class="text-2xl text-gray-700 mt-4">豆豆送你一張 <span class="text-pink-500 font-bold">金色豆苗勳章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起做一個<span class="text-pink-600 font-bold">小豬撲滿</span>，<br/>每天存 1 塊錢，看看 7 天後會不會長大！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#bef264','#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：多選 — 資源寶藏 ============
  const L1_ITEMS = [
    { id: 'air',    label: '空氣',   emoji: '💨', correct: true },
    { id: 'water',  label: '水',     emoji: '💧', correct: true },
    { id: 'food',   label: '食物',   emoji: '🍎', correct: true },
    { id: 'toy',    label: '玩具',   emoji: '🧸', correct: false },
    { id: 'phone',  label: '手機',   emoji: '📱', correct: false },
    { id: 'candy',  label: '糖果',   emoji: '🍬', correct: false }
  ];
  const l1Picked = new Set();

  function loadLevel1() {
    l1Picked.clear();
    const box = document.getElementById('l1-items');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl transition-all';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l1Picked.has(it.id)) {
          l1Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l1Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function l1Check() {
    const correctIds = L1_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l1Picked.has(id)) && l1Picked.size === correctIds.length;
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 答對啦！空氣、水、食物是寶藏！';
      fb.className = 'text-2xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：哪些是「沒有就活不下去」的？';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  // ============ 關卡 2：拖拉 — 成長魔法 ============
  const L2_ITEMS = [
    { id: 'sun',    label: '陽光',     emoji: '☀️', correct: true },
    { id: 'water',  label: '水',       emoji: '💧', correct: true },
    { id: 'time',   label: '時間',     emoji: '⏰', correct: true },
    { id: 'soda',   label: '汽水',     emoji: '🥤', correct: false },
    { id: 'tv',     label: '電視',     emoji: '📺', correct: false }
  ];
  const l2Collected = new Set();

  function loadLevel2() {
    l2Collected.clear();
    document.getElementById('l2-collected').innerHTML = '';
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.correct = it.correct;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    const zone = document.querySelector('#level2 .dropzone');
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('dropzone-active'); };
    zone.ondragleave = () => zone.classList.remove('dropzone-active');
    zone.ondrop = e => {
      e.preventDefault();
      zone.classList.remove('dropzone-active');
      const id = e.dataTransfer.getData('text/plain');
      const src = document.querySelector(`#l2-items [data-id="${id}"]`);
      if (!src) return;
      handleL2Drop(src, zone);
    };
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, zone) {
    const isCorrect = src.dataset.correct === 'true';
    if (isCorrect) {
      // 收集到豆豆身上
      l2Collected.add(src.dataset.id);
      const mini = document.createElement('span');
      mini.className = 'text-3xl popin';
      mini.innerHTML = src.querySelector('div').textContent;
      document.getElementById('l2-collected').appendChild(mini);
      src.classList.add('popin');
      src.style.opacity = '0.3';
      src.draggable = false;
      // check 完成
      if (l2Collected.size === 3) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！豆豆長大了！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '✨ 好棒！再找 ' + (3 - l2Collected.size) + ' 個魔法！';
        fb.className = 'text-xl font-bold text-green-600';
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 想一想：這個是豆豆長大需要的嗎？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選 — 節約小英雄 ============
  const L3_ITEMS = [
    { id: 'tap',     label: '關水龍頭',   emoji: '🚰', correct: true },
    { id: 'light',   label: '關燈',       emoji: '💡', correct: true },
    { id: 'eat',     label: '吃光光',     emoji: '🍽️', correct: true },
    { id: 'recycle', label: '資源回收',   emoji: '♻️', correct: true },
    { id: 'waste',   label: '倒掉食物',   emoji: '🗑️', correct: false },
    { id: 'longbath',label: '洗超久',     emoji: '🛁', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你是節約小英雄！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：哪些是「愛護寶藏」的好行為？';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
