<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>好家園小記者 — 小鼴鼠阿土的家園探險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #ecfccb 0%, #fef3c7 50%, #dbeafe 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bef264)} }
  .grow { animation: grow 1.6s ease-out both; }
  @keyframes grow { 0%{transform:scale(0.3) rotate(-10deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #bef264 !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  svg * { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
  button.card, .dropzone.card { pointer-events: auto; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小鼴鼠阿土 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mole">
      <!-- 身體 -->
      <ellipse cx="50" cy="62" rx="34" ry="30" fill="#78350f"/>
      <!-- 頭 -->
      <circle cx="50" cy="42" r="26" fill="#92400e"/>
      <!-- 工程帽 -->
      <path d="M 24 34 Q 50 18 76 34 L 76 30 Q 50 16 24 30 Z" fill="#facc15"/>
      <rect x="22" y="32" width="56" height="5" fill="#ca8a04"/>
      <!-- 耳朵 -->
      <circle cx="30" cy="32" r="6" fill="#78350f"/>
      <circle cx="70" cy="32" r="6" fill="#78350f"/>
      <!-- 眼睛（小小的，鼴鼠） -->
      <circle cx="42" cy="44" r="3" fill="black"/>
      <circle cx="58" cy="44" r="3" fill="black"/>
      <circle cx="42" cy="43" r="1" fill="white"/>
      <circle cx="58" cy="43" r="1" fill="white"/>
      <!-- 粉紅鼻子 -->
      <ellipse cx="50" cy="52" rx="5" ry="4" fill="#fb7185"/>
      <!-- 嘴巴 -->
      <path d="M 44 58 Q 50 64 56 58" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 小鏟子 -->
      <rect x="14" y="60" width="3" height="18" fill="#78350f"/>
      <path d="M 10 78 L 21 78 L 19 86 L 12 86 Z" fill="#9ca3af"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-800">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#mole"/></svg>
    <span>小鼴鼠阿土的家園探險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mole"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-700 mt-4">嗨！我是阿土！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我當<span class="text-green-600 font-bold">家園小記者</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：找出家的 4 個好朋友（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿土：好家園有 4 個好朋友！點出牠！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-green-700 mb-2">請點出「<span id="l1-q" class="text-pink-600"></span>」的好朋友</div>
      <svg id="l1-hint" width="100" height="100" viewBox="0 0 100 100" class="mx-auto"></svg>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-green-200 hover:bg-green-300" data-ans="safe" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><path d="M 50 15 L 80 28 L 80 55 Q 80 78 50 88 Q 20 78 20 55 L 20 28 Z" fill="#60a5fa" stroke="#1e40af" stroke-width="3"/><text x="50" y="60" text-anchor="middle" font-size="30" fill="white" font-weight="bold">安</text></svg>
        <div class="text-xl font-bold text-blue-700 mt-1">安全</div>
      </button>
      <button class="big-btn bg-green-200 hover:bg-green-300" data-ans="durable" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><rect x="20" y="20" width="60" height="60" fill="#a78bfa" stroke="#6d28d9" stroke-width="3" rx="10"/><text x="50" y="60" text-anchor="middle" font-size="28" fill="white" font-weight="bold">耐</text></svg>
        <div class="text-xl font-bold text-purple-700 mt-1">耐用</div>
      </button>
      <button class="big-btn bg-green-200 hover:bg-green-300" data-ans="affordable" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><circle cx="50" cy="50" r="35" fill="#fbbf24" stroke="#b45309" stroke-width="3"/><text x="50" y="62" text-anchor="middle" font-size="30" fill="#7c2d12" font-weight="bold">$</text></svg>
        <div class="text-xl font-bold text-amber-700 mt-1">好付錢</div>
      </button>
      <button class="big-btn bg-green-200 hover:bg-green-300" data-ans="healthy" onclick="l1Pick(this)">
        <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><path d="M 50 80 Q 15 55 15 35 Q 15 20 30 20 Q 42 20 50 32 Q 58 20 70 20 Q 85 20 85 35 Q 85 55 50 80 Z" fill="#f472b6" stroke="#be185d" stroke-width="3"/></svg>
        <div class="text-xl font-bold text-pink-700 mt-1">健康</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <div class="text-center mt-2 text-sm text-gray-500" id="l1-progress">已完成 <span id="l1-count">0</span> / 4</div>
  </section>

  <!-- 關卡 2：拖拉綠朋友 vs 灰朋友 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿土：把東西拖到對的家！</p>
    </div>
    <p class="text-lg text-center text-gray-600">綠綠藍藍讓家更好，灰灰的要少一點</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400 bg-green-50" data-zone="good">
        <div class="text-6xl">🌳</div>
        <div class="text-2xl font-bold text-green-700">好家園</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-gray-400 bg-gray-50" data-zone="bad">
        <div class="text-6xl">🏭</div>
        <div class="text-2xl font-bold text-gray-600">可以少一點</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：我是家園小英雄 — 多選 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">阿土：選 3 件你可以在家做的好事！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mole"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">你是超棒的家園小英雄！</h1>
    <p class="text-2xl text-gray-700 mt-4">阿土送你一張 <span class="text-amber-600 font-bold">金牌家園徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">親子小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起玩「家園尋寶」：<br/>
      找 <span class="text-pink-600 font-bold">3 個安全的地方</span>＋<span class="text-green-600 font-bold">1 個綠朋友</span>＋<span class="text-blue-600 font-bold">1 個藍朋友</span>，明天告訴老師！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#84cc16','#facc15','#60a5fa','#f472b6','#fb923c'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：配對 4 個好朋友 ============
  const L1_QUESTIONS = [
    { key: 'safe',       zh: '不會倒、不會淹水',      hint: '<path d="M 50 15 L 80 28 L 80 55 Q 80 78 50 88 Q 20 78 20 55 L 20 28 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>' },
    { key: 'durable',    zh: '住很久、不壞掉',        hint: '<rect x="20" y="20" width="60" height="60" fill="#ede9fe" stroke="#6d28d9" stroke-width="3" rx="10"/><text x="50" y="62" text-anchor="middle" font-size="24" fill="#6d28d9" font-weight="bold">久</text>' },
    { key: 'affordable', zh: '爸媽付得起、不辛苦',    hint: '<circle cx="50" cy="50" r="35" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="50" y="62" text-anchor="middle" font-size="30" fill="#b45309" font-weight="bold">$</text>' },
    { key: 'healthy',    zh: '空氣好、住起來舒服',    hint: '<path d="M 50 80 Q 15 55 15 35 Q 15 20 30 20 Q 42 20 50 32 Q 58 20 70 20 Q 85 20 85 35 Q 85 55 50 80 Z" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>' }
  ];
  let l1Index = 0;
  let l1Done = 0;
  let l1Order = [];

  function loadLevel1() {
    l1Index = 0;
    l1Done = 0;
    l1Order = L1_QUESTIONS.slice().sort(() => Math.random()-0.5);
    showL1Question();
  }

  function showL1Question() {
    if (l1Index >= l1Order.length) {
      // 完成關卡 1
      STATE.level = 2;
      drawProgress();
      loadLevel2();
      show('level2');
      return;
    }
    const q = l1Order[l1Index];
    document.getElementById('l1-q').textContent = q.zh;
    document.getElementById('l1-hint').innerHTML = q.hint;
    document.getElementById('l1-feedback').classList.add('hide');
    document.getElementById('l1-count').textContent = l1Done;
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    const currentKey = l1Order[l1Index].key;
    if (btn.dataset.ans === currentKey) {
      l1Done++;
      document.getElementById('l1-count').textContent = l1Done;
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-600 popin';
      btn.classList.add('popin');
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        l1Index++;
        showL1Question();
      }, 1300);
    } else {
      fb.textContent = '😊 想一想，再試試看！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉（綠好家園 vs 灰少一點） ============
  const L2_ITEMS = [
    { id: 'tree',    label: '大樹',     zone: 'good', emoji: '🌳' },
    { id: 'water',   label: '小河',     zone: 'good', emoji: '💧' },
    { id: 'plant',   label: '盆栽',     zone: 'good', emoji: '🪴' },
    { id: 'smoke',   label: '黑煙',     zone: 'bad',  emoji: '💨' },
    { id: 'trash',   label: '垃圾堆',   zone: 'bad',  emoji: '🗑️' },
    { id: 'factory', label: '很多廢氣', zone: 'bad',  emoji: '🏭' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.zone = it.zone;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.zone === z.dataset.zone) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！你是分類小高手！';
        fb.className = 'text-3xl font-bold text-green-600 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想：綠綠藍藍的對家好，灰灰冒煙的可以少一點～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-green-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-green-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-green-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選（家園小英雄） ============
  const L3_ITEMS = [
    { id: 'light',  label: '關燈',       emoji: '💡', correct: true  },
    { id: 'window', label: '開窗通風',   emoji: '🪟', correct: true  },
    { id: 'plant',  label: '澆花',       emoji: '🪴', correct: true  },
    { id: 'water',  label: '關水龍頭',   emoji: '🚰', correct: true  },
    { id: 'tv',     label: '開很久電視', emoji: '📺', correct: false },
    { id: 'ac',     label: '空調開整天', emoji: '❄️', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-lime-100 hover:bg-lime-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-base font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-lime-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-lime-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    // 規則：選 3 個，且全部都是 correct=true
    const picks = [...l3Picked];
    const allCorrect = picks.every(id => L3_ITEMS.find(x => x.id === id).correct);
    const countOk = picks.length === 3;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (countOk && allCorrect) {
      fb.textContent = '🎉 超棒！你是家園小英雄！';
      fb.className = 'text-3xl font-bold text-green-600 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else if (!countOk) {
      fb.textContent = '😊 請選 3 個，不多也不少～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    } else {
      fb.textContent = '😊 想一想：開很久的電器對家好嗎？換一個試試～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
