<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小小地球守護員 — 咚咚鼴鼠的環保大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #d9f99d 60%, #a7f3d0 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  svg * { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：咚咚鼴鼠 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mole">
      <!-- 身體（深棕） -->
      <ellipse cx="50" cy="58" rx="38" ry="34" fill="#78350f"/>
      <!-- 肚子（淺棕） -->
      <ellipse cx="50" cy="70" rx="24" ry="18" fill="#fcd34d"/>
      <!-- 雙耳（小小的） -->
      <circle cx="22" cy="32" r="8" fill="#78350f"/>
      <circle cx="78" cy="32" r="8" fill="#78350f"/>
      <circle cx="22" cy="32" r="4" fill="#fcd34d"/>
      <circle cx="78" cy="32" r="4" fill="#fcd34d"/>
      <!-- 眼睛（閉著：小鼴鼠視力弱，但是會溫柔微笑） -->
      <path d="M 35 48 Q 40 44 45 48" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 55 48 Q 60 44 65 48" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 粉色大鼻子 -->
      <ellipse cx="50" cy="58" rx="7" ry="5" fill="#f472b6"/>
      <!-- 微笑 -->
      <path d="M 42 68 Q 50 74 58 68" stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 小爪子（兩隻手往前） -->
      <ellipse cx="28" cy="82" rx="6" ry="5" fill="#fcd34d"/>
      <ellipse cx="72" cy="82" rx="6" ry="5" fill="#fcd34d"/>
      <!-- 工程帽（黃色） -->
      <path d="M 22 25 Q 50 5 78 25 L 78 30 L 22 30 Z" fill="#facc15"/>
      <rect x="20" y="28" width="60" height="4" fill="#eab308"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-900">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#mole"/></svg>
    <span>咚咚鼴鼠的環保大冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mole"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-700 mt-4">嗨！我是咚咚！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-green-600 font-bold">地球小守護員</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個環保小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：垃圾寶寶分類（拖拉） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">把垃圾寶寶送回家！</p>
    </div>
    <div id="l1-items" class="flex justify-around my-4 flex-wrap gap-3">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-red-300 bg-red-50" data-cat="general">
        <div class="text-5xl">🗑️</div>
        <div class="text-xl font-bold text-red-600">一般</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-blue-300 bg-blue-50" data-cat="recycle">
        <div class="text-5xl">♻️</div>
        <div class="text-xl font-bold text-blue-600">回收</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-green-300 bg-green-50" data-cat="food">
        <div class="text-5xl">🍎</div>
        <div class="text-xl font-bold text-green-600">廚餘</div>
      </div>
      <div class="dropzone card text-center h-36 flex flex-col items-center justify-center border-4 border-dashed border-amber-400 bg-amber-50" data-cat="big">
        <div class="text-5xl">🛋️</div>
        <div class="text-xl font-bold text-amber-700">大垃圾</div>
      </div>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：3R 魔法手指 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">哪一個是最棒的環保？</p>
    </div>
    <div class="text-center my-4">
      <p class="text-xl text-gray-600">咚咚說：3R 裡面，「少買」排第一！</p>
    </div>
    <div id="l2-scene" class="text-center my-4">
      <p class="text-2xl font-bold text-pink-600 mb-2" id="l2-question"></p>
    </div>
    <div class="grid grid-cols-1 gap-3 mt-4" id="l2-options">
      <!-- 選項 -->
    </div>
    <p id="l2-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 3：5 指任務 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mole"/></svg>
      <p class="text-2xl font-bold text-amber-800">咚咚到你家檢查！勾選今天做到的 3 件事！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就勾起來，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 5 個任務 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-500 hover:bg-green-400 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mole"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">你是超棒的地球小守護員！</h1>
    <p class="text-2xl text-gray-700 mt-4">咚咚送你一個 <span class="text-amber-600 font-bold">綠色徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起比 <span class="text-green-600 font-bold">五根手指頭</span>！<br/>關燈、水壺、分類、吃光、走路，做到一項就勾一個！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-500 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#22c55e','#34d399','#60a5fa','#f97316','#f472b6'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：垃圾分類拖拉 ============
  const L1_ITEMS = [
    { id: 'banana',  label: '香蕉皮',  cat: 'food',    emoji: '🍌' },
    { id: 'bottle',  label: '塑膠瓶',  cat: 'recycle', emoji: '🥤' },
    { id: 'tissue',  label: '衛生紙',  cat: 'general', emoji: '🧻' },
    { id: 'sofa',    label: '壞沙發',  cat: 'big',     emoji: '🛋️' }
  ];
  let l1Correct = 0;

  function loadLevel1() {
    l1Correct = 0;
    const box = document.getElementById('l1-items');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.cat = it.cat;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-base text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level1 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l1-items [data-id="${id}"]`);
        if (!src) return;
        handleL1Drop(src, z);
      };
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function handleL1Drop(src, z) {
    const fb = document.getElementById('l1-feedback');
    if (src.dataset.cat === z.dataset.cat) {
      src.classList.add('popin');
      src.style.width = '60px';
      src.style.height = '60px';
      src.style.fontSize = '1rem';
      z.appendChild(src);
      src.draggable = false;
      l1Correct++;
      if (l1Correct === L1_ITEMS.length) {
        fb.classList.remove('hide');
        fb.textContent = '🎉 四種都送對家！超棒！';
        fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想一想，這個要去哪個家？';
      fb.className = 'text-xl font-bold text-orange-500 text-center mt-3';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l1Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l1Selected) l1Selected.classList.remove('ring-4','ring-pink-400');
    l1Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l1Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL1Drop(l1Selected, zone);
    }
    l1Selected.classList.remove('ring-4','ring-pink-400');
    l1Selected = null;
  });

  // ============ 關卡 2：3R 選擇題（學會 Reduce 最棒） ============
  const L2_QUESTIONS = [
    {
      q: '要喝水了，哪個最棒？',
      options: [
        { text: '買新的寶特瓶', emoji: '🥤', tag: 'R3', correct: false },
        { text: '帶自己的水壺', emoji: '🍼', tag: 'R1', correct: true },
        { text: '用過就丟', emoji: '🗑️', tag: 'bad', correct: false }
      ]
    },
    {
      q: '哥哥的衣服小了，怎麼辦？',
      options: [
        { text: '丟進垃圾桶', emoji: '🗑️', tag: 'bad', correct: false },
        { text: '送給弟弟穿', emoji: '🧥', tag: 'R2', correct: true },
        { text: '買新的', emoji: '🛍️', tag: 'R3', correct: false }
      ]
    }
  ];
  let l2Idx = 0;

  function loadLevel2() {
    l2Idx = 0;
    showL2Question();
  }

  function showL2Question() {
    const q = L2_QUESTIONS[l2Idx];
    document.getElementById('l2-question').textContent = q.q;
    const box = document.getElementById('l2-options');
    box.innerHTML = '';
    q.options.slice().sort(() => Math.random()-0.5).forEach(opt => {
      const b = document.createElement('button');
      b.className = 'big-btn bg-sky-200 hover:bg-sky-100 text-amber-900 flex items-center justify-center gap-3';
      b.innerHTML = `<span class="text-4xl">${opt.emoji}</span><span class="text-xl">${opt.text}</span>`;
      b.onclick = () => handleL2Pick(b, opt);
      box.appendChild(b);
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Pick(btn, opt) {
    const fb = document.getElementById('l2-feedback');
    fb.classList.remove('hide');
    if (opt.correct) {
      fb.textContent = '🎉 答對啦！你好厲害！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#l2-options button').forEach(b => b.disabled = true);
      setTimeout(() => {
        l2Idx++;
        if (l2Idx < L2_QUESTIONS.length) {
          showL2Question();
        } else {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，哪個對地球最好？';
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 3：5 指任務（選 3 個做到的） ============
  const L3_ITEMS = [
    { id: 'light', label: '關燈', emoji: '💡' },
    { id: 'bottle', label: '帶水壺', emoji: '🍼' },
    { id: 'sort', label: '分垃圾', emoji: '♻️' },
    { id: 'eat', label: '吃光光', emoji: '🍚' },
    { id: 'walk', label: '走路', emoji: '👣' },
    { id: 'plant', label: '澆花', emoji: '🌱' }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-green-50 hover:bg-green-100 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-500','bg-yellow-100');
          b.classList.add('bg-green-50');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-500','bg-yellow-100');
          b.classList.remove('bg-green-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (l3Picked.size >= 3) {
      fb.textContent = '🎉 超棒！你是守護員達人！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 再選 ' + (3 - l3Picked.size) + ' 個你做到的～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
