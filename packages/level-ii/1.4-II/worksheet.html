<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小水滴旅行家 — 點點的大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #dbeafe 0%, #ccfbf1 50%, #fef9c3 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bae6fd)} }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #bfdbfe !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
  .raindrop {
    position: absolute;
    width: 10px; height: 20px;
    background: #60a5fa;
    border-radius: 0 50% 50% 50%;
    transform: rotate(-135deg);
    opacity: 0.7;
    pointer-events: none;
  }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小水滴點點 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="drop">
      <!-- 水滴身體 -->
      <path d="M 50 10 C 70 35 80 55 70 75 C 60 92 40 92 30 75 C 20 55 30 35 50 10 Z"
            fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
      <!-- 高光 -->
      <ellipse cx="42" cy="40" rx="6" ry="10" fill="#bfdbfe" opacity="0.8"/>
      <!-- 眼睛 -->
      <circle cx="40" cy="60" r="5" fill="white"/>
      <circle cx="60" cy="60" r="5" fill="white"/>
      <circle cx="41" cy="61" r="3" fill="black"/>
      <circle cx="61" cy="61" r="3" fill="black"/>
      <!-- 臉頰 -->
      <circle cx="32" cy="72" r="3" fill="#fca5a5" opacity="0.7"/>
      <circle cx="68" cy="72" r="3" fill="#fca5a5" opacity="0.7"/>
      <!-- 嘴巴 -->
      <path d="M 42 78 Q 50 85 58 78" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-blue-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#drop"/></svg>
    <span>點點的大冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#drop"/></svg>
    <h1 class="text-4xl font-extrabold text-blue-600 mt-4">嗨！我是點點！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起<span class="text-teal-500 font-bold">去旅行</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-blue-400 hover:bg-blue-300 text-white mt-6">開始</button>
  </section>

  <!-- 關卡 1：水的旅行順序 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#drop"/></svg>
      <p class="text-2xl font-bold text-blue-700">點點：幫我找回家的路！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（照順序點：太陽 → 雲 → 雨）</p>

    <div class="grid grid-cols-3 gap-4 mt-6" id="l1-items">
      <!-- 3 張大圖卡，隨機順序 -->
    </div>
    <div class="text-center mt-4">
      <p class="text-xl font-bold text-blue-600">已選：<span id="l1-picked">0</span> / 3</p>
      <p id="l1-feedback" class="text-2xl font-bold hide mt-2"></p>
    </div>
  </section>

  <!-- 關卡 2：誰口渴了？ -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#drop"/></svg>
      <p class="text-2xl font-bold text-blue-700">點點：哪一朵小花口渴了？點它！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（葉子垂垂的就是口渴喔）</p>

    <div class="grid grid-cols-3 gap-4 mt-6" id="l2-flowers">
      <!-- 3 朵花，一朵垂 -->
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：節水小超人 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#drop"/></svg>
      <p class="text-2xl font-bold text-blue-700">點點：選出節水好行為！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（選 2 個小超人會做的好事）</p>
    <div class="grid grid-cols-2 gap-3 mt-4" id="l3-items">
      <!-- 4 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-teal-400 hover:bg-teal-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#drop"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆💧</div>
    <h1 class="text-4xl font-extrabold text-blue-600 mt-4">你是超棒的節水小超人！</h1>
    <p class="text-2xl text-gray-700 mt-4">點點送你一顆 <span class="text-teal-500 font-bold">閃亮水滴徽章</span>！</p>
    <div class="card mt-6 bg-blue-50 border-4 border-blue-300">
      <p class="text-xl font-bold text-blue-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天回家，和爸爸媽媽一起<br/><span class="text-teal-600 font-bold">找 5 個「水住的地方」</span>，拍手慶祝！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-blue-400 hover:bg-blue-300 text-white mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-blue-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#3b82f6','#60a5fa','#14b8a6','#a78bfa','#fbbf24'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：水的旅行順序 ============
  const L1_CARDS = [
    { key: 'sun',   label: '太陽', order: 1,
      svg: '<circle cx="50" cy="50" r="28" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5"><line x1="50" y1="5" x2="50" y2="20"/><line x1="50" y1="80" x2="50" y2="95"/><line x1="5" y1="50" x2="20" y2="50"/><line x1="80" y1="50" x2="95" y2="50"/><line x1="20" y1="20" x2="30" y2="30"/><line x1="70" y1="30" x2="80" y2="20"/></g><circle cx="42" cy="45" r="3" fill="#78350f"/><circle cx="58" cy="45" r="3" fill="#78350f"/><path d="M 42 55 Q 50 60 58 55" stroke="#78350f" stroke-width="2" fill="none"/>'
    },
    { key: 'cloud', label: '雲', order: 2,
      svg: '<ellipse cx="50" cy="55" rx="38" ry="22" fill="white" stroke="#94a3b8" stroke-width="3"/><circle cx="32" cy="45" r="14" fill="white" stroke="#94a3b8" stroke-width="3"/><circle cx="55" cy="38" r="16" fill="white" stroke="#94a3b8" stroke-width="3"/><circle cx="72" cy="48" r="12" fill="white" stroke="#94a3b8" stroke-width="3"/><circle cx="42" cy="55" r="2.5" fill="black"/><circle cx="58" cy="55" r="2.5" fill="black"/><path d="M 44 63 Q 50 68 56 63" stroke="black" stroke-width="2" fill="none"/>'
    },
    { key: 'rain',  label: '雨', order: 3,
      svg: '<ellipse cx="50" cy="30" rx="35" ry="16" fill="#64748b"/><line x1="30" y1="50" x2="26" y2="75" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="45" y1="52" x2="41" y2="78" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="50" x2="56" y2="75" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="74" y1="52" x2="70" y2="78" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>'
    }
  ];
  let l1Picked = [];

  function loadLevel1() {
    l1Picked = [];
    document.getElementById('l1-picked').textContent = '0';
    document.getElementById('l1-feedback').classList.add('hide');
    const shuffled = [...L1_CARDS].sort(() => Math.random() - 0.5);
    const box = document.getElementById('l1-items');
    box.innerHTML = '';
    shuffled.forEach(card => {
      const btn = document.createElement('button');
      btn.className = 'card flex flex-col items-center gap-2 border-4 border-blue-200 hover:border-blue-400 transition';
      btn.dataset.key = card.key;
      btn.dataset.order = card.order;
      btn.innerHTML = `
        <svg width="100" height="100" viewBox="0 0 100 100" class="float">${card.svg}</svg>
        <span class="text-2xl font-bold text-blue-800">${card.label}</span>
      `;
      btn.onclick = () => l1Click(btn, card);
      box.appendChild(btn);
    });
  }

  function l1Click(btn, card) {
    if (btn.dataset.picked === '1') return;
    const expected = l1Picked.length + 1;
    const fb = document.getElementById('l1-feedback');
    if (parseInt(card.order) === expected) {
      btn.dataset.picked = '1';
      btn.classList.add('bg-green-100','border-green-400');
      btn.innerHTML += `<div class="text-3xl font-extrabold text-green-500">${expected}</div>`;
      l1Picked.push(card.key);
      document.getElementById('l1-picked').textContent = l1Picked.length;
      // tiny sparkle
      fb.classList.remove('hide');
      fb.textContent = '✨ 答對啦！';
      fb.className = 'text-2xl font-bold text-green-500 popin';
      setTimeout(() => fb.classList.add('hide'), 700);

      if (l1Picked.length === 3) {
        confetti();
        fb.classList.remove('hide');
        fb.textContent = '🎉 點點找到家啦！';
        fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
        setTimeout(() => {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }, 1600);
      }
    } else {
      fb.classList.remove('hide');
      fb.textContent = '😊 想一想，太陽先？雲呢？';
      fb.className = 'text-2xl font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：誰口渴了？ ============
  const L2_FLOWERS = [
    { id: 'happy1', thirsty: false,
      svg: '<circle cx="50" cy="35" r="18" fill="#f472b6"/><circle cx="35" cy="25" r="12" fill="#f472b6"/><circle cx="65" cy="25" r="12" fill="#f472b6"/><circle cx="35" cy="45" r="12" fill="#f472b6"/><circle cx="65" cy="45" r="12" fill="#f472b6"/><circle cx="50" cy="35" r="9" fill="#fbbf24"/><line x1="50" y1="52" x2="50" y2="90" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><path d="M 50 70 Q 30 60 20 70 Q 35 80 50 75" fill="#16a34a"/><path d="M 50 75 Q 70 65 80 75 Q 65 85 50 80" fill="#16a34a"/>'
    },
    { id: 'thirsty', thirsty: true,
      svg: '<circle cx="50" cy="40" r="16" fill="#fda4af" opacity="0.7"/><circle cx="38" cy="32" r="10" fill="#fda4af" opacity="0.7"/><circle cx="62" cy="32" r="10" fill="#fda4af" opacity="0.7"/><circle cx="50" cy="40" r="7" fill="#fbbf24" opacity="0.7"/><line x1="50" y1="55" x2="52" y2="90" stroke="#a3a3a3" stroke-width="4" stroke-linecap="round"/><path d="M 52 75 Q 40 85 30 95" stroke="#a3a3a3" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M 52 78 Q 65 90 75 95" stroke="#a3a3a3" stroke-width="4" fill="none" stroke-linecap="round"/><text x="20" y="25" font-size="14">💦❓</text>'
    },
    { id: 'happy2', thirsty: false,
      svg: '<circle cx="50" cy="35" r="18" fill="#60a5fa"/><circle cx="35" cy="25" r="12" fill="#60a5fa"/><circle cx="65" cy="25" r="12" fill="#60a5fa"/><circle cx="35" cy="45" r="12" fill="#60a5fa"/><circle cx="65" cy="45" r="12" fill="#60a5fa"/><circle cx="50" cy="35" r="9" fill="#fbbf24"/><line x1="50" y1="52" x2="50" y2="90" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><path d="M 50 65 Q 28 55 18 62 Q 35 75 50 70" fill="#16a34a"/><path d="M 50 78 Q 72 68 82 78 Q 65 88 50 82" fill="#16a34a"/>'
    }
  ];

  function loadLevel2() {
    document.getElementById('l2-feedback').classList.add('hide');
    const box = document.getElementById('l2-flowers');
    box.innerHTML = '';
    const shuffled = [...L2_FLOWERS].sort(() => Math.random() - 0.5);
    shuffled.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'card flex flex-col items-center border-4 border-pink-200 hover:border-pink-400 transition';
      btn.innerHTML = `<svg width="130" height="130" viewBox="0 0 100 100">${f.svg}</svg>`;
      btn.onclick = () => l2Pick(btn, f);
      box.appendChild(btn);
    });
  }

  function l2Pick(btn, flower) {
    const fb = document.getElementById('l2-feedback');
    fb.classList.remove('hide');
    if (flower.thirsty) {
      fb.textContent = '🎉 你好貼心～幫小花澆水吧！';
      fb.className = 'text-2xl font-bold text-green-500 popin';
      // 澆水動畫
      const rect = btn.getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        const d = document.createElement('div');
        d.className = 'raindrop';
        d.style.left = (rect.left + rect.width/2 + (Math.random()-0.5)*40) + 'px';
        d.style.top = (rect.top - 20) + 'px';
        document.body.appendChild(d);
        d.animate([
          { transform: 'translate(0,0) rotate(-135deg)', opacity: 0.9 },
          { transform: 'translate(0, 80px) rotate(-135deg)', opacity: 0 }
        ], { duration: 1000, easing: 'ease-in' });
        setTimeout(() => d.remove(), 1100);
      }
      confetti();
      setTimeout(() => {
        STATE.level = 3;
        drawProgress();
        loadLevel3();
        show('level3');
      }, 1800);
    } else {
      fb.textContent = '😊 它看起來很開心！再找找葉子垂垂的那朵～';
      fb.className = 'text-2xl font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 3：節水小超人 ============
  const L3_ITEMS = [
    { id: 'tap_off', ok: true, emoji: '🚰', label: '關緊水龍頭' },
    { id: 'rain_bucket', ok: true, emoji: '🪣', label: '接雨水' },
    { id: 'leave_tap', ok: false, emoji: '💧', label: '水龍頭一直開著' },
    { id: 'waste_water', ok: false, emoji: '🗑️', label: '倒掉剩水' }
  ];
  let l3Selected = new Set();

  function loadLevel3() {
    l3Selected.clear();
    document.getElementById('l3-feedback').classList.add('hide');
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    const shuffled = [...L3_ITEMS].sort(() => Math.random() - 0.5);
    shuffled.forEach(it => {
      const btn = document.createElement('button');
      btn.className = 'card flex flex-col items-center border-4 border-teal-200 hover:border-teal-400 transition';
      btn.dataset.id = it.id;
      btn.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="text-xl font-bold text-teal-800 mt-2">${it.label}</div>`;
      btn.onclick = () => l3Toggle(btn, it);
      box.appendChild(btn);
    });
  }

  function l3Toggle(btn, it) {
    if (l3Selected.has(it.id)) {
      l3Selected.delete(it.id);
      btn.classList.remove('bg-yellow-100','border-yellow-500');
    } else {
      l3Selected.add(it.id);
      btn.classList.add('bg-yellow-100','border-yellow-500','popin');
    }
  }

  function l3Check() {
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    // 正確：必須選到兩個 ok 的，且沒選錯的
    const goodIds = L3_ITEMS.filter(x => x.ok).map(x => x.id);
    const pickedGood = goodIds.filter(id => l3Selected.has(id)).length;
    const pickedBad = [...l3Selected].filter(id => {
      const o = L3_ITEMS.find(x => x.id === id);
      return o && !o.ok;
    }).length;

    if (pickedGood === 2 && pickedBad === 0) {
      fb.textContent = '🎉 你是節水小超人！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
      }, 1800);
    } else if (pickedBad > 0) {
      fb.textContent = '😊 有一個不太對喔～想想哪個會浪費水？';
      fb.className = 'text-2xl font-bold text-orange-500 mt-3';
    } else {
      fb.textContent = '😊 還差一個！再多選一個小超人行為！';
      fb.className = 'text-2xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    drawProgress();
    show('intro');
  }

  // 初始化
  drawProgress();
</script>

</body>
</html>
