<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>颱風小偵探 — 阿平浣熊的安全探險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #dbeafe 50%, #d1fae5 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .spin-slow { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：阿平浣熊 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="raccoon">
      <!-- 身體/頭 -->
      <circle cx="50" cy="52" r="38" fill="#94a3b8"/>
      <!-- 耳朵 -->
      <circle cx="22" cy="28" r="10" fill="#64748b"/>
      <circle cx="78" cy="28" r="10" fill="#64748b"/>
      <circle cx="22" cy="28" r="5" fill="#f472b6"/>
      <circle cx="78" cy="28" r="5" fill="#f472b6"/>
      <!-- 黑眼罩 -->
      <ellipse cx="35" cy="48" rx="10" ry="7" fill="#1f2937"/>
      <ellipse cx="65" cy="48" rx="10" ry="7" fill="#1f2937"/>
      <!-- 眼睛 -->
      <circle cx="35" cy="48" r="3" fill="white"/>
      <circle cx="65" cy="48" r="3" fill="white"/>
      <circle cx="35" cy="48" r="1.5" fill="black"/>
      <circle cx="65" cy="48" r="1.5" fill="black"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="62" rx="5" ry="4" fill="#1f2937"/>
      <!-- 嘴 -->
      <path d="M 42 72 Q 50 80 58 72" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 黃色雨衣帽子 -->
      <path d="M 12 30 Q 50 -5 88 30 L 82 38 Q 50 15 18 38 Z" fill="#fbbf24"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#raccoon"/></svg>
    <span>阿平的安全探險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#raccoon"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">嗨！我是阿平！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-pink-500 font-bold">颱風小偵探</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：5 位天氣客人配對 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#raccoon"/></svg>
      <p class="text-2xl font-bold text-amber-700">阿平：這是誰？點一點名字！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <svg id="l1-scene" width="200" height="200" viewBox="0 0 100 100" class="mx-auto"></svg>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6" id="l1-choices">
      <!-- JS 填 -->
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：緊急包拖拉 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#raccoon"/></svg>
      <p class="text-2xl font-bold text-amber-700">阿平：把對的 5 寶貝拖到緊急包！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（手機也可以：先點物品，再點背包）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="mt-6 flex justify-center">
      <div class="dropzone card text-center w-48 h-44 flex flex-col items-center justify-center border-4 border-dashed border-amber-400 bg-amber-50" data-zone="bag">
        <div class="text-6xl">🎒</div>
        <div class="text-2xl font-bold text-amber-700">緊急包</div>
        <div class="text-base text-gray-500 mt-1" id="l2-count">0 / 5</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：停蹲聽 三動作 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#raccoon"/></svg>
      <p class="text-2xl font-bold text-amber-700">阿平：警報響了！選對的動作！</p>
    </div>
    <div class="text-center my-4">
      <div id="l3-instruction" class="text-3xl font-extrabold text-pink-600 mb-2">第 1 題</div>
      <div id="l3-question" class="text-2xl font-bold text-amber-800 bg-yellow-100 rounded-2xl px-4 py-3 inline-block"></div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 3 個動作按鈕 -->
    </div>
    <p id="l3-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#raccoon"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">你是超棒的颱風小偵探！</h1>
    <p class="text-2xl text-gray-700 mt-4">阿平送你一張 <span class="text-pink-500 font-bold">安全小英雄徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起<br/><span class="text-pink-600 font-bold">打開緊急包，看看有什麼</span>，再檢查家裡的逃生路線！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Target: null, l3Idx: 0, l3Correct: 0 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：5 位天氣客人點選 ============
  const L1_SCENES = [
    {
      key: 'typhoon', name: '颱風',
      svg: '<g class="spin-slow" style="transform-origin:50px 50px"><circle cx="50" cy="50" r="30" fill="#64748b" opacity="0.6"/><circle cx="50" cy="50" r="20" fill="#475569"/><circle cx="50" cy="50" r="6" fill="white"/></g><path d="M 20 30 Q 50 10 80 30" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>'
    },
    {
      key: 'flood', name: '洪水',
      svg: '<rect x="0" y="60" width="100" height="40" fill="#60a5fa"/><path d="M 0 68 Q 20 62 40 68 T 80 68 T 100 68" stroke="#3b82f6" stroke-width="3" fill="none"/><rect x="30" y="40" width="20" height="25" fill="#d97706"/><path d="M 25 40 L 40 25 L 55 40 Z" fill="#b91c1c"/>'
    },
    {
      key: 'heat', name: '熱浪',
      svg: '<circle cx="50" cy="50" r="28" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="6" stroke-linecap="round"><line x1="50" y1="2" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="98"/><line x1="2" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="98" y2="50"/><line x1="15" y1="15" x2="25" y2="25"/><line x1="75" y1="25" x2="85" y2="15"/><line x1="15" y1="85" x2="25" y2="75"/><line x1="75" y1="75" x2="85" y2="85"/></g>'
    },
    {
      key: 'fire', name: '野火',
      svg: '<path d="M 50 90 Q 20 70 30 40 Q 40 60 45 45 Q 50 20 60 45 Q 65 30 70 50 Q 80 70 50 90 Z" fill="#ef4444"/><path d="M 50 80 Q 35 65 40 45 Q 48 55 50 45 Q 55 30 58 50 Q 65 65 50 80 Z" fill="#fbbf24"/>'
    }
  ];

  function loadLevel1() {
    STATE.l1Target = L1_SCENES[Math.floor(Math.random()*L1_SCENES.length)];
    document.getElementById('l1-scene').innerHTML = STATE.l1Target.svg;
    document.getElementById('l1-feedback').classList.add('hide');
    // 洗亂選項
    const pool = L1_SCENES.slice().sort(() => Math.random()-0.5);
    const box = document.getElementById('l1-choices');
    box.innerHTML = '';
    pool.forEach(s => {
      const b = document.createElement('button');
      b.className = 'big-btn bg-blue-300 hover:bg-blue-200 text-blue-900';
      b.textContent = s.name;
      b.dataset.key = s.key;
      b.onclick = () => l1Pick(b);
      box.appendChild(b);
    });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.key === STATE.l1Target.key) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#l1-choices button').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：緊急包拖拉 ============
  const L2_ITEMS = [
    { id: 'water',  label: '水',       emoji: '💧', correct: true  },
    { id: 'light',  label: '手電筒',   emoji: '🔦', correct: true  },
    { id: 'food',   label: '餅乾',     emoji: '🍪', correct: true  },
    { id: 'radio',  label: '收音機',   emoji: '📻', correct: true  },
    { id: 'meds',   label: '藥',       emoji: '💊', correct: true  },
    { id: 'ice',    label: '冰淇淋',   emoji: '🍦', correct: false },
    { id: 'toy',    label: '玩具',     emoji: '🧸', correct: false },
    { id: 'game',   label: '遊戲機',   emoji: '🎮', correct: false }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    updateL2Count();
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.correct = it.correct;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    const zone = document.querySelector('#level2 .dropzone');
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('dropzone-active'); };
    zone.ondragleave = () => zone.classList.remove('dropzone-active');
    zone.ondrop = e => {
      e.preventDefault();
      zone.classList.remove('dropzone-active');
      const id = e.dataTransfer.getData('text/plain');
      const src = document.querySelector(`#l2-items [data-id="${id}"]`);
      if (!src) return;
      handleL2Drop(src, zone);
    };
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function updateL2Count() {
    const el = document.getElementById('l2-count');
    if (el) el.textContent = l2Correct + ' / 5';
  }

  function handleL2Drop(src, z) {
    if (src.dataset.correct === 'true') {
      src.classList.add('popin');
      src.draggable = false;
      src.style.opacity = 0.3;
      src.style.pointerEvents = 'none';
      l2Correct++;
      updateL2Count();
      // 背包彈一下
      z.classList.add('popin');
      setTimeout(() => z.classList.remove('popin'), 500);
      const mini = document.createElement('div');
      mini.textContent = '✨';
      mini.className = 'text-4xl popin absolute';
      z.appendChild(mini);
      setTimeout(() => mini.remove(), 600);

      if (l2Correct >= 5) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！緊急包大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 嗯～這個在緊急時用不到，再試試看別的！';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：停蹲聽 情境題 ============
  const L3_QUESTIONS = [
    { q: '老師大喊「停！」', correct: 'stop', hint: '「停」就是站著不動' },
    { q: '警報「嗚——」響了！', correct: 'squat', hint: '「蹲」就是蹲下抱頭保護自己' },
    { q: '大人說話了，你要...', correct: 'listen', hint: '「聽」就是用耳朵注意聽' }
  ];
  const L3_ACTIONS = [
    { id: 'stop',   label: '停',  emoji: '🛑', desc: '站直不動' },
    { id: 'squat',  label: '蹲',  emoji: '🙇', desc: '蹲下抱頭' },
    { id: 'listen', label: '聽',  emoji: '👂', desc: '認真聽' }
  ];

  function loadLevel3() {
    STATE.l3Idx = 0;
    STATE.l3Correct = 0;
    showL3Question();
  }

  function showL3Question() {
    const q = L3_QUESTIONS[STATE.l3Idx];
    document.getElementById('l3-instruction').textContent = '第 ' + (STATE.l3Idx + 1) + ' 題';
    document.getElementById('l3-question').textContent = q.q;
    document.getElementById('l3-feedback').classList.add('hide');
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ACTIONS.slice().sort(() => Math.random()-0.5).forEach(act => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${act.emoji}</div><div class="mt-1 text-lg font-bold">${act.label}</div><div class="text-sm text-gray-500">${act.desc}</div>`;
      b.onclick = () => l3Pick(b, act.id);
      box.appendChild(b);
    });
  }

  function l3Pick(btn, id) {
    const q = L3_QUESTIONS[STATE.l3Idx];
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (id === q.correct) {
      fb.textContent = '🎉 答對啦！' + q.hint;
      fb.className = 'text-2xl text-center mt-4 font-bold text-green-500 popin';
      STATE.l3Correct++;
      document.querySelectorAll('#l3-items button').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.l3Idx++;
        if (STATE.l3Idx < L3_QUESTIONS.length) {
          showL3Question();
        } else {
          confetti();
          STATE.level = 4;
          drawProgress();
          show('finale');
          setTimeout(confetti, 300);
          setTimeout(confetti, 900);
        }
      }, 1500);
    } else {
      fb.textContent = '😊 想一想：' + q.hint;
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  function restart() {
    STATE.level = 0;
    STATE.l3Idx = 0;
    STATE.l3Correct = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
