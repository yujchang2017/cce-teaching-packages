<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>能源大搜查！— 小狐狸糖糖的綠能旅程</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef9c3 0%, #dcfce7 55%, #ffedd5 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .spin-slow { animation: spin 6s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小狐狸糖糖 SVG（可重用） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="fox">
      <!-- 臉 -->
      <ellipse cx="50" cy="55" rx="36" ry="30" fill="#fb923c"/>
      <!-- 白色臉頰 -->
      <ellipse cx="50" cy="65" rx="22" ry="16" fill="#fff7ed"/>
      <!-- 耳朵 -->
      <polygon points="18,28 10,5 32,22" fill="#fb923c"/>
      <polygon points="82,28 90,5 68,22" fill="#fb923c"/>
      <polygon points="18,25 14,12 27,20" fill="#fde68a"/>
      <polygon points="82,25 86,12 73,20" fill="#fde68a"/>
      <!-- 眼睛 -->
      <circle cx="38" cy="50" r="4.5" fill="#1f2937"/>
      <circle cx="62" cy="50" r="4.5" fill="#1f2937"/>
      <circle cx="39.5" cy="48.5" r="1.5" fill="white"/>
      <circle cx="63.5" cy="48.5" r="1.5" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="62" rx="4" ry="3" fill="#1f2937"/>
      <!-- 嘴 -->
      <path d="M 46 68 Q 50 74 54 68" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <circle cx="28" cy="62" r="4" fill="#fca5a5" opacity="0.7"/>
      <circle cx="72" cy="62" r="4" fill="#fca5a5" opacity="0.7"/>
    </g>
  </defs>
</svg>

<!-- 頂部標題與進度 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-orange-600">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#fox"/></svg>
    <span>小狐狸糖糖的能源大搜查</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar"></div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#fox"/></svg>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">嗨！我是糖糖！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要和我一起當<span class="text-green-600 font-bold">綠能小偵探</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個關卡，找出地球的禮物！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-orange-900 mt-6">開始！</button>
  </section>

  <!-- 關卡 1：6 種再生能源連連看（點擊配對名稱與圖示） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#fox"/></svg>
      <p class="text-2xl font-bold text-orange-700">糖糖：這是哪一個能源？點一點！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-xl font-bold text-green-700 mb-2">看看這張大圖～</div>
      <svg id="l1-scene" width="200" height="200" viewBox="0 0 100 100" class="mx-auto"></svg>
      <div id="l1-hint" class="text-2xl font-bold text-orange-500 mt-2"></div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l1-buttons"></div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉分類 — 會冒煙煙 vs 不會冒煙煙 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#fox"/></svg>
      <p class="text-2xl font-bold text-orange-700">糖糖：把能源拖到對的籃子！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items"></div>
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-gray-400" data-kind="fossil">
        <div class="text-6xl">💨</div>
        <div class="text-xl font-bold text-gray-600">會冒煙煙</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-kind="renew">
        <div class="text-6xl">🌿</div>
        <div class="text-xl font-bold text-green-600">不會冒煙煙</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：社區搜查 — 多選點圖找 3 處再生能源 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#fox"/></svg>
      <p class="text-2xl font-bold text-orange-700">糖糖：社區裡有哪裡用綠能？點 3 個！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（點一下選起來，再點一下取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items"></div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#fox"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">你是超棒的綠能偵探！</h1>
    <p class="text-2xl text-gray-700 mt-4">糖糖送你 <span class="text-green-600 font-bold">6 顆綠能星星</span>！</p>
    <div class="text-4xl mt-2">⭐⭐⭐⭐⭐⭐</div>
    <div class="card mt-6 bg-green-50 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽出門散步，<br/><span class="text-orange-600 font-bold">找一個太陽能板</span>，告訴他們：「這是再生能源！」</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-orange-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Target: null, l1Round: 0, l1MaxRound: 3 };

  // ============ 6 種再生能源定義 ============
  const ENERGY = {
    sun:   { key: 'sun',   label: '太陽',   emoji: '☀️', kind: 'renew', svg: '<circle cx="50" cy="50" r="24" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5"><line x1="50" y1="8" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="92"/><line x1="8" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="92" y2="50"/><line x1="20" y1="20" x2="30" y2="30"/><line x1="70" y1="30" x2="80" y2="20"/><line x1="20" y1="80" x2="30" y2="70"/><line x1="70" y1="70" x2="80" y2="80"/></g>' },
    wind:  { key: 'wind',  label: '風',     emoji: '💨', kind: 'renew', svg: '<rect x="46" y="40" width="8" height="50" fill="#a3a3a3"/><g transform="translate(50,40)"><ellipse cx="0" cy="-18" rx="6" ry="22" fill="#10b981"/><ellipse cx="16" cy="10" rx="22" ry="6" fill="#10b981"/><ellipse cx="-16" cy="10" rx="22" ry="6" fill="#10b981"/><circle cx="0" cy="0" r="5" fill="#374151"/></g>' },
    water: { key: 'water', label: '水',     emoji: '💧', kind: 'renew', svg: '<path d="M 30 20 Q 28 45 38 55 Q 40 62 30 72 Q 20 80 25 90" stroke="#3b82f6" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="70" cy="65" r="18" fill="none" stroke="#6b7280" stroke-width="4"/><line x1="70" y1="47" x2="70" y2="83" stroke="#6b7280" stroke-width="3"/><line x1="52" y1="65" x2="88" y2="65" stroke="#6b7280" stroke-width="3"/><path d="M 40 30 Q 55 40 70 47" stroke="#3b82f6" stroke-width="5" fill="none"/>' },
    geo:   { key: 'geo',   label: '地熱',   emoji: '🔥', kind: 'renew', svg: '<rect x="0" y="60" width="100" height="40" fill="#78350f"/><path d="M 30 60 Q 32 50 28 40 Q 36 48 40 40 Q 42 50 46 40 Q 50 50 54 40 Q 58 48 62 40 Q 64 50 70 42" stroke="#d1d5db" stroke-width="4" fill="none" opacity="0.7"/><ellipse cx="50" cy="65" rx="20" ry="5" fill="#60a5fa"/><path d="M 20 85 Q 25 75 35 80 Q 40 72 50 80 Q 55 72 65 80 Q 70 75 80 85" fill="#f97316"/>' },
    ocean: { key: 'ocean', label: '海浪',   emoji: '🌊', kind: 'renew', svg: '<rect x="0" y="0" width="100" height="50" fill="#bae6fd"/><path d="M 0 60 Q 15 45 30 60 Q 45 75 60 60 Q 75 45 90 60 L 100 60 L 100 100 L 0 100 Z" fill="#3b82f6"/><path d="M 0 75 Q 15 65 30 75 Q 45 85 60 75 Q 75 65 90 75" stroke="white" stroke-width="3" fill="none"/>' },
    bio:   { key: 'bio',   label: '果皮菜葉', emoji: '🍃', kind: 'renew', svg: '<rect x="25" y="35" width="50" height="55" rx="6" fill="#78350f"/><ellipse cx="50" cy="35" rx="28" ry="6" fill="#92400e"/><path d="M 35 50 Q 40 30 55 35" stroke="#fde047" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="48" cy="60" rx="10" ry="5" fill="#4ade80"/><ellipse cx="62" cy="68" rx="8" ry="4" fill="#4ade80"/>' },
    coal:  { key: 'coal',  label: '煤',     emoji: '⛽', kind: 'fossil', svg: '<ellipse cx="40" cy="65" rx="18" ry="14" fill="#1f2937"/><ellipse cx="62" cy="62" rx="14" ry="11" fill="#374151"/><ellipse cx="55" cy="72" rx="15" ry="10" fill="#111827"/><path d="M 50 35 Q 48 25 52 18 Q 46 22 50 15 Q 44 18 48 10" stroke="#6b7280" stroke-width="4" fill="none" opacity="0.8"/>' },
    oil:   { key: 'oil',   label: '石油',   emoji: '🛢️', kind: 'fossil', svg: '<rect x="30" y="35" width="40" height="50" rx="3" fill="#dc2626"/><rect x="30" y="35" width="40" height="8" fill="#991b1b"/><rect x="30" y="55" width="40" height="4" fill="#991b1b"/><rect x="30" y="75" width="40" height="4" fill="#991b1b"/><text x="50" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="white">油</text>' },
    gas:   { key: 'gas',   label: '瓦斯',   emoji: '🔥', kind: 'fossil', svg: '<rect x="35" y="30" width="30" height="50" rx="4" fill="#f59e0b"/><ellipse cx="50" cy="30" rx="15" ry="4" fill="#d97706"/><path d="M 42 18 Q 44 12 50 8 Q 52 14 56 10 Q 58 16 54 22 Q 50 18 46 24 Z" fill="#ef4444"/>' }
  };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-500 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-orange-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#4ade80','#60a5fa','#f97316','#f472b6'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    STATE.l1Round = 0;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：看圖配對能源（3 輪） ============
  function loadLevel1() {
    const renewKeys = ['sun','wind','water','geo','ocean','bio'];
    const target = ENERGY[renewKeys[Math.floor(Math.random()*renewKeys.length)]];
    STATE.l1Target = target.key;

    document.getElementById('l1-scene').innerHTML = target.svg;
    document.getElementById('l1-hint').textContent = '';
    document.getElementById('l1-feedback').classList.add('hide');

    // 從 6 個再生能源中取 3 個當選項（含正解）
    const pool = renewKeys.filter(k => k !== target.key).sort(() => Math.random()-0.5).slice(0,2);
    const options = [target.key, ...pool].sort(() => Math.random()-0.5);

    const box = document.getElementById('l1-buttons');
    box.innerHTML = '';
    options.forEach(k => {
      const e = ENERGY[k];
      const b = document.createElement('button');
      b.className = 'big-btn bg-yellow-200 hover:bg-yellow-100 text-orange-800 flex flex-col items-center';
      b.style.fontSize = '1.25rem';
      b.innerHTML = `<div class="text-5xl">${e.emoji}</div><div class="mt-1">${e.label}</div>`;
      b.onclick = () => l1Pick(b, k);
      box.appendChild(b);
    });
  }

  function l1Pick(btn, key) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (key === STATE.l1Target) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#l1-buttons button').forEach(b => b.disabled = true);
      STATE.l1Round++;
      setTimeout(() => {
        if (STATE.l1Round < STATE.l1MaxRound) {
          loadLevel1();
        } else {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }
      }, 1400);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉分類（煙煙 vs 不煙煙） ============
  const L2_ITEMS = [
    { id: 'sun',   emoji: '☀️', label: '太陽',   kind: 'renew' },
    { id: 'wind',  emoji: '💨', label: '風',     kind: 'renew' },
    { id: 'coal',  emoji: '⛽', label: '煤',     kind: 'fossil' },
    { id: 'water', emoji: '💧', label: '水',     kind: 'renew' },
    { id: 'oil',   emoji: '🛢️', label: '石油',   kind: 'fossil' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg p-3';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.kind = it.kind;
      d.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="text-lg text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.kind === z.dataset.kind) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 全部分類成功！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 想一想：它會不會冒煙煙？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // touch fallback
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-orange-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-orange-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-orange-400');
    l2Selected = null;
  });

  // ============ 關卡 3：社區大搜查（多選 3 種再生能源） ============
  const L3_ITEMS = [
    { id: 'solar_roof', label: '屋頂太陽板',     emoji: '🏠', svg: '<rect x="20" y="40" width="60" height="35" fill="#fbbf24"/><polygon points="15,40 50,15 85,40" fill="#dc2626"/><rect x="30" y="50" width="15" height="20" fill="#1e40af"/><rect x="55" y="50" width="15" height="20" fill="#1e40af"/><line x1="30" y1="55" x2="45" y2="55" stroke="#60a5fa"/><line x1="30" y1="60" x2="45" y2="60" stroke="#60a5fa"/><line x1="55" y1="55" x2="70" y2="55" stroke="#60a5fa"/><line x1="55" y1="60" x2="70" y2="60" stroke="#60a5fa"/>', correct: true },
    { id: 'wind_farm',  label: '海邊大風車',     emoji: '🌊', svg: '<rect x="0" y="70" width="100" height="30" fill="#60a5fa"/><rect x="47" y="30" width="6" height="45" fill="#a3a3a3"/><g transform="translate(50,30)"><ellipse cx="0" cy="-12" rx="4" ry="15" fill="#10b981"/><ellipse cx="11" cy="6" rx="15" ry="4" fill="#10b981"/><ellipse cx="-11" cy="6" rx="15" ry="4" fill="#10b981"/><circle cx="0" cy="0" r="4" fill="#374151"/></g>', correct: true },
    { id: 'compost',    label: '廚餘變電',       emoji: '🍃', svg: '<rect x="25" y="35" width="50" height="55" rx="6" fill="#78350f"/><ellipse cx="50" cy="35" rx="28" ry="6" fill="#92400e"/><path d="M 35 50 Q 40 30 55 35" stroke="#fde047" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="48" cy="60" rx="10" ry="5" fill="#4ade80"/>', correct: true },
    { id: 'toy',        label: '玩具車',         emoji: '🚗', svg: '<rect x="15" y="45" width="70" height="25" rx="5" fill="#ef4444"/><rect x="25" y="30" width="50" height="18" rx="5" fill="#dc2626"/><circle cx="30" cy="75" r="10" fill="#1f2937"/><circle cx="70" cy="75" r="10" fill="#1f2937"/>', correct: false },
    { id: 'icecream',   label: '冰淇淋店',       emoji: '🍦', svg: '<polygon points="35,55 50,90 65,55" fill="#d97706"/><circle cx="50" cy="50" r="15" fill="#fde68a"/><circle cx="50" cy="35" r="12" fill="#fce7f3"/>', correct: false },
    { id: 'tv',         label: '大電視',         emoji: '📺', svg: '<rect x="15" y="20" width="70" height="50" rx="4" fill="#1f2937"/><rect x="22" y="27" width="56" height="36" rx="2" fill="#60a5fa"/><rect x="40" y="75" width="20" height="4" fill="#6b7280"/>', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-yellow-50 hover:bg-yellow-100 p-3 flex flex-col items-center';
      b.innerHTML = `<svg viewBox="0 0 100 100" width="80" height="80">${it.svg}</svg><div class="mt-1 text-lg font-bold text-orange-700">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-500','bg-green-100');
          b.classList.add('bg-yellow-50');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-500','bg-green-100');
          b.classList.remove('bg-yellow-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 太棒了！你是超級偵探！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：玩具車、冰淇淋、電視不是綠能喔～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    STATE.l1Round = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
