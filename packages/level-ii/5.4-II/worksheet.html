<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家裡的能源小精靈 — 電電的節能小任務</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #fed7aa 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fef08a)} }
  .glow { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from{filter:drop-shadow(0 0 4px #fde047)} to{filter:drop-shadow(0 0 20px #fbbf24)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：電電小精靈 SVG（黃色燈泡，有眼睛、有小腳） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="dende">
      <!-- 燈泡底座 -->
      <rect x="38" y="70" width="24" height="10" rx="3" fill="#9ca3af"/>
      <rect x="40" y="80" width="20" height="5" fill="#6b7280"/>
      <!-- 燈泡身體 -->
      <path d="M 30 45 Q 30 15 50 15 Q 70 15 70 45 Q 70 65 60 70 L 40 70 Q 30 65 30 45 Z" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
      <!-- 發光光芒 -->
      <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
        <line x1="50" y1="3" x2="50" y2="10"/>
        <line x1="15" y1="30" x2="22" y2="33"/>
        <line x1="85" y1="30" x2="78" y2="33"/>
        <line x1="18" y1="10" x2="23" y2="17"/>
        <line x1="82" y1="10" x2="77" y2="17"/>
      </g>
      <!-- 臉 -->
      <circle cx="42" cy="40" r="3.5" fill="black"/>
      <circle cx="58" cy="40" r="3.5" fill="black"/>
      <circle cx="42.5" cy="39" r="1" fill="white"/>
      <circle cx="58.5" cy="39" r="1" fill="white"/>
      <!-- 臉頰 -->
      <circle cx="35" cy="50" r="4" fill="#fbcfe8" opacity="0.7"/>
      <circle cx="65" cy="50" r="4" fill="#fbcfe8" opacity="0.7"/>
      <!-- 笑嘴 -->
      <path d="M 43 52 Q 50 58 57 52" stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 小腳 -->
      <ellipse cx="40" cy="90" rx="6" ry="3" fill="#d97706"/>
      <ellipse cx="60" cy="90" rx="6" ry="3" fill="#d97706"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 100 100" class="glow"><use href="#dende"/></svg>
    <span>電電的節能小任務</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#dende"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">嗨！我是電電！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-pink-500 font-bold">電電守護員</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：哪個要能源？點一點 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#dende"/></svg>
      <p class="text-2xl font-bold text-amber-700">電電：哪一個需要能源才會動？</p>
    </div>
    <p class="text-xl text-center text-gray-600 mb-4">（點一下你覺得對的圖）</p>
    <div class="grid grid-cols-2 gap-4 mt-4" id="l1-choices">
      <!-- 動態產生：2 個需要能源 + 2 個不需要 -->
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉配對能源 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#dende"/></svg>
      <p class="text-2xl font-bold text-amber-700">電電：把電器拖到對的能源！</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-yellow-400" data-source="elec">
        <div class="text-6xl">⚡</div>
        <div class="text-2xl font-bold text-yellow-600">電</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-orange-400" data-source="gas">
        <div class="text-6xl">🔥</div>
        <div class="text-2xl font-bold text-orange-600">瓦斯</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：找出浪費能源的小偷 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#dende"/></svg>
      <p class="text-2xl font-bold text-amber-700">電電：找出 3 個浪費能源的小偷！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個場景 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce glow"><use href="#dende"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">你是超棒的電電守護員！</h1>
    <p class="text-2xl text-gray-700 mt-4">電電送你一張 <span class="text-pink-500 font-bold">節能小燈泡徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起走一圈家裡，<br/><span class="text-pink-600 font-bold">找找看幾樣東西要用電</span>，目標 5 個以上！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：哪個要能源？多選點擊 ============
  // 4 張圖：2 個需要能源（電燈、電視），2 個不需要（石頭、書本）
  const L1_ITEMS = [
    { id: 'lamp',   emoji: '💡', label: '電燈',  needs: true  },
    { id: 'tv',     emoji: '📺', label: '電視',  needs: true  },
    { id: 'rock',   emoji: '🪨', label: '石頭',  needs: false },
    { id: 'book',   emoji: '📖', label: '書本',  needs: false }
  ];
  const l1Picked = new Set();
  let l1Done = false;

  function loadLevel1() {
    l1Picked.clear();
    l1Done = false;
    const box = document.getElementById('l1-choices');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'big-btn bg-blue-200 hover:bg-blue-100 flex flex-col items-center';
      b.dataset.id = it.id;
      b.innerHTML = `<div class="text-6xl">${it.emoji}</div><div class="text-xl mt-1">${it.label}</div>`;
      b.onclick = () => l1Pick(b, it);
      box.appendChild(b);
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function l1Pick(btn, item) {
    if (l1Done) return;
    if (l1Picked.has(item.id)) {
      l1Picked.delete(item.id);
      btn.classList.remove('ring-4','ring-yellow-400','bg-yellow-100');
      btn.classList.add('bg-blue-200');
    } else {
      l1Picked.add(item.id);
      btn.classList.add('ring-4','ring-yellow-400','bg-yellow-100');
      btn.classList.remove('bg-blue-200');
    }
    // 判斷：都選對了（兩個 needs=true）才通關
    const correctIds = L1_ITEMS.filter(x => x.needs).map(x => x.id);
    const allRight = correctIds.every(id => l1Picked.has(id)) && l1Picked.size === correctIds.length;
    if (allRight) {
      l1Done = true;
      const fb = document.getElementById('l1-feedback');
      fb.classList.remove('hide');
      fb.textContent = '🎉 答對啦！電燈、電視都要能源！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else if (l1Picked.size >= 2) {
      // 若選了但不全對（比如選了石頭）→ 提示
      const hasWrong = [...l1Picked].some(id => !L1_ITEMS.find(x=>x.id===id).needs);
      if (hasWrong) {
        const fb = document.getElementById('l1-feedback');
        fb.classList.remove('hide');
        fb.textContent = '😊 想一想，石頭跟書本要不要插電？';
        fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
        btn.classList.add('wiggle');
        setTimeout(() => btn.classList.remove('wiggle'), 400);
      }
    }
  }

  // ============ 關卡 2：拖拉配對能源 ============
  const L2_ITEMS = [
    { id: 'lamp2',   label: '電燈',     source: 'elec', emoji: '💡' },
    { id: 'fridge',  label: '冰箱',     source: 'elec', emoji: '🧊' },
    { id: 'stove',   label: '瓦斯爐',   source: 'gas',  emoji: '🍳' },
    { id: 'tv2',     label: '電視',     source: 'elec', emoji: '📺' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.source = it.source;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.source === z.dataset.source) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！能源配對大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再試試看！想想看這個東西是插插座，還是用瓦斯？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback (簡易版：點擊選擇，再點擊區域放下) ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：找浪費能源的小偷（多選） ============
  // 3 個小偷（浪費）+ 3 個 OK（好行為）
  const L3_ITEMS = [
    { id: 'light_empty', label: '沒人開燈',    emoji: '💡', correct: true  },
    { id: 'cool_cold',   label: '冷氣 18°C',   emoji: '🥶', correct: true  },
    { id: 'tv_nobody',   label: '沒人看電視',  emoji: '📺', correct: true  },
    { id: 'light_off',   label: '離開關燈',    emoji: '🌙', correct: false },
    { id: 'cool_ok',     label: '冷氣 27°C',   emoji: '😊', correct: false },
    { id: 'fan',         label: '用電風扇',    emoji: '🌀', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-red-400','bg-red-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-red-400','bg-red-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你抓到 3 個能源小偷！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：關燈、冷氣 27°C、用電風扇 — 這些會浪費能源嗎？';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
