<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>時光小貓咪咪的故事 — 3.3-II</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #ffedd5 0%, #fef3c7 50%, #ecfccb 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 24px #fde68a)} }
  .spin-slow { animation: spin 4s linear infinite; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
  .mimi-bubble {
    background: #fff7ed;
    border: 3px solid #fdba74;
    border-radius: 1.5rem;
    padding: 0.75rem 1rem;
    position: relative;
  }
  .mimi-bubble::before {
    content:""; position:absolute; left:-14px; top:20px;
    border:8px solid transparent; border-right-color:#fdba74;
  }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：時光小貓咪咪 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mimi">
      <!-- 身體 -->
      <ellipse cx="50" cy="65" rx="28" ry="26" fill="#fb923c"/>
      <!-- 耳朵 -->
      <path d="M 22 40 L 30 15 L 40 35 Z" fill="#fb923c"/>
      <path d="M 78 40 L 70 15 L 60 35 Z" fill="#fb923c"/>
      <path d="M 25 35 L 30 22 L 37 33 Z" fill="#fed7aa"/>
      <path d="M 75 35 L 70 22 L 63 33 Z" fill="#fed7aa"/>
      <!-- 臉 -->
      <circle cx="50" cy="55" r="25" fill="#fdba74"/>
      <!-- 眼鏡 -->
      <circle cx="40" cy="53" r="8" fill="none" stroke="#92400e" stroke-width="2"/>
      <circle cx="60" cy="53" r="8" fill="none" stroke="#92400e" stroke-width="2"/>
      <line x1="48" y1="53" x2="52" y2="53" stroke="#92400e" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="40" cy="53" r="3" fill="#1f2937"/>
      <circle cx="60" cy="53" r="3" fill="#1f2937"/>
      <circle cx="41" cy="52" r="1" fill="white"/>
      <circle cx="61" cy="52" r="1" fill="white"/>
      <!-- 鼻 -->
      <path d="M 48 62 L 52 62 L 50 66 Z" fill="#ec4899"/>
      <!-- 嘴 -->
      <path d="M 43 70 Q 50 76 57 70" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 鬍鬚 -->
      <line x1="28" y1="65" x2="18" y2="63" stroke="#92400e" stroke-width="1.5"/>
      <line x1="28" y1="68" x2="17" y2="69" stroke="#92400e" stroke-width="1.5"/>
      <line x1="72" y1="65" x2="82" y2="63" stroke="#92400e" stroke-width="1.5"/>
      <line x1="72" y1="68" x2="83" y2="69" stroke="#92400e" stroke-width="1.5"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-orange-700">
    <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
    <span>時光小貓咪咪的故事</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mimi"/></svg>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">嗨！我是咪咪！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起<span class="text-pink-500 font-bold">穿越時光</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-orange-400 hover:bg-orange-300 text-white mt-6">出發！</button>
  </section>

  <!-- 關卡 1：排時間順序（過去→現在→未來） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <div class="mimi-bubble flex-1">
        <p class="text-xl font-bold text-orange-700">咪咪：把圖依照『過去→現在→未來』排一排！</p>
      </div>
    </div>
    <p class="text-center text-xl text-gray-600 mb-2">（拖到格子裡；手機按一下選，再按格子放下）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l1-items">
      <!-- 可拖拉圖 -->
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-amber-400" data-slot="past">
        <div class="text-4xl">⏪</div>
        <div class="text-xl font-bold text-amber-700">過去</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-slot="now">
        <div class="text-4xl">☀️</div>
        <div class="text-xl font-bold text-green-700">現在</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-blue-400" data-slot="future">
        <div class="text-4xl">⏩</div>
        <div class="text-xl font-bold text-blue-700">未來</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l1-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 2：公平 vs 不公平（點選） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <div class="mimi-bubble flex-1">
        <p class="text-xl font-bold text-orange-700">咪咪：這樣<span class="text-pink-600">公平</span>還是<span class="text-red-500">不公平</span>呢？</p>
      </div>
    </div>
    <div class="text-center my-4">
      <div id="l2-scenario" class="text-3xl font-bold text-gray-700 p-6 bg-yellow-100 rounded-3xl">...</div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-green-300 hover:bg-green-200 text-green-900" data-ans="fair" onclick="l2Pick(this)">
        <span class="text-5xl">🤝</span>
        <div class="text-xl mt-1">公平</div>
      </button>
      <button class="big-btn bg-red-200 hover:bg-red-100 text-red-700" data-ans="unfair" onclick="l2Pick(this)">
        <span class="text-5xl">😢</span>
        <div class="text-xl mt-1">不公平</div>
      </button>
    </div>
    <p id="l2-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <p id="l2-progress" class="text-center text-lg text-gray-500 mt-3">第 <span id="l2-num">1</span> / 3 題</p>
  </section>

  <!-- 關卡 3：小小守護隊 — 選 3 個好行動 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#mimi"/></svg>
      <div class="mimi-bubble flex-1">
        <p class="text-xl font-bold text-orange-700">咪咪：我要加入守護隊！選 3 個好行動！</p>
      </div>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好，再點可取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-orange-400 hover:bg-orange-300 text-white">我選好了！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#mimi"/></svg>
    </div>
    <div class="text-6xl mt-4">🏅</div>
    <h1 class="text-4xl font-extrabold text-orange-600 mt-4">你是超棒的小小守護隊！</h1>
    <p class="text-2xl text-gray-700 mt-4">咪咪送你一張<span class="text-pink-500 font-bold">時光金徽章</span>！</p>
    <div class="card mt-6 bg-green-100 border-4 border-green-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，問爺爺奶奶：<br/><span class="text-orange-600 font-bold">「您小時候這附近有很多樹嗎？」</span><br/>請他們說一個小故事給你聽！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-orange-400 hover:bg-orange-300 text-white mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-orange-400 text-white bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fb923c','#f472b6','#34d399','#60a5fa','#fbbf24','#a78bfa'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 700;
      const dy = (Math.random()-0.3) * 700;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：拖拉時間順序 ============
  const L1_ITEMS = [
    { id: 'seedling', emoji: '🌱', label: '小樹苗', slot: 'past'   },
    { id: 'tree',     emoji: '🌳', label: '大樹',   slot: 'now'    },
    { id: 'forest',   emoji: '🌲', label: '大森林', slot: 'future' }
  ];
  let l1Correct = 0;

  function loadLevel1() {
    l1Correct = 0;
    const box = document.getElementById('l1-items');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.slot = it.slot;
      d.innerHTML = `<div class="text-6xl">${it.emoji}</div><div class="text-xl text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag1(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level1 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l1-items [data-id="${id}"]`);
        if (!src) return;
        handleL1Drop(src, z);
      };
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function handleL1Drop(src, z) {
    if (src.dataset.slot === z.dataset.slot) {
      src.classList.add('popin');
      src.draggable = false;
      z.appendChild(src);
      l1Correct++;
      if (l1Correct === L1_ITEMS.length) {
        const fb = document.getElementById('l1-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！時間順序對了！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-3xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l1-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 想一想：小樹苗先、大樹中、森林後～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // touch fallback
  let l1Selected = null;
  function startTouchDrag1(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l1Selected) l1Selected.classList.remove('ring-4','ring-pink-400');
    l1Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (l1Selected) {
      const t = e.changedTouches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY);
      const zone = target && target.closest('.dropzone');
      if (zone && document.getElementById('level1') && !document.getElementById('level1').classList.contains('hide')) {
        handleL1Drop(l1Selected, zone);
      }
      l1Selected.classList.remove('ring-4','ring-pink-400');
      l1Selected = null;
    }
  });

  // ============ 關卡 2：公平 vs 不公平 ============
  const L2_QUESTIONS = [
    { text: '小華把餅乾全部拿走，不給小明吃。', ans: 'unfair' },
    { text: '小貓和小狗一人分一半點心。', ans: 'fair' },
    { text: '把別人家院子的花全部摘走。', ans: 'unfair' }
  ];
  let l2Idx = 0;

  function loadLevel2() {
    l2Idx = 0;
    showL2Q();
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function showL2Q() {
    const q = L2_QUESTIONS[l2Idx];
    document.getElementById('l2-scenario').textContent = q.text;
    document.getElementById('l2-num').textContent = l2Idx + 1;
    document.querySelectorAll('#level2 button[data-ans]').forEach(b => {
      b.disabled = false;
      b.classList.remove('wiggle');
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function l2Pick(btn) {
    const fb = document.getElementById('l2-feedback');
    fb.classList.remove('hide');
    const q = L2_QUESTIONS[l2Idx];
    if (btn.dataset.ans === q.ans) {
      fb.textContent = q.ans === 'fair' ? '🎉 答對！分享最棒！' : '🎉 答對！我們不要這樣做～';
      fb.className = 'text-2xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level2 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        l2Idx++;
        if (l2Idx >= L2_QUESTIONS.length) {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        } else {
          showL2Q();
        }
      }, 1500);
    } else {
      fb.textContent = '😊 想一想：有人難過嗎？';
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 3：小小守護隊選物 ============
  const L3_ITEMS = [
    { id: 'share',   label: '分享',      emoji: '🤝', correct: true  },
    { id: 'sorry',   label: '說對不起',   emoji: '💗', correct: true  },
    { id: 'plant',   label: '種小樹',    emoji: '🌱', correct: true  },
    { id: 'grab',    label: '搶玩具',    emoji: '😠', correct: false },
    { id: 'waste',   label: '浪費食物',  emoji: '🍎', correct: false },
    { id: 'break',   label: '踩花花',    emoji: '🌸', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！你是小小守護隊！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：選 3 個會讓大家開心的～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
