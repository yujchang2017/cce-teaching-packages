  }
  function awardOnce(key, pts) {
    if (!S.awarded[key]) { S.awarded[key] = true; addScore(pts); }
  }

  function updateDots() {
    const map = [
      { dot: 'dot-1', level: 1 },
      { dot: 'dot-2', level: 2 },
      { dot: 'dot-3', level: 3 },
      { dot: 'dot-f', level: 99 }
    ];
    map.forEach(({ dot, level }) => {
      const d = el(dot);
      d.classList.remove('done', 'active', 'todo');
      if (level < S.current) d.classList.add('done');
      else if (level === S.current || (level === 99 && S.current > TOTAL_LEVELS)) d.classList.add('active');
      else d.classList.add('todo');
    });
    for (let i = 1; i <= 3; i++) {
      const ln = el('line-' + i);
      if (ln) ln.style.background = (i < S.current) ? '#34d399' : '#e5e7eb';
    }
  }

  const SCREENS = ['intro', 'level-1', 'level-2', 'level-3', 'level-final'];

  window.gotoLevel = function(n) {
    SCREENS.forEach(s => el(s) && el(s).classList.add('hide'));
    S.current = n;
    updateDots();
    if (n === 0) {
      el('intro').classList.remove('hide');
      el('intro').classList.add('popin');
    } else if (n >= 1 && n <= TOTAL_LEVELS) {
      const sec = el('level-' + n);
      sec.classList.remove('hide');
      sec.classList.add('popin');
    } else {
      el('level-final').classList.remove('hide');
      el('level-final').classList.add('popin');
      el('final-score').textContent = S.score;
      confetti();
      setTimeout(confetti, 600);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#a78bfa'];
    for (let i = 0; i < 45; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.top = '40vh';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
      document.body.appendChild(c);
      const dx = (Math.random() - 0.5) * 700;
      const dy = (Math.random() - 0.4) * 700;
      c.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1600, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1700);
    }
  }

  function bearReact(fbId, correct) {
    const fb = el(fbId);
    fb.classList.remove('hide');
    if (correct) {
      fb.textContent = '?? 敺?????啁???鈭?';
      fb.className = 'text-2xl text-center font-bold mt-3 text-green-500 popin';
    } else {
      fb.textContent = '?? ?喃??喉?????????';
      fb.className = 'text-2xl text-center font-bold mt-3 text-orange-500';
    }
  }

  /* =========================================================
     Level 1: ???? (30 pts)
  ========================================================= */
  const L1_ITEMS = [
    { id: 'tree',  emoji: '?', label: '憭扳邦',   zone: 'nature' },
    { id: 'water', emoji: '?', label: '皜偌',   zone: 'nature' },
    { id: 'bird',  emoji: '?', label: '撠野',   zone: 'nature' },
    { id: 'car',   emoji: '??', label: '瘙質?',   zone: 'human'  },
    { id: 'phone', emoji: '?', label: '??',   zone: 'human'  },
    { id: 'tv',    emoji: '?', label: '?餉?',   zone: 'human'  }
  ];

  let l1Correct = 0;
  let dragged1 = null;

  function loadLevel1() {
    l1Correct = 0;
    dragged1 = null;
    el('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level-1 .dz-placed').forEach(dz => dz.innerHTML = '');
    const box = el('l1-items');
    box.innerHTML = '';
    const items = L1_ITEMS.slice().sort(() => Math.random() - 0.5);
    items.forEach(it => {
      const d = document.createElement('div');
      d.className = 'drag-item bg-white border-4 border-green-300 rounded-2xl p-4 text-center shadow-md w-32';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.zone = it.zone;
      d.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="text-base font-bold text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', () => { dragged1 = d; d.classList.add('dragging'); });
      d.addEventListener('dragend', () => d.classList.remove('dragging'));
      d.addEventListener('click', () => {
        if (!d.dataset.zone) return;
        document.querySelectorAll('#l1-items .drag-item').forEach(x => x.classList.remove('ring-4','ring-green-400'));
        dragged1 = d;
        d.classList.add('ring-4','ring-green-400');
      });
      box.appendChild(d);
    });
    document.querySelectorAll('#level-1 .drop-zone').forEach(zone => {
      zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
      zone.ondragleave = () => zone.classList.remove('over');
      zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); handleDrop1(zone); };
      zone.onclick = () => { if (dragged1) handleDrop1(zone); };
    });
  }

  function handleDrop1(zone) {
    if (!dragged1) return;
    const fb = el('l1-feedback');
    const correct = dragged1.dataset.zone === zone.dataset.zone;
    if (correct) {
      dragged1.classList.remove('ring-4','ring-green-400','dragging');
      dragged1.classList.add('popin');
      dragged1.style.cursor = 'default';
      dragged1.draggable = false;
      delete dragged1.dataset.zone;
      zone.querySelector('.dz-placed').appendChild(dragged1);
      l1Correct++;
      fb.classList.remove('hide');
      fb.textContent = `???曉?鈭?嚗?{l1Correct}/${L1_ITEMS.length}嚗;
      fb.className = 'text-xl text-center font-bold mt-4 text-green-500';
      if (l1Correct === L1_ITEMS.length) {
        awardOnce('L1', 30);
        fb.textContent = '?? ?券?曉?鈭??啁???敺?蝳桃嚗?;
        fb.className = 'text-2xl text-center font-bold mt-4 text-green-500 popin';
        confetti();
        setTimeout(() => gotoLevel(2), 2000);
      }
    } else {
      dragged1.classList.add('wiggle');
      setTimeout(() => { if(dragged1) dragged1.classList.remove('wiggle'); }, 400);
      fb.classList.remove('hide');
      fb.textContent = '?? ?單??璅嫘偌?野?航?嗥?嚗掃頠鈭箏???';
      fb.className = 'text-xl text-center font-bold mt-4 text-orange-500';
    }
    dragged1 = null;
  }

  /* =========================================================
     Level 2: ?訾???(30 pts ??10 ? 3)
  ========================================================= */
  const L2_CORRECT = { 1: 'recycle', 2: 'close', 3: 'thanks' };

  window.l2Pick = function(qNum, btn) {
    const opts = btn.closest('div.grid').querySelectorAll('button');
    const alreadyAnswered = Array.from(opts).some(b => b.style.pointerEvents === 'none');
    if (alreadyAnswered) return;
    const correct = btn.dataset.val === L2_CORRECT[qNum];
    bearReact('l2-q' + qNum + '-fb', correct);
    opts.forEach(b => b.style.pointerEvents = 'none');
    btn.style.border = correct ? '4px solid #34d399' : '4px solid #f87171';
    btn.style.background = correct ? '#d1fae5' : '#fee2e2';
    if (correct) awardOnce('L2-q' + qNum, 10);
    const delay = 1200;
    if (qNum === 1) {
      setTimeout(() => {
        el('l2-q2-wrap').classList.remove('hide');
        el('l2-q2-wrap').classList.add('popin');
      }, delay);
    } else if (qNum === 2) {
      setTimeout(() => {
        el('l2-q3-wrap').classList.remove('hide');
        el('l2-q3-wrap').classList.add('popin');
      }, delay);
    } else if (qNum === 3) {
      setTimeout(() => gotoLevel(3), delay + 600);
    }
  };

  function resetLevel2() {
    ['l2-q2-wrap','l2-q3-wrap'].forEach(id => {
      el(id).classList.add('hide');
      el(id).classList.remove('popin');
    });
    ['l2-q1-fb','l2-q2-fb','l2-q3-fb'].forEach(id => el(id).classList.add('hide'));
    document.querySelectorAll('#level-2 button.promise-card').forEach(b => {
      b.style.pointerEvents = '';
      b.style.border = '';
      b.style.background = '';
    });
  }

  /* =========================================================
     Level 3: ?輯姥 (15 pts)
  ========================================================= */
  const l3Chosen = new Set();

  window.l3Toggle = function(btn) {
    if (btn.disabled) return;
    const id = btn.dataset.id;
    if (l3Chosen.has(id)) {
      l3Chosen.delete(id);
      btn.classList.remove('chosen');
    } else {
      l3Chosen.add(id);
      btn.classList.add('chosen');
    }
    el('l3-count').textContent = l3Chosen.size;
    el('l3-submit-btn').disabled = l3Chosen.size < 2;
    el('l3-feedback').classList.add('hide');
  };

  window.l3Submit = function() {
    if (l3Chosen.size < 2) return;
    awardOnce('L3', 15);
    const fb = el('l3-feedback');
    fb.classList.remove('hide');
    fb.textContent = '?? 頩西髡?箔??硃嚗??雓?嚗?;
    fb.className = 'text-2xl text-center font-bold mt-2 text-green-500 popin';
    confetti();
    document.querySelectorAll('#l3-promises button').forEach(b => b.disabled = true);
    el('l3-submit-btn').disabled = true;
    setTimeout(() => gotoLevel(TOTAL_LEVELS + 1), 2000);
  };

  function resetLevel3() {
    l3Chosen.clear();
    el('l3-count').textContent = '0';
    el('l3-feedback').classList.add('hide');
    el('l3-submit-btn').disabled = true;
    document.querySelectorAll('#l3-promises button').forEach(b => {
      b.classList.remove('chosen');
      b.disabled = false;
    });
  }

  /* =========================================================
     Final: 蝚? + ???(5 pts)
  ========================================================= */
  let smileyPicked = false, favPicked = false;

  window.rateSmiley = function(val) {
    ['sm-1','sm-2','sm-3'].forEach((id,i) => {
      el(id).style.opacity = (i+1 <= val) ? '1' : '0.35';
      el(id).style.transform = (i+1 === val) ? 'scale(1.3)' : '';
    });
    const msgs = ['?? 瘝?靽?銝活??嚗?, '?? 雓?雿?', '?予 ??頩西髡憟賡???'];
    const fb = el('smiley-fb');
    fb.classList.remove('hide');
    fb.textContent = msgs[val - 1];
    smileyPicked = true;
    checkFinalDone();
  };

  window.pickFav = function(btn) {
    document.querySelectorAll('#fav-opts button').forEach(b => b.classList.remove('chosen'));
    btn.classList.add('chosen');
    el('fav-fb').classList.remove('hide');
    el('fav-fb').textContent = '??閮?靘?嚗?;
    favPicked = true;
    checkFinalDone();
  };

  function checkFinalDone() {
    if (smileyPicked && favPicked) {
      awardOnce('FINAL', 5);
      el('final-score').textContent = S.score;
      el('score-display').textContent = S.score;
    }
  }

  /* =========================================================
     Init & re-init on navigation
  ========================================================= */
  const _origGoto = window.gotoLevel;
  window.gotoLevel = function(n) {
    if (n === 1) loadLevel1();
    if (n === 2) resetLevel2();
    if (n === 3) resetLevel3();
    _origGoto(n);
  };

  gotoLevel(0);
})();
</script>
