<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心情天氣 — 小熊心心的情緒大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #ffe4e6 0%, #fef3c7 50%, #d1fae5 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fbcfe8)} }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .heartbeat { animation: heartbeat 1.2s ease-in-out infinite; }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 25%{transform:scale(1.15)} 50%{transform:scale(1)} 75%{transform:scale(1.1)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fce7f3 !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小熊心心 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="heartbear">
      <!-- 身體粉色 -->
      <circle cx="50" cy="52" r="38" fill="#f9a8d4"/>
      <!-- 耳朵 -->
      <circle cx="25" cy="28" r="12" fill="#f9a8d4"/>
      <circle cx="75" cy="28" r="12" fill="#f9a8d4"/>
      <circle cx="25" cy="28" r="6" fill="#fbcfe8"/>
      <circle cx="75" cy="28" r="6" fill="#fbcfe8"/>
      <!-- 眼睛 -->
      <circle cx="38" cy="45" r="4" fill="#1f2937"/>
      <circle cx="62" cy="45" r="4" fill="#1f2937"/>
      <circle cx="39" cy="44" r="1.5" fill="white"/>
      <circle cx="63" cy="44" r="1.5" fill="white"/>
      <!-- 鼻嘴 -->
      <ellipse cx="50" cy="58" rx="8" ry="6" fill="#fef3c7"/>
      <circle cx="50" cy="56" r="2.5" fill="#1f2937"/>
      <path d="M 42 65 Q 50 72 58 65" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 心形項鍊 -->
      <path d="M 50 75 Q 42 68 42 74 Q 42 80 50 86 Q 58 80 58 74 Q 58 68 50 75 Z" fill="#ef4444"/>
      <!-- 腮紅 -->
      <circle cx="28" cy="58" r="5" fill="#fda4af" opacity="0.7"/>
      <circle cx="72" cy="58" r="5" fill="#fda4af" opacity="0.7"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-pink-600">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#heartbear"/></svg>
    <span>心心的情緒大冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#heartbear"/></svg>
    <h1 class="text-4xl font-extrabold text-pink-500 mt-4">嗨！我是心心！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天跟我一起去<span class="text-orange-500 font-bold">情緒大冒險</span>吧！</p>
    <p class="text-xl text-gray-500 mt-2">3 個小關卡，我們一起玩！</p>
    <button onclick="startGame()" class="big-btn bg-pink-400 hover:bg-pink-300 text-white mt-6">開始 💖</button>
  </section>

  <!-- 關卡 1：認識情緒寶寶（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#heartbear"/></svg>
      <p class="text-2xl font-bold text-pink-600">心心：這個寶寶是什麼心情？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <svg id="l1-scene" width="220" height="220" viewBox="0 0 100 100" class="mx-auto"></svg>
      <p id="l1-hint" class="text-xl text-gray-500 mt-2"></p>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-yellow-300 hover:bg-yellow-200" data-ans="happy" onclick="l1Pick(this)">
        <span class="text-5xl">😊</span>
        <div class="text-xl mt-1 text-gray-700">高興</div>
      </button>
      <button class="big-btn bg-blue-200 hover:bg-blue-100" data-ans="sad" onclick="l1Pick(this)">
        <span class="text-5xl">😢</span>
        <div class="text-xl mt-1 text-gray-700">難過</div>
      </button>
      <button class="big-btn bg-purple-200 hover:bg-purple-100" data-ans="scared" onclick="l1Pick(this)">
        <span class="text-5xl">😨</span>
        <div class="text-xl mt-1 text-gray-700">害怕</div>
      </button>
      <button class="big-btn bg-red-200 hover:bg-red-100" data-ans="angry" onclick="l1Pick(this)">
        <span class="text-5xl">😠</span>
        <div class="text-xl mt-1 text-gray-700">生氣</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：聞花吹氣球（呼吸練習） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#heartbear"/></svg>
      <p class="text-2xl font-bold text-pink-600">心心：一起聞花、吹氣球！</p>
    </div>
    <p class="text-xl text-center text-gray-600">跟著按鈕做 5 次深呼吸～</p>
    <div class="flex justify-center my-8" id="l2-anim">
      <svg id="l2-circle" width="220" height="220" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="35" fill="#fbcfe8" stroke="#ec4899" stroke-width="3"/>
        <text x="50" y="58" font-size="14" text-anchor="middle" fill="#be185d" font-weight="bold" id="l2-label">準備</text>
      </svg>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <button onclick="l2Breathe('in')" class="big-btn bg-green-300 hover:bg-green-200 text-green-900">
        <span class="text-4xl">🌸</span>
        <div class="text-xl mt-1">聞花 (吸)</div>
      </button>
      <button onclick="l2Breathe('out')" class="big-btn bg-sky-300 hover:bg-sky-200 text-sky-900">
        <span class="text-4xl">🎈</span>
        <div class="text-xl mt-1">吹氣球 (吐)</div>
      </button>
    </div>
    <div class="text-center mt-4">
      <div class="text-2xl font-bold text-pink-600">已完成：<span id="l2-count">0</span> / 5 次</div>
      <p id="l2-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 關卡 3：心心的煩惱（安慰選擇） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#heartbear"/></svg>
      <p class="text-2xl font-bold text-pink-600">心心：我有點擔心地球，你能幫幫我嗎？</p>
    </div>
    <div class="card bg-orange-50 border-4 border-orange-200 my-4">
      <p class="text-xl text-gray-700">心心說：「聽說北極熊的家變小了，我心裡悶悶的...我可以怎麼辦呢？」</p>
    </div>
    <p class="text-xl text-center text-gray-600">選 3 個你覺得能幫心心的小方法！</p>
    <div class="grid grid-cols-2 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-pink-400 hover:bg-pink-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#heartbear"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆💖</div>
    <h1 class="text-4xl font-extrabold text-pink-500 mt-4">你是心情小夥伴！</h1>
    <p class="text-2xl text-gray-700 mt-4">心心送你一張 <span class="text-orange-500 font-bold">溫暖徽章</span>！</p>
    <div class="card mt-6 bg-pink-50 border-4 border-pink-200">
      <p class="text-xl font-bold text-pink-700">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽<br/><span class="text-orange-500 font-bold">一起看雲 5 分鐘</span>，<br/>說說雲朵今天的心情！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-pink-400 hover:bg-pink-300 text-white mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Scene: 'happy' };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-pink-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-pink-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '♥' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#f9a8d4','#fbbf24','#34d399','#60a5fa','#fb923c','#fda4af'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：情緒圖配對 ============
  function loadLevel1() {
    // 隨機挑一個情境臉，孩子選出對應情緒
    const scenes = [
      { key: 'happy',  hint: '心心拿到了新禮物～',
        svg: '<circle cx="50" cy="50" r="35" fill="#fde68a"/><circle cx="38" cy="45" r="4" fill="#1f2937"/><circle cx="62" cy="45" r="4" fill="#1f2937"/><path d="M 35 60 Q 50 75 65 60" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/>' },
      { key: 'sad',    hint: '心心的冰淇淋掉地上了...',
        svg: '<circle cx="50" cy="50" r="35" fill="#bfdbfe"/><circle cx="38" cy="45" r="4" fill="#1f2937"/><circle cx="62" cy="45" r="4" fill="#1f2937"/><path d="M 35 68 Q 50 58 65 68" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M 35 52 L 33 58" stroke="#3b82f6" stroke-width="3" fill="none"/>' },
      { key: 'scared', hint: '黑黑的房間裡有怪聲音...',
        svg: '<circle cx="50" cy="50" r="35" fill="#ddd6fe"/><circle cx="38" cy="42" r="5" fill="#1f2937"/><circle cx="62" cy="42" r="5" fill="#1f2937"/><circle cx="38" cy="41" r="2" fill="white"/><circle cx="62" cy="41" r="2" fill="white"/><ellipse cx="50" cy="68" rx="6" ry="8" fill="#1f2937"/>' },
      { key: 'angry',  hint: '有人把心心的積木推倒了！',
        svg: '<circle cx="50" cy="50" r="35" fill="#fecaca"/><line x1="28" y1="38" x2="42" y2="44" stroke="#1f2937" stroke-width="4"/><line x1="72" y1="38" x2="58" y2="44" stroke="#1f2937" stroke-width="4"/><circle cx="38" cy="48" r="3" fill="#1f2937"/><circle cx="62" cy="48" r="3" fill="#1f2937"/><path d="M 35 68 Q 50 62 65 68" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/>' }
    ];
    const pick = scenes[Math.floor(Math.random()*scenes.length)];
    STATE.l1Scene = pick.key;
    document.getElementById('l1-scene').innerHTML = pick.svg;
    document.getElementById('l1-hint').textContent = pick.hint;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Scene) {
      fb.textContent = '🎉 答對啦！你好會看心情！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 沒關係，再看看情境圖，想一想！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：聞花吹氣球（5 次呼吸）============
  let l2State = 'ready', l2Count = 0;
  function l2Breathe(action) {
    const circle = document.getElementById('l2-circle').querySelector('circle');
    const label = document.getElementById('l2-label');
    const countEl = document.getElementById('l2-count');

    if (action === 'in' && l2State !== 'in') {
      l2State = 'in';
      circle.setAttribute('r', '45');
      circle.setAttribute('fill', '#bbf7d0');
      label.textContent = '吸～';
    } else if (action === 'out' && l2State === 'in') {
      l2State = 'out';
      circle.setAttribute('r', '25');
      circle.setAttribute('fill', '#bae6fd');
      label.textContent = '吐～';
      l2Count++;
      countEl.textContent = l2Count;
      // 一次吸吐算一次
      setTimeout(() => {
        circle.setAttribute('r', '35');
        circle.setAttribute('fill', '#fbcfe8');
        label.textContent = '好棒';
        l2State = 'ready';
      }, 700);

      if (l2Count >= 5) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 深呼吸大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 2000);
      }
    } else {
      // 提示順序
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 先聞花（吸），再吹氣球（吐）～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function loadLevel2() {
    l2State = 'ready';
    l2Count = 0;
    document.getElementById('l2-count').textContent = 0;
    document.getElementById('l2-feedback').classList.add('hide');
    const circle = document.getElementById('l2-circle').querySelector('circle');
    circle.setAttribute('r', '35');
    circle.setAttribute('fill', '#fbcfe8');
    document.getElementById('l2-label').textContent = '準備';
  }

  // ============ 關卡 3：幫心心選 3 個安心方法 ============
  const L3_ITEMS = [
    { id: 'talk',    label: '說給大人聽',   emoji: '💬', correct: true  },
    { id: 'draw',    label: '畫在紙上',     emoji: '🎨', correct: true  },
    { id: 'hug',     label: '抱抱爸媽',     emoji: '🤗', correct: true  },
    { id: 'hit',     label: '打打推推',     emoji: '👊', correct: false },
    { id: 'ignore',  label: '假裝沒事',     emoji: '🙈', correct: false },
    { id: 'scream',  label: '大聲罵別人',   emoji: '😤', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-pink-50 hover:bg-pink-100 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold text-gray-700">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-pink-400','bg-pink-200');
          b.classList.add('bg-pink-50');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-pink-400','bg-pink-200');
          b.classList.remove('bg-pink-50');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 心心謝謝你！心暖暖的！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：選「說、畫、抱」3 個溫柔的方法～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
