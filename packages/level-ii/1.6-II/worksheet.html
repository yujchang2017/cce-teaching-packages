<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小小能源偵探 — 小松鼠糖糖的能量大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef9c3 0%, #dbeafe 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fde68a)} }
  .spin-slow { animation: spin-slow 3s linear infinite; transform-origin: center; }
  @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠糖糖 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 身體 -->
      <ellipse cx="50" cy="60" rx="26" ry="24" fill="#d97706"/>
      <!-- 大尾巴 -->
      <path d="M 72 65 Q 95 40 88 15 Q 75 25 78 45 Q 72 55 72 65 Z" fill="#b45309"/>
      <!-- 頭 -->
      <circle cx="50" cy="35" r="20" fill="#d97706"/>
      <!-- 耳朵 -->
      <ellipse cx="36" cy="22" rx="6" ry="9" fill="#b45309"/>
      <ellipse cx="64" cy="22" rx="6" ry="9" fill="#b45309"/>
      <ellipse cx="36" cy="23" rx="3" ry="5" fill="#fecaca"/>
      <ellipse cx="64" cy="23" rx="3" ry="5" fill="#fecaca"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="33" r="3.5" fill="black"/>
      <circle cx="58" cy="33" r="3.5" fill="black"/>
      <circle cx="43" cy="32" r="1.2" fill="white"/>
      <circle cx="59" cy="32" r="1.2" fill="white"/>
      <!-- 鼻子與嘴 -->
      <ellipse cx="50" cy="40" rx="2.5" ry="2" fill="#1f2937"/>
      <path d="M 46 44 Q 50 48 54 44" stroke="#1f2937" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- 小安全帽黃黃的 -->
      <path d="M 32 22 Q 50 5 68 22 L 68 18 Q 50 2 32 18 Z" fill="#fbbf24"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>糖糖的能量大冒險</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar"></div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="160" height="160" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">嗨！我是糖糖！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我一起當<span class="text-orange-500 font-bold">能源小偵探</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：這是什麼能源？（點擊配對） -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">糖糖：這張圖是哪種能源？點一點！</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <svg id="l1-scene" width="220" height="220" viewBox="0 0 100 100" class="mx-auto"></svg>
      <p id="l1-hint" class="text-xl text-gray-500 mt-2"></p>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-yellow-200 hover:bg-yellow-100" data-ans="solar" onclick="l1Pick(this)">
        <div class="flex flex-col items-center">
          <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><circle cx="50" cy="50" r="24" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5"><line x1="50" y1="8" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="92"/><line x1="8" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="92" y2="50"/></g></svg>
          <div class="text-lg mt-1">☀️ 太陽能</div>
        </div>
      </button>
      <button class="big-btn bg-sky-200 hover:bg-sky-100" data-ans="wind" onclick="l1Pick(this)">
        <div class="flex flex-col items-center">
          <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><rect x="47" y="40" width="6" height="50" fill="#9ca3af"/><g fill="#60a5fa"><ellipse cx="50" cy="38" rx="4" ry="16" transform="rotate(0 50 38)"/><ellipse cx="50" cy="38" rx="4" ry="16" transform="rotate(120 50 38)"/><ellipse cx="50" cy="38" rx="4" ry="16" transform="rotate(240 50 38)"/></g><circle cx="50" cy="38" r="4" fill="#374151"/></svg>
          <div class="text-lg mt-1">💨 風能</div>
        </div>
      </button>
      <button class="big-btn bg-blue-200 hover:bg-blue-100" data-ans="water" onclick="l1Pick(this)">
        <div class="flex flex-col items-center">
          <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><path d="M 20 20 L 20 55 Q 20 75 50 75 Q 80 75 80 55 L 80 20 Z" fill="#60a5fa" opacity="0.4"/><path d="M 50 30 Q 40 50 50 65 Q 60 50 50 30 Z" fill="#3b82f6"/></svg>
          <div class="text-lg mt-1">💧 水力</div>
        </div>
      </button>
      <button class="big-btn bg-gray-300 hover:bg-gray-200" data-ans="fossil" onclick="l1Pick(this)">
        <div class="flex flex-col items-center">
          <svg width="60" height="60" viewBox="0 0 100 100" class="inline"><rect x="30" y="40" width="40" height="40" fill="#374151" rx="4"/><path d="M 40 40 Q 50 20 60 40" stroke="#f59e0b" stroke-width="4" fill="#fbbf24"/></svg>
          <div class="text-lg mt-1">⛽ 化石燃料</div>
        </div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：再生 vs 化石 分類（拖拉） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">糖糖：幫我分類！哪個用不完，哪個用完就沒？</p>
    </div>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-kind="renew">
        <div class="text-5xl">🌳</div>
        <div class="text-2xl font-bold text-green-600">用不完</div>
        <div class="text-sm text-gray-500">（像果樹）</div>
      </div>
      <div class="dropzone card text-center h-40 flex flex-col items-center justify-center border-4 border-dashed border-gray-400" data-kind="fossil">
        <div class="text-5xl">🍪</div>
        <div class="text-2xl font-bold text-gray-700">用完就沒</div>
        <div class="text-sm text-gray-500">（像餅乾）</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：省電小超人（多選） -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">糖糖：哪些是省電小超人會做的事？選 3 個！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下就選好囉，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">你是超棒的能源小偵探！</h1>
    <p class="text-2xl text-gray-700 mt-4">糖糖送你一張 <span class="text-orange-500 font-bold">金牌能源徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起，<br/><span class="text-orange-600 font-bold">把家裡沒人用的燈關掉</span>，<br/>數一數你幫地球省了幾盞燈！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Scene: 'solar' };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：點擊配對 ============
  function loadLevel1() {
    const scenes = [
      {
        key: 'solar',
        svg: '<rect x="20" y="55" width="60" height="30" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/><g stroke="#60a5fa" stroke-width="1.5"><line x1="30" y1="55" x2="30" y2="85"/><line x1="40" y1="55" x2="40" y2="85"/><line x1="50" y1="55" x2="50" y2="85"/><line x1="60" y1="55" x2="60" y2="85"/><line x1="70" y1="55" x2="70" y2="85"/><line x1="20" y1="65" x2="80" y2="65"/><line x1="20" y1="75" x2="80" y2="75"/></g><circle cx="78" cy="20" r="12" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="2"><line x1="78" y1="3" x2="78" y2="8"/><line x1="78" y1="32" x2="78" y2="37"/><line x1="95" y1="20" x2="99" y2="20"/><line x1="57" y1="20" x2="61" y2="20"/></g>',
        hint: '黑黑的板子在吸太陽光～'
      },
      {
        key: 'wind',
        svg: '<rect x="47" y="30" width="6" height="60" fill="#d1d5db"/><g class="spin-slow" style="transform-origin:50px 30px"><ellipse cx="50" cy="30" rx="5" ry="20" transform="rotate(0 50 30)" fill="#60a5fa"/><ellipse cx="50" cy="30" rx="5" ry="20" transform="rotate(120 50 30)" fill="#60a5fa"/><ellipse cx="50" cy="30" rx="5" ry="20" transform="rotate(240 50 30)" fill="#60a5fa"/></g><circle cx="50" cy="30" r="5" fill="#374151"/><path d="M 5 65 Q 30 60 55 70" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 5 80 Q 35 75 60 85" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round"/>',
        hint: '風一吹就會轉～'
      },
      {
        key: 'water',
        svg: '<rect x="10" y="60" width="80" height="25" fill="#60a5fa" opacity="0.6"/><path d="M 30 60 L 30 30 L 70 30 L 70 60" stroke="#6b7280" stroke-width="4" fill="#d1d5db"/><path d="M 45 30 Q 45 50 48 60" stroke="#3b82f6" stroke-width="4" fill="none"/><path d="M 55 30 Q 55 50 52 60" stroke="#3b82f6" stroke-width="4" fill="none"/><circle cx="25" cy="72" r="2" fill="#1e40af"/><circle cx="75" cy="70" r="2" fill="#1e40af"/>',
        hint: '水從高高的地方流下來～'
      }
    ];
    const pick = scenes[Math.floor(Math.random()*scenes.length)];
    STATE.l1Scene = pick.key;
    document.getElementById('l1-scene').innerHTML = pick.svg;
    document.getElementById('l1-hint').textContent = pick.hint;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === STATE.l1Scene) {
      fb.textContent = '🎉 答對啦！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-ans]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，再試試！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 ============
  const L2_ITEMS = [
    { id: 'sun',    label: '太陽',   kind: 'renew',  emoji: '☀️' },
    { id: 'wind',   label: '風',     kind: 'renew',  emoji: '💨' },
    { id: 'water',  label: '水',     kind: 'renew',  emoji: '💧' },
    { id: 'coal',   label: '煤',     kind: 'fossil', emoji: '⚫' },
    { id: 'oil',    label: '石油',   kind: 'fossil', emoji: '🛢️' },
    { id: 'gas',    label: '瓦斯',   kind: 'fossil', emoji: '🔥' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.kind = it.kind;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.kind === z.dataset.kind) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！能源分類大師！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想：太陽風水會一直有，煤油氣用完就沒～';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：多選 (圖示按鈕) ============
  const L3_ITEMS = [
    { id: 'off_light', label: '關燈',      emoji: '💡', correct: true  },
    { id: 'unplug',    label: '拔插頭',    emoji: '🔌', correct: true  },
    { id: 'short_bath',label: '短短洗澡',  emoji: '🚿', correct: true  },
    { id: 'all_on',    label: '全部開著',  emoji: '🎆', correct: false },
    { id: 'ac_low',    label: '冷氣最冷',  emoji: '🥶', correct: false },
    { id: 'long_tv',   label: '看超久電視', emoji: '📺', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！地球謝謝你！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：省電就是用少一點～選 3 個最棒的！';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
