<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天氣怎麼改變我的一天 — 小松鼠果果的日記</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fef3c7 0%, #ffedd5 50%, #ffe4e6 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #fbbf24)} }
  .swing { animation: swing 2s ease-in-out infinite; transform-origin: top center; }
  @keyframes swing { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：小松鼠果果 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 大尾巴 -->
      <path d="M 85 60 Q 110 40 105 15 Q 95 5 80 20 Q 75 35 80 50" fill="#c2410c"/>
      <path d="M 85 60 Q 108 42 102 20 Q 95 12 85 25 Q 82 40 85 55" fill="#ea580c"/>
      <!-- 身體 -->
      <ellipse cx="50" cy="58" rx="30" ry="28" fill="#d97706"/>
      <!-- 肚子 -->
      <ellipse cx="50" cy="62" rx="18" ry="18" fill="#fde68a"/>
      <!-- 耳朵 -->
      <path d="M 30 28 L 28 15 L 42 22 Z" fill="#d97706"/>
      <path d="M 70 28 L 72 15 L 58 22 Z" fill="#d97706"/>
      <path d="M 31 25 L 30 18 L 40 22 Z" fill="#fbbf24"/>
      <path d="M 69 25 L 70 18 L 60 22 Z" fill="#fbbf24"/>
      <!-- 頭 -->
      <circle cx="50" cy="38" r="22" fill="#d97706"/>
      <!-- 臉頰 -->
      <circle cx="38" cy="45" r="5" fill="#fda4af" opacity="0.7"/>
      <circle cx="62" cy="45" r="5" fill="#fda4af" opacity="0.7"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="36" r="4" fill="white"/>
      <circle cx="58" cy="36" r="4" fill="white"/>
      <circle cx="42" cy="36" r="2.5" fill="black"/>
      <circle cx="58" cy="36" r="2.5" fill="black"/>
      <circle cx="42.8" cy="35" r="0.8" fill="white"/>
      <circle cx="58.8" cy="35" r="0.8" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="43" rx="2.5" ry="2" fill="#431407"/>
      <!-- 嘴巴 -->
      <path d="M 45 47 Q 50 52 55 47" stroke="#431407" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- 手捧堅果 -->
      <ellipse cx="50" cy="75" rx="7" ry="5" fill="#92400e"/>
      <ellipse cx="50" cy="74" rx="5" ry="3" fill="#b45309"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-amber-700">
    <svg width="60" height="60" viewBox="0 0 120 100"><use href="#squirrel"/></svg>
    <span>小松鼠果果的日記</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar"></div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="200" height="180" viewBox="0 0 120 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">嗨！我是果果！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要跟我看看<span class="text-pink-500 font-bold">天氣</span>怎麼改變我的一天嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">開始</button>
  </section>

  <!-- 關卡 1：天氣穿搭配對 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="80" height="70" viewBox="0 0 120 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">果果：今天這種天氣，我要帶什麼？</p>
    </div>
    <div id="l1-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">看看今天的天氣...</div>
      <svg id="l1-scene" width="220" height="200" viewBox="0 0 100 100" class="mx-auto"></svg>
      <div id="l1-label" class="text-3xl font-bold text-sky-600 mt-2"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-blue-200 hover:bg-blue-100" data-item="umbrella" onclick="l1Pick(this)">
        <div class="text-5xl">☂️</div>
        <div class="text-lg font-bold text-blue-800 mt-1">雨傘</div>
      </button>
      <button class="big-btn bg-yellow-200 hover:bg-yellow-100" data-item="sunhat" onclick="l1Pick(this)">
        <div class="text-5xl">👒</div>
        <div class="text-lg font-bold text-yellow-800 mt-1">遮陽帽</div>
      </button>
      <button class="big-btn bg-pink-200 hover:bg-pink-100" data-item="coat" onclick="l1Pick(this)">
        <div class="text-5xl">🧥</div>
        <div class="text-lg font-bold text-pink-800 mt-1">外套</div>
      </button>
      <button class="big-btn bg-green-200 hover:bg-green-100" data-item="water" onclick="l1Pick(this)">
        <div class="text-5xl">💧</div>
        <div class="text-lg font-bold text-green-800 mt-1">水壺</div>
      </button>
    </div>
    <p id="l1-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
  </section>

  <!-- 關卡 2：拖拉 — 超市貨架配對（雨天 vs 晴天） -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="80" height="70" viewBox="0 0 120 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">果果：幫農夫伯伯！把對的東西拖到對的天氣！</p>
    </div>
    <p class="text-lg text-center text-gray-600 mb-2">（大雨天農夫採菜困難，青菜會變少；大太陽要多喝水、戴帽子）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l2-items">
      <!-- 動態生成 -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div class="dropzone card text-center min-h-40 flex flex-col items-center justify-center border-4 border-dashed border-blue-400" data-weather="rain">
        <div class="text-6xl">🌧️</div>
        <div class="text-2xl font-bold text-blue-600">大雨天</div>
        <div class="text-sm text-gray-500 mt-1">(菜少了、要撐傘)</div>
      </div>
      <div class="dropzone card text-center min-h-40 flex flex-col items-center justify-center border-4 border-dashed border-yellow-400" data-weather="hot">
        <div class="text-6xl">☀️</div>
        <div class="text-2xl font-bold text-yellow-600">大熱天</div>
        <div class="text-sm text-gray-500 mt-1">(要喝水、戴帽子)</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l2-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 3：颱風小背包 — 選 3 樣 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="80" height="70" viewBox="0 0 120 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-amber-700">果果：颱風來了！幫我找 3 樣最重要的！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（點一下就選好，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">完成！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="220" height="200" viewBox="0 0 120 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-amber-600 mt-4">你是果果最棒的小幫手！</h1>
    <p class="text-2xl text-gray-700 mt-4">果果送你一枚 <span class="text-pink-500 font-bold">金色橡果徽章</span>！</p>
    <div class="card mt-6 bg-yellow-100 border-4 border-yellow-300">
      <p class="text-xl font-bold text-amber-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起找：<br/><span class="text-pink-600 font-bold">水、手電筒、餅乾</span>，放進一個小背包！<br/>颱風來我們就不怕啦～</p>
    </div>
    <button onclick="restart()" class="big-btn bg-yellow-400 hover:bg-yellow-300 text-amber-900 mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3, l1Scene: null };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-400 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#fbbf24','#f472b6','#34d399','#60a5fa','#f97316','#c2410c'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：天氣場景 → 選配備 ============
  const L1_SCENES = [
    { key: 'rain', label: '下雨天', correct: 'umbrella',
      svg: '<ellipse cx="50" cy="30" rx="36" ry="16" fill="#9ca3af"/><ellipse cx="60" cy="28" rx="20" ry="10" fill="#d1d5db"/><line x1="30" y1="50" x2="25" y2="72" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="45" y1="55" x2="40" y2="80" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="50" x2="55" y2="75" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/><line x1="75" y1="55" x2="70" y2="80" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>' },
    { key: 'hot',  label: '大熱天', correct: 'water',
      svg: '<circle cx="50" cy="45" r="26" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="5" stroke-linecap="round"><line x1="50" y1="5" x2="50" y2="15"/><line x1="50" y1="75" x2="50" y2="85"/><line x1="10" y1="45" x2="20" y2="45"/><line x1="80" y1="45" x2="90" y2="45"/><line x1="22" y1="17" x2="28" y2="23"/><line x1="72" y1="23" x2="78" y2="17"/><line x1="22" y1="73" x2="28" y2="67"/><line x1="72" y1="67" x2="78" y2="73"/></g>' },
    { key: 'sun',  label: '晴朗天', correct: 'sunhat',
      svg: '<circle cx="50" cy="45" r="22" fill="#fcd34d"/><g stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><line x1="50" y1="15" x2="50" y2="22"/><line x1="50" y1="68" x2="50" y2="75"/><line x1="20" y1="45" x2="27" y2="45"/><line x1="73" y1="45" x2="80" y2="45"/></g><path d="M 20 78 Q 50 70 80 78" stroke="#10b981" stroke-width="5" fill="none"/>' },
    { key: 'cold', label: '好冷天', correct: 'coat',
      svg: '<g stroke="#60a5fa" stroke-width="3" fill="none"><line x1="30" y1="20" x2="30" y2="60"/><line x1="18" y1="40" x2="42" y2="40"/><line x1="22" y1="28" x2="38" y2="52"/><line x1="38" y1="28" x2="22" y2="52"/></g><g stroke="#60a5fa" stroke-width="3" fill="none"><line x1="65" y1="35" x2="65" y2="75"/><line x1="53" y1="55" x2="77" y2="55"/><line x1="57" y1="43" x2="73" y2="67"/><line x1="73" y1="43" x2="57" y2="67"/></g>' }
  ];

  function loadLevel1() {
    const pick = L1_SCENES[Math.floor(Math.random()*L1_SCENES.length)];
    STATE.l1Scene = pick;
    document.getElementById('l1-scene').innerHTML = pick.svg;
    document.getElementById('l1-label').textContent = pick.label;
    document.getElementById('l1-feedback').classList.add('hide');
    document.querySelectorAll('#level1 button[data-item]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l1Pick(btn) {
    const fb = document.getElementById('l1-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.item === STATE.l1Scene.correct) {
      fb.textContent = '🎉 答對啦！好棒！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      document.querySelectorAll('#level1 button[data-item]').forEach(b => b.disabled = true);
      setTimeout(() => {
        STATE.level = 2;
        drawProgress();
        loadLevel2();
        show('level2');
      }, 1800);
    } else {
      fb.textContent = '😊 想一想，再試試看！';
      fb.className = 'text-2xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 2：拖拉 — 雨天 / 熱天配對 ============
  const L2_ITEMS = [
    { id: 'boots',    label: '雨鞋',     weather: 'rain', emoji: '🥾' },
    { id: 'umbrella', label: '雨傘',     weather: 'rain', emoji: '☂️' },
    { id: 'hat',      label: '遮陽帽',   weather: 'hot',  emoji: '👒' },
    { id: 'bottle',   label: '水壺',     weather: 'hot',  emoji: '🧴' }
  ];
  let l2Correct = 0;

  function loadLevel2() {
    l2Correct = 0;
    const box = document.getElementById('l2-items');
    box.innerHTML = '';
    L2_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.weather = it.weather;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-lg text-gray-700 mt-1 font-bold">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level2 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l2-items [data-id="${id}"]`);
        if (!src) return;
        handleL2Drop(src, z);
      };
    });
    document.getElementById('l2-feedback').classList.add('hide');
  }

  function handleL2Drop(src, z) {
    if (src.dataset.weather === z.dataset.weather) {
      src.classList.add('popin');
      z.appendChild(src);
      src.draggable = false;
      l2Correct++;
      if (l2Correct === L2_ITEMS.length) {
        const fb = document.getElementById('l2-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！天氣小助手！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 3;
          drawProgress();
          loadLevel3();
          show('level3');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-4xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想想：大雨要拿什麼？好熱要拿什麼？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l2Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l2Selected) l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l2Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL2Drop(l2Selected, zone);
    }
    l2Selected.classList.remove('ring-4','ring-pink-400');
    l2Selected = null;
  });

  // ============ 關卡 3：颱風小背包（多選） ============
  const L3_ITEMS = [
    { id: 'water', label: '水',     emoji: '💧', correct: true  },
    { id: 'flash', label: '手電筒', emoji: '🔦', correct: true  },
    { id: 'food',  label: '餅乾',   emoji: '🍪', correct: true  },
    { id: 'toy',   label: '玩具',   emoji: '🧸', correct: false },
    { id: 'ball',  label: '球',     emoji: '⚽', correct: false },
    { id: 'ice',   label: '冰淇淋', emoji: '🍦', correct: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-sky-100 hover:bg-sky-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-sky-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-sky-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const correctIds = L3_ITEMS.filter(x => x.correct).map(x => x.id);
    const allRight = correctIds.every(id => l3Picked.has(id)) && l3Picked.size === correctIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！颱風來也不怕！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 想一想：颱風天要不要帶玩具？選 3 個最重要的～';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
