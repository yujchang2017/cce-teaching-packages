<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小小環保尖兵 — 松鼠小寶的乾淨星球</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #dcfce7 0%, #fef9c3 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .popin { animation: popin 0.6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .bounce { animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .shine { animation: shine 2s infinite; }
  @keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3) drop-shadow(0 0 20px #bef264)} }
  .confetti {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
  }
  .dropzone-active { background: #fde68a !important; transform: scale(1.08); }
  .big-btn {
    font-size: 2rem;
    padding: 1rem 2rem;
    border-radius: 9999px;
    font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: all 0.15s;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  svg text { pointer-events: none; }
  .card {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 1.5rem;
  }
  .hide { display: none !important; }
</style>
</head>
<body class="flex flex-col items-center">

<!-- 主角：松鼠小寶 SVG (可重用) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="squirrel">
      <!-- 身體 -->
      <ellipse cx="50" cy="65" rx="28" ry="25" fill="#a16207"/>
      <!-- 頭 -->
      <circle cx="50" cy="38" r="22" fill="#b45309"/>
      <!-- 耳朵 -->
      <ellipse cx="34" cy="22" rx="6" ry="9" fill="#78350f"/>
      <ellipse cx="66" cy="22" rx="6" ry="9" fill="#78350f"/>
      <ellipse cx="34" cy="22" rx="3" ry="5" fill="#fbbf24"/>
      <ellipse cx="66" cy="22" rx="3" ry="5" fill="#fbbf24"/>
      <!-- 眼睛 -->
      <circle cx="42" cy="36" r="3.5" fill="black"/>
      <circle cx="58" cy="36" r="3.5" fill="black"/>
      <circle cx="43" cy="35" r="1.2" fill="white"/>
      <circle cx="59" cy="35" r="1.2" fill="white"/>
      <!-- 鼻子 -->
      <ellipse cx="50" cy="44" rx="2.5" ry="1.8" fill="#1f2937"/>
      <!-- 嘴 -->
      <path d="M 45 48 Q 50 53 55 48" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 尾巴 -->
      <path d="M 80 60 Q 92 40 85 20 Q 75 18 72 35 Q 68 50 80 60 Z" fill="#a16207"/>
      <!-- 綠色環保披風 -->
      <path d="M 28 55 Q 50 48 72 55 L 70 72 Q 50 78 30 72 Z" fill="#16a34a" opacity="0.9"/>
      <!-- 胸口葉子 logo -->
      <ellipse cx="50" cy="63" rx="5" ry="7" fill="#bef264"/>
    </g>
  </defs>
</svg>

<!-- 頂部進度條 -->
<div class="w-full max-w-3xl p-4">
  <div class="flex items-center justify-center gap-2 text-3xl font-extrabold text-green-700">
    <svg width="60" height="60" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
    <span>松鼠小寶的乾淨星球</span>
  </div>
  <div class="flex gap-2 mt-4 justify-center" id="progress-bar">
    <!-- 填充 -->
  </div>
</div>

<!-- 關卡容器 -->
<main class="w-full max-w-3xl p-4 flex-1 flex items-center justify-center">

  <!-- 開始畫面 -->
  <section id="intro" class="card text-center popin">
    <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">嗨！我是小寶！</h1>
    <p class="text-2xl text-gray-700 mt-4">今天要和我一起當<span class="text-pink-500 font-bold">環保小尖兵</span>嗎？</p>
    <p class="text-xl text-gray-500 mt-2">一起玩 3 個小關卡！</p>
    <button onclick="startGame()" class="big-btn bg-green-400 hover:bg-green-300 text-white mt-6">開始</button>
  </section>

  <!-- 關卡 1：回收分類拖拉 -->
  <section id="level1" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">小寶：把垃圾送回家！</p>
    </div>
    <p class="text-lg text-center text-gray-600">（把上面的東西拖到下面對的顏色桶）</p>
    <div class="flex justify-around my-4 flex-wrap gap-3" id="l1-items">
      <!-- 可拖拉物品 -->
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-yellow-400" data-type="paper">
        <div class="text-5xl">📦</div>
        <div class="text-xl font-bold text-yellow-700">紙類</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-blue-400" data-type="plastic">
        <div class="text-5xl">🧴</div>
        <div class="text-xl font-bold text-blue-600">塑膠</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-red-400" data-type="metal">
        <div class="text-5xl">🥫</div>
        <div class="text-xl font-bold text-red-600">金屬</div>
      </div>
      <div class="dropzone card text-center h-32 flex flex-col items-center justify-center border-4 border-dashed border-green-400" data-type="glass">
        <div class="text-5xl">🍾</div>
        <div class="text-xl font-bold text-green-600">玻璃</div>
      </div>
    </div>
    <div class="text-center mt-4">
      <p id="l1-feedback" class="text-2xl font-bold hide"></p>
    </div>
  </section>

  <!-- 關卡 2：需要 vs 想要 點擊 -->
  <section id="level2" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">小寶：需要，還是只是想要？</p>
    </div>
    <div id="l2-target" class="text-center my-4">
      <div class="text-2xl font-bold text-pink-600 mb-2">今天這個東西是...</div>
      <div id="l2-item-display" class="text-8xl my-4">🥤</div>
      <div id="l2-item-label" class="text-2xl font-bold text-gray-700"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-6">
      <button class="big-btn bg-green-300 hover:bg-green-200 text-green-900" data-ans="need" onclick="l2Pick(this)">
        <span class="text-3xl">👍</span><br/>需要
      </button>
      <button class="big-btn bg-pink-300 hover:bg-pink-200 text-pink-900" data-ans="want" onclick="l2Pick(this)">
        <span class="text-3xl">🤔</span><br/>想要
      </button>
    </div>
    <p id="l2-feedback" class="text-2xl text-center mt-4 font-bold hide"></p>
    <p class="text-center text-lg text-gray-500 mt-2">第 <span id="l2-round">1</span> / 4 題</p>
  </section>

  <!-- 關卡 3：撿垃圾多選 -->
  <section id="level3" class="card w-full hide">
    <div class="flex items-center gap-3 mb-4">
      <svg width="70" height="70" viewBox="0 0 100 100"><use href="#squirrel"/></svg>
      <p class="text-2xl font-bold text-green-700">小寶：公園裡哪些是垃圾？點一點幫忙撿！</p>
    </div>
    <p class="text-xl text-center text-gray-600">（點一下撿起來，再點一下可以取消）</p>
    <div class="grid grid-cols-3 gap-3 mt-4" id="l3-items">
      <!-- 6 個項目 -->
    </div>
    <div class="text-center mt-4">
      <button onclick="l3Check()" class="big-btn bg-green-400 hover:bg-green-300 text-white">撿好了！</button>
      <p id="l3-feedback" class="text-2xl font-bold hide mt-3"></p>
    </div>
  </section>

  <!-- 結尾成就畫面 -->
  <section id="finale" class="card text-center hide">
    <div class="shine">
      <svg width="200" height="200" viewBox="0 0 100 100" class="mx-auto bounce"><use href="#squirrel"/></svg>
    </div>
    <div class="text-6xl mt-4">🏆</div>
    <h1 class="text-4xl font-extrabold text-green-700 mt-4">你是超棒的環保小尖兵！</h1>
    <p class="text-2xl text-gray-700 mt-4">小寶送你一張 <span class="text-pink-500 font-bold">綠葉尖兵徽章</span>！</p>
    <div class="card mt-6 bg-lime-100 border-4 border-lime-300">
      <p class="text-xl font-bold text-green-800">小小任務（回家做）</p>
      <p class="text-2xl mt-2">今天晚上，和爸爸媽媽一起把一個<br/><span class="text-green-700 font-bold">洗乾淨的寶特瓶</span>，<br/>變成好看的筆筒或小花瓶！</p>
    </div>
    <button onclick="restart()" class="big-btn bg-green-400 hover:bg-green-300 text-white mt-6">再玩一次</button>
  </section>

</main>

<script>
  // ============ 全域狀態 ============
  const STATE = { level: 0, total: 3 };

  // ============ 進度條 ============
  function drawProgress() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    for (let i = 1; i <= STATE.total; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-10 h-10 rounded-full flex items-center justify-center text-xl font-extrabold ' +
        (i < STATE.level ? 'bg-green-500 text-white' :
         i === STATE.level ? 'bg-yellow-400 text-amber-900 bounce' : 'bg-gray-300 text-gray-600');
      dot.textContent = i < STATE.level ? '★' : i;
      bar.appendChild(dot);
    }
  }

  // ============ 彩帶 ============
  function confetti() {
    const colors = ['#22c55e','#f472b6','#fbbf24','#60a5fa','#f97316','#bef264'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random()-0.5)*80) + 'vw';
      c.style.top = '50vh';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5) * 600;
      const dy = (Math.random()-0.3) * 600;
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(720deg)`, opacity: 0 }
      ], { duration: 1500, easing: 'cubic-bezier(.17,.67,.83,.67)' });
      setTimeout(() => c.remove(), 1600);
    }
  }

  // ============ 畫面切換 ============
  function show(id) {
    ['intro','level1','level2','level3','finale'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      if (s === id) { el.classList.remove('hide'); el.classList.add('popin'); }
      else { el.classList.add('hide'); el.classList.remove('popin'); }
    });
  }

  function startGame() {
    STATE.level = 1;
    drawProgress();
    loadLevel1();
    show('level1');
  }

  // ============ 關卡 1：分類拖拉 ============
  const L1_ITEMS = [
    { id: 'newspaper', label: '報紙', type: 'paper',   emoji: '📰' },
    { id: 'bottle',    label: '寶特瓶', type: 'plastic', emoji: '🧴' },
    { id: 'can',       label: '鐵罐',   type: 'metal',   emoji: '🥫' },
    { id: 'glass',     label: '玻璃瓶', type: 'glass',   emoji: '🍾' }
  ];
  let l1Correct = 0;

  function loadLevel1() {
    l1Correct = 0;
    const box = document.getElementById('l1-items');
    box.innerHTML = '';
    L1_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const d = document.createElement('div');
      d.className = 'card text-center cursor-grab bg-white shadow-lg text-5xl p-4';
      d.draggable = true;
      d.dataset.id = it.id;
      d.dataset.type = it.type;
      d.innerHTML = `<div>${it.emoji}</div><div class="text-base text-gray-700 mt-1">${it.label}</div>`;
      d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', it.id));
      d.addEventListener('touchstart', e => startTouchDrag(d, e), { passive: false });
      box.appendChild(d);
    });

    document.querySelectorAll('#level1 .dropzone').forEach(z => {
      z.ondragover = e => { e.preventDefault(); z.classList.add('dropzone-active'); };
      z.ondragleave = () => z.classList.remove('dropzone-active');
      z.ondrop = e => {
        e.preventDefault();
        z.classList.remove('dropzone-active');
        const id = e.dataTransfer.getData('text/plain');
        const src = document.querySelector(`#l1-items [data-id="${id}"]`);
        if (!src) return;
        handleL1Drop(src, z);
      };
    });
    document.getElementById('l1-feedback').classList.add('hide');
  }

  function handleL1Drop(src, z) {
    if (src.dataset.type === z.dataset.type) {
      src.classList.add('popin');
      src.style.transform = 'scale(0.5)';
      z.appendChild(src);
      src.draggable = false;
      l1Correct++;
      if (l1Correct === L1_ITEMS.length) {
        const fb = document.getElementById('l1-feedback');
        fb.classList.remove('hide');
        fb.textContent = '🎉 太棒了！回收高手！';
        fb.className = 'text-3xl font-bold text-green-500 popin';
        confetti();
        setTimeout(() => {
          STATE.level = 2;
          drawProgress();
          loadLevel2();
          show('level2');
        }, 1800);
      } else {
        const mini = document.createElement('div');
        mini.textContent = '✨';
        mini.className = 'text-3xl popin';
        z.appendChild(mini);
        setTimeout(() => mini.remove(), 600);
      }
    } else {
      src.classList.add('wiggle');
      const fb = document.getElementById('l1-feedback');
      fb.classList.remove('hide');
      fb.textContent = '😊 再想一想，這個住哪裡呢？';
      fb.className = 'text-xl font-bold text-orange-500';
      setTimeout(() => src.classList.remove('wiggle'), 400);
    }
  }

  // --- touch fallback ---
  let l1Selected = null;
  function startTouchDrag(el, e) {
    if (!el.draggable) return;
    e.preventDefault();
    if (l1Selected) l1Selected.classList.remove('ring-4','ring-pink-400');
    l1Selected = el;
    el.classList.add('ring-4','ring-pink-400');
  }
  document.addEventListener('touchend', function(e) {
    if (!l1Selected) return;
    const t = e.changedTouches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    const zone = target && target.closest('.dropzone');
    if (zone) {
      handleL1Drop(l1Selected, zone);
    }
    l1Selected.classList.remove('ring-4','ring-pink-400');
    l1Selected = null;
  });

  // ============ 關卡 2：需要 vs 想要 ============
  const L2_ITEMS = [
    { emoji: '💧', label: '水',        answer: 'need' },
    { emoji: '🍎', label: '水果',      answer: 'need' },
    { emoji: '🧸', label: '第 10 個玩具', answer: 'want' },
    { emoji: '🍭', label: '好多糖果',   answer: 'want' }
  ];
  let l2Round = 0;

  function loadLevel2() {
    l2Round = 0;
    showL2Question();
  }

  function showL2Question() {
    if (l2Round >= L2_ITEMS.length) {
      // 過關
      const fb = document.getElementById('l2-feedback');
      fb.classList.remove('hide');
      fb.textContent = '🎉 太棒了！聰明的小尖兵！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      confetti();
      setTimeout(() => {
        STATE.level = 3;
        drawProgress();
        loadLevel3();
        show('level3');
      }, 1800);
      return;
    }
    const cur = L2_ITEMS[l2Round];
    document.getElementById('l2-item-display').textContent = cur.emoji;
    document.getElementById('l2-item-display').className = 'text-8xl my-4 popin';
    document.getElementById('l2-item-label').textContent = cur.label;
    document.getElementById('l2-round').textContent = (l2Round + 1);
    document.getElementById('l2-feedback').classList.add('hide');
    document.querySelectorAll('#level2 button[data-ans]').forEach(b => { b.disabled = false; b.classList.remove('wiggle'); });
  }

  function l2Pick(btn) {
    const cur = L2_ITEMS[l2Round];
    const fb = document.getElementById('l2-feedback');
    fb.classList.remove('hide');
    if (btn.dataset.ans === cur.answer) {
      fb.textContent = '🎉 答對了！';
      fb.className = 'text-3xl text-center mt-4 font-bold text-green-500 popin';
      document.querySelectorAll('#level2 button[data-ans]').forEach(b => b.disabled = true);
      const mini = document.createElement('span');
      mini.textContent = ' ✨';
      fb.appendChild(mini);
      setTimeout(() => {
        l2Round++;
        showL2Question();
      }, 1200);
    } else {
      fb.textContent = '😊 再想一想，這個是不能沒有的嗎？';
      fb.className = 'text-xl text-center mt-4 font-bold text-orange-500';
      btn.classList.add('wiggle');
      setTimeout(() => btn.classList.remove('wiggle'), 400);
    }
  }

  // ============ 關卡 3：撿垃圾多選 ============
  const L3_ITEMS = [
    { id: 'plasticbag', label: '塑膠袋', emoji: '🛍️', isLitter: true  },
    { id: 'paper',      label: '紙屑',   emoji: '📄', isLitter: true  },
    { id: 'peel',       label: '果皮',   emoji: '🍌', isLitter: true  },
    { id: 'flower',     label: '小花',   emoji: '🌸', isLitter: false },
    { id: 'tree',       label: '小樹',   emoji: '🌳', isLitter: false },
    { id: 'bird',       label: '小鳥',   emoji: '🐦', isLitter: false }
  ];
  const l3Picked = new Set();

  function loadLevel3() {
    l3Picked.clear();
    const box = document.getElementById('l3-items');
    box.innerHTML = '';
    L3_ITEMS.slice().sort(() => Math.random()-0.5).forEach(it => {
      const b = document.createElement('button');
      b.className = 'card bg-lime-100 hover:bg-lime-200 p-4 flex flex-col items-center text-2xl';
      b.innerHTML = `<div class="text-5xl">${it.emoji}</div><div class="mt-1 text-lg font-bold">${it.label}</div>`;
      b.onclick = () => {
        if (l3Picked.has(it.id)) {
          l3Picked.delete(it.id);
          b.classList.remove('ring-4','ring-green-400','bg-green-100');
          b.classList.add('bg-lime-100');
        } else {
          l3Picked.add(it.id);
          b.classList.add('ring-4','ring-green-400','bg-green-100');
          b.classList.remove('bg-lime-100');
        }
      };
      box.appendChild(b);
    });
    document.getElementById('l3-feedback').classList.add('hide');
  }

  function l3Check() {
    const litterIds = L3_ITEMS.filter(x => x.isLitter).map(x => x.id);
    const allRight = litterIds.every(id => l3Picked.has(id)) && l3Picked.size === litterIds.length;
    const fb = document.getElementById('l3-feedback');
    fb.classList.remove('hide');
    if (allRight) {
      fb.textContent = '🎉 超棒！公園變乾淨了！';
      fb.className = 'text-3xl font-bold text-green-500 popin mt-3';
      confetti();
      setTimeout(() => {
        STATE.level = 4;
        drawProgress();
        show('finale');
        setTimeout(confetti, 300);
        setTimeout(confetti, 900);
      }, 1800);
    } else {
      fb.textContent = '😊 再想一想：小花、小鳥不是垃圾喔！只選『髒東西』。';
      fb.className = 'text-xl font-bold text-orange-500 mt-3';
    }
  }

  function restart() {
    STATE.level = 0;
    show('intro');
    drawProgress();
  }

  // init
  drawProgress();
</script>
</body>
</html>
