      const c=document.createElement('div');

      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=Math.random()*0.8+'s';

  function wordCount(s){ return s.replace(/\s/g,'').length; }

  for(let i=1;i<totalLevels;i++){
    const btn = document.getElementById('btn-next-'+i);
    if(btn) btn.addEventListener('click', ()=> goLevel(i+1));
  }

  // ===== Level 1: Data science =====
  document.getElementById('btn-check-1').addEventListener('click', function(){
    const numInputs = document.querySelectorAll('.q1-input');
    let correct = 0;
    numInputs.forEach(inp => {
      const ans = parseFloat(inp.dataset.answer);
      const val = parseFloat(inp.value);
      const tolerance = ans > 10 ? 10 : 0.3;
      if(Math.abs(val - ans) <= tolerance){ inp.style.borderColor='#34d399'; correct++; }
      else { inp.style.borderColor='#ef4444'; inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),500); }
    });
    const txt = document.querySelector('.q1-text');
    const tw = wordCount(txt.value);
    const textOk = tw >= 30;
    const pts = Math.round((correct/numInputs.length*6) + (textOk ? 4 : 2));
    addScore(pts);
    document.getElementById('feedback-1').innerHTML = (correct >= 3 && textOk)
      ? '<span class="text-emerald-400 pop">pH 撠閮?????迤蝣綽?</span>'
      : `<span class="text-amber-400">?詨?${correct}/${numInputs.length} 甇?Ⅱ? + (textOk ? '' : ' 撅?批?????撖艾?) + '</span>';
    unlockBadge(1); markDot(1); showNext(1); completed.add(1);
    if(correct >= 3 && textOk) confetti();
    this.disabled = true;
  });

  // ===== Level 2: Data interpretation 1 =====
  document.getElementById('btn-check-2').addEventListener('click', function(){
    const numInputs = document.querySelectorAll('.q2-input');
    let correct = 0;
    numInputs.forEach(inp => {
      const ans = parseFloat(inp.dataset.answer);
      const val = parseFloat(inp.value);
      const tol = ans > 10 ? 3 : 0.5;
      if(Math.abs(val - ans) <= tol){ inp.style.borderColor='#34d399'; correct++; }
      else { inp.style.borderColor='#ef4444'; }
    });
    const txt = document.querySelector('.q2-text');
    const tw = wordCount(txt.value);
    const textOk = tw >= 40;
    const pts = Math.round((correct/numInputs.length*6) + (textOk ? 4 : 2));
    addScore(pts);
    document.getElementById('feedback-2').innerHTML = (correct >= 2 && textOk)
      ? '<span class="text-emerald-400 pop">???折◢?芸??移皞?</span>'
      : `<span class="text-amber-400">?詨?${correct}/${numInputs.length} 甇?Ⅱ?圾??????曉潦??????扼?/span>`;
    unlockBadge(2); markDot(2); showNext(2); completed.add(2);
    if(correct >= 2 && textOk) confetti();
    this.disabled = true;
  });

  // ===== Level 3: Data interpretation 2 =====
  document.getElementById('btn-check-3').addEventListener('click', function(){
    let pts = 0;
    const sel = document.querySelector('.q3-select');
    if(sel.value === sel.dataset.answer){ sel.style.borderColor='#34d399'; pts += 3; }
    else { sel.style.borderColor='#ef4444'; }
    const cbs = document.querySelectorAll('.q3-cb');
    let cbOk = true;
    cbs.forEach(cb => { if(cb.checked !== (cb.dataset.correct === 'true')) cbOk = false; });
    if(cbOk) pts += 3;
    const txt = document.querySelector('.q3-text');
    if(wordCount(txt.value) >= 30) pts += 4; else pts += 2;
    addScore(pts);
    document.getElementById('feedback-3').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?拙??拍車?瑞宏鞈?閰桅?甇?Ⅱ嚗?/span>'
      : '<span class="text-amber-400">瘜冽?嚗????蒂?芸???憭批???蔣?踹????游擃?/span>';
    unlockBadge(2); markDot(3); showNext(3); completed.add(3);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 4: System thinking =====
  const dragItems4 = document.querySelectorAll('#drag-box-4 .drag-item');
  const slots4 = document.querySelectorAll('svg .loop-slot');
  let draggedItem4 = null;
  dragItems4.forEach(item => {
    item.addEventListener('dragstart', e => { draggedItem4 = item; item.classList.add('dragging'); e.dataTransfer.setData('text/plain',''); });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
  });
  slots4.forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault(); slot.classList.remove('over');
      if(draggedItem4 && draggedItem4.dataset.match === slot.dataset.accept){
        slot.setAttribute('fill','rgba(52,211,153,.2)');
        slot.setAttribute('stroke','#34d399');
        const txt = slot.nextElementSibling;
        if(txt && txt.tagName === 'text') txt.textContent = draggedItem4.textContent;
        draggedItem4.style.opacity = '0.3'; draggedItem4.draggable = false;
        slot.dataset.filled = 'true';
      } else {
        slot.classList.add('shake'); setTimeout(()=>slot.classList.remove('shake'),500);
      }
    });
  });

  document.getElementById('btn-check-4').addEventListener('click', function(){
    let pts = 0;
    let filledCount = 0;
    slots4.forEach(s => { if(s.dataset.filled === 'true') filledCount++; });
    pts += filledCount * 3;
    const txt = document.querySelector('.q4-text');
    if(wordCount(txt.value) >= 50) pts += 4; else if(wordCount(txt.value) >= 20) pts += 2;
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-4').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">蝟餌絞???橘?甇?Ⅱ颲刻?????獢輸?嚗?/span>'
      : '<span class="text-amber-400">????儐?唳甇??擖?瑽▼暺????璉脣靽風???剜??辣隡貊?靘? 50+ 摮?/span>';
    unlockBadge(3); markDot(4); showNext(4); completed.add(4);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 5: Policy =====
  document.getElementById('btn-check-5').addEventListener('click', function(){
    let pts = 0;
    const numInputs = document.querySelectorAll('.q5-input');
    numInputs.forEach(inp => {
      const val = parseFloat(inp.value);
      const ans = parseFloat(inp.dataset.answer);
      if(Math.abs(val - ans) <= 2){ inp.style.borderColor='#34d399'; pts += 2; }
      else { inp.style.borderColor='#ef4444'; }
    });
    const txts = document.querySelectorAll('.q5-text');
    txts.forEach(t => { if(wordCount(t.value) >= 40) pts += 2; else if(wordCount(t.value) >= 20) pts += 1; });
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-5').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?輻?瘥????唬?嚗?/span>'
      : '<span class="text-amber-400">30?30?格?=30%靽風?????9.2%???交?頛??游?撖艾?/span>';
    unlockBadge(4); markDot(5); showNext(5); completed.add(5);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 6: Ethics =====
  document.getElementById('btn-check-6').addEventListener('click', function(){
    let pts = 0;
    const tA = wordCount(document.querySelector('.q6-textA').value);
    const tB = wordCount(document.querySelector('.q6-textB').value);
    const tC = wordCount(document.querySelector('.q6-textC').value);
    if(tA >= 50) pts += 3; else if(tA >= 25) pts += 1;
    if(tB >= 50) pts += 3; else if(tB >= 25) pts += 1;
    if(tC >= 40) pts += 4; else if(tC >= 20) pts += 2;
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-6').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?拚??游??曉??湛??◎?寞??遣閮剜改?</span>'
      : '<span class="text-amber-400">?拇蝡?? 100+ 摮??◎?寞? 80+ 摮????????犖??瘙?/span>';
    unlockBadge(5); markDot(6); showNext(6); completed.add(6);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 7: CER =====
  document.getElementById('btn-check-7').addEventListener('click', function(){
    let pts = 0;
    const fields = ['.q7-claim','.q7-evidence','.q7-reasoning','.q7-rebuttal'];
    const minWords = [15, 30, 25, 25];
    fields.forEach((sel,i) => {
      const wc = wordCount(document.querySelector(sel).value);
      if(wc >= minWords[i]) pts += 2.5; else if(wc >= 10) pts += 1;
    });
    addScore(Math.min(Math.round(pts), 10));
    document.getElementById('feedback-7').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">CER ?挾蝯?摰嚗?擏挾??嚗?/span>'
      : '<span class="text-amber-400">?挾蝯????祕?vidence ?撘 2+ 蝑?dp ?豢??ebuttal ??輯?撠蝡??擏?/span>';
    unlockBadge(6); markDot(7); showNext(7); completed.add(7);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 8: Policy advocacy =====
  document.getElementById('btn-check-8').addEventListener('click', function(){
    let pts = 0;
    const inputs = document.querySelectorAll('.q8-input');
    let filled = 0;
    inputs.forEach(inp => { if(inp.value.trim().length > 3) filled++; });
    if(filled >= 4) pts += 3; else pts += 1;
    const txt = document.querySelector('.q8-text');
    const wc = wordCount(txt.value);
    if(wc >= 75) pts += 7; else if(wc >= 40) pts += 4; else pts += 1;
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-8').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?拙拿??鈭箏????湛??單??貉?霅???</span>'
      : '<span class="text-amber-400">?拙拿??鈭箄”?潮?憛怠神摰??? 150+ 摮?撘 2+ 蝑??/span>';
    unlockBadge(7); markDot(8); showNext(8); completed.add(8);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 9: Essay =====
  const essayArea = document.querySelector('.q9-essay');
  if(essayArea){
    essayArea.addEventListener('input', function(){
      document.getElementById('essay-count').textContent = wordCount(this.value);
    });
  }
  document.getElementById('btn-check-9').addEventListener('click', function(){
    const wc = wordCount(essayArea.value);
    let pts = 0;
    if(wc >= 250) pts += 5; else if(wc >= 150) pts += 3; else pts += 1;
    if(wc >= 500) pts += 5; else if(wc >= 350) pts += 3; else pts += 1;
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-9').innerHTML = wc >= 400
      ? '<span class="text-emerald-400 pop">頝典??游?隢?蝯?摰嚗?/span>'
      : `<span class="text-amber-400">?桀? ${wc} 摮璅?500+ 摮??瘨菔?蝘飛?瘝餌???典銝雁摨艾?/span>`;
    unlockBadge(8); markDot(9); showNext(9); completed.add(9);
    if(wc >= 400) confetti();
    this.disabled = true;
  });

  // ===== Level 10: Metacognition =====
  function updateMetaCount(){
    const t1 = wordCount(document.querySelector('.q10-before').value);
    const t2 = wordCount(document.querySelector('.q10-after').value);
    const t3 = wordCount(document.querySelector('.q10-how').value);
    document.getElementById('meta-count').textContent = t1+t2+t3;
  }
  document.querySelectorAll('.q10-before,.q10-after,.q10-how').forEach(el => el.addEventListener('input', updateMetaCount));

  document.getElementById('btn-check-10').addEventListener('click', function(){
    const total = parseInt(document.getElementById('meta-count').textContent);
    let pts = 0;
    if(total >= 100) pts = 10; else if(total >= 60) pts = 7; else if(total >= 30) pts = 4; else pts = 2;
    addScore(pts);
    document.getElementById('feedback-10').innerHTML = total >= 80
      ? '<span class="text-emerald-400 pop">敺身隤?楛?鳴?雿皜??膩隤頧???蝔?/span>'
      : `<span class="text-amber-400">?桀? ${total} 摮?? 100+ 摮?銝血??怠擃?隤頧?暺?/span>`;
    unlockBadge(9); markDot(10); showNext(10); completed.add(10);
    if(total >= 80) confetti();
    this.disabled = true;
  });

  // ===== Level 11: Open reflection + WSA =====
  document.getElementById('btn-check-11').addEventListener('click', function(){
    let pts = 0;
    const r1 = wordCount(document.querySelector('.q11-r1').value);
    const r2 = wordCount(document.querySelector('.q11-r2').value);
    if(r1 >= 50) pts += 3; else if(r1 >= 25) pts += 1;
    if(r2 >= 50) pts += 3; else if(r2 >= 25) pts += 1;
    const wsaCbs = document.querySelectorAll('.wsa-cb:checked');
    const wsaCategories = new Set();
    wsaCbs.forEach(cb => {
      const cat = cb.closest('div').querySelector('.font-bold');
      if(cat) wsaCategories.add(cat.textContent);
    });
    if(wsaCategories.size >= 4) pts += 4; else if(wsaCategories.size >= 2) pts += 2;
    addScore(Math.min(pts, 10));
    document.getElementById('feedback-11').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?楛?伐?WSA ????隢曉??湛?雿歇? Level V ???祆?嚗?/span>'
      : '<span class="text-amber-400">?拍???? 100+ 摮SA ???瘝餌?/隤脩?/??/蝷曄黎嚗???暸?喳? 1 ??/span>';
    markDot(11); completed.add(11);
    if(pts >= 6){
      confetti();
      setTimeout(()=> goLevel(totalLevels+1), 1500);
    }
    this.disabled = true;
  });
