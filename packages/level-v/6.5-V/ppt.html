<script>
(function(){
  const slides = Array.from(document.querySelectorAll('.slide'));
  const cur = document.getElementById('navCur');
  if (!slides.length || !cur) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting && e.intersectionRatio > 0.5) {
        const i = slides.indexOf(e.target);
        if (i >= 0) cur.textContent = i + 1;
      }
    });
  }, { threshold: [0.5] });
  slides.forEach(s => io.observe(s));
  document.addEventListener('keydown', e => {
    const i = slides.findIndex(s => {
      const r = s.getBoundingClientRect();
      return r.top >= -10 && r.top < window.innerHeight * 0.5;
    });
    const ci = i >= 0 ? i : 0;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      const next = slides[Math.min(ci + 1, slides.length - 1)];
      if (next) next.scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      const prev = slides[Math.max(ci - 1, 0)];
      if (prev) prev.scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>
