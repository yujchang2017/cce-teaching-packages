const chainItems = [
  { id: 'c1', text: '瘨祥?之?頃鞎瑚?甈⊥抒??, order: 1 },
  { id: 'c2', text: '?Ｗ?雿輻敺??箏誥璉', order: 2 },

];

let currentChainOrder = [];

function initChain() {
  const shuffled = [...chainItems].sort(() => Math.random() - 0.5);
  currentChainOrder = shuffled.map(item => item.id);
  renderChain();
}

function renderChain() {
  const container = document.getElementById('causal-chain');
  container.innerHTML = '';
  currentChainOrder.forEach((id, idx) => {
    const item = chainItems.find(c => c.id === id);
    const div = document.createElement('div');
    div.className = 'flex items-center gap-2 bg-white p-3 rounded-lg shadow-sm border border-blue-100';
    div.innerHTML = `
      <span class="bg-blue-100 text-blue-800 font-bold w-8 h-8 flex items-center justify-center rounded-full text-sm">${idx + 1}</span>
      <span class="flex-1 text-gray-700">${item.text}</span>
      <div class="flex flex-col gap-1">
        <button onclick="moveChainItem(${idx},-1)" class="text-blue-500 hover:text-blue-700 text-sm px-1" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>??/button>
        <button onclick="moveChainItem(${idx},1)" class="text-blue-500 hover:text-blue-700 text-sm px-1" ${idx === currentChainOrder.length - 1 ? 'disabled style="opacity:0.3"' : ''}>??/button>
      </div>
    `;
    container.appendChild(div);
  });
}

function moveChainItem(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentChainOrder.length) return;
  [currentChainOrder[idx], currentChainOrder[newIdx]] = [currentChainOrder[newIdx], currentChainOrder[idx]];
  renderChain();
}
