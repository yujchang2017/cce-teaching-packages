<script>
/* ===== Core Engine ===== */
let score = 0;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function addScore(n){score+=n; $('#score').textContent=score;}
function showNext(cur,nxt){
  $(`#dot-${cur}`).classList.remove('active');
  $(`#dot-${cur}`).classList.add('done');
  if(nxt<=10){$(`#dot-${nxt}`).classList.add('active');}
  $(`#level-${cur}`).classList.add('hidden-screen');
  const next = nxt<=10 ? $(`#level-${nxt}`) : $('#level-done');
  next.classList.remove('hidden-screen');
  next.scrollIntoView({behavior:'smooth',block:'start'});
}
function confetti(){for(let i=0;i<30;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#0ea5e9','#06b6d4','#10b981','#f59e0b','#ec4899'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2500);}}
function countWords(id,wcId){const t=$(`#${id}`);const w=$(`#${wcId}`);if(!t||!w)return;t.addEventListener('input',()=>{const len=t.value.replace(/\s/g,'').length;w.textContent=len+' 摮?;});}

/* ===== Drag & Drop for Section 1 ===== */
(function(){
  const items = $$('#items-box-1 .drag-item');
  const slots = $$('svg .loop-slot');
  let matched = 0;
  items.forEach(item => {
    item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', item.dataset.match); item.classList.add('dragging'); });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
  });
  slots.forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault(); slot.classList.remove('over');
      const val = e.dataTransfer.getData('text/plain');
      if(val === slot.dataset.slot){
        const txt = document.getElementById('slot'+val);
        const src = document.querySelector(`.drag-item[data-match="${val}"]`);
        if(txt) txt.textContent = src.textContent;
        src.draggable = false; src.style.opacity='.3';
        slot.style.fill='#bbf7d0'; slot.style.stroke='#22c55e';
        matched++;
        addScore(1);
        if(matched>=8){ $('#btn-next-1').disabled=false; }
      } else { slot.classList.add('shake'); setTimeout(()=>slot.classList.remove('shake'),400); }
    });
  });
})();

/* ===== Section 1 next ===== */
$('#btn-next-1').addEventListener('click', () => {
  const v = $('#q1-interp').value.trim();
  if(v.length >= 20){ addScore(4); showNext(1,2); confetti(); }

});

  if(a>=100 && b>=30 && c>=20){ addScore(10); $('#final-score').textContent=score; showNext(10,11); confetti(); }
  else { alert('Q10-1 &#x2265;100 摮?Q10-2 &#x2265;30 摮?Q10-3 &#x2265;20 摮?); }

/* ===== Enable buttons when content exists ===== */
function watchInputs(sectionNum, fields, btn){
  fields.forEach(f => {
    const el = $(f);
    if(!el) return;
    el.addEventListener('input', () => {
      const allFilled = fields.every(ff => { const e = $(ff); return e && (e.value||'').trim().length > 0; });
      $(btn).disabled = !allFilled;
    });
  });
}
watchInputs(2, ['#q21','#q22'], '#btn-next-2');
watchInputs(4, ['#q4a','#q4b'], '#btn-next-4');
watchInputs(5, ['#q5-case','#q5s','#q5p','#q5r','#q5i','#q5-loop'], '#btn-next-5');
watchInputs(6, ['#q6-main','#q6-reflect'], '#btn-next-6');

watchInputs(9, ['#q9-title','#q9-body'], '#btn-next-9');
watchInputs(10, ['#q10a','#q10b','#q10c'], '#btn-finish');

/* Matrix auto-enable */
(function(){
  const inputs = ['#m1a','#m1b','#m1c','#m1d','#m2a','#m2b','#m2c','#m2d','#m3a','#m3b','#m3c','#m3d','#m4a','#m4b','#m4c','#m4d','#m5a','#m5b','#m5c','#m5d'];
  inputs.forEach(sel => {
    const el = $(sel);
    if(el) el.addEventListener('input', () => {
      let filled = 0;
      for(let i=1;i<=5;i++){
        if($(`#m${i}a`).value && $(`#m${i}b`).value && $(`#m${i}c`).value && $(`#m${i}d`).value) filled++;
      }
      $('#btn-next-3').disabled = filled < 4;
    });
    if(el && el.tagName === 'SELECT') el.addEventListener('change', () => el.dispatchEvent(new Event('input')));
  });
})();
</script>
