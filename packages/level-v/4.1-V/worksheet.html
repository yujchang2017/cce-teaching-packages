// ===== Level 6: CLD Drag =====
const dragItems6 = document.querySelectorAll('#drag-box-6 .drag-item');
const slots6 = document.querySelectorAll('svg.loop .loop-slot');
let draggedItem6 = null;
dragItems6.forEach(item => {
  item.addEventListener('dragstart', e => { draggedItem6 = item; item.classList.add('dragging'); e.dataTransfer.setData('text/plain',''); });
  item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
});
slots6.forEach(slot => {
  slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('over'));
  slot.addEventListener('drop', e => {
    e.preventDefault(); slot.classList.remove('over');
    if(draggedItem6 && draggedItem6.dataset.match === slot.dataset.accept){
      slot.setAttribute('fill','rgba(52,211,153,.2)');
      slot.setAttribute('stroke','#34d399');
      const txt = slot.nextElementSibling;
      if(txt && txt.tagName === 'text') txt.textContent = draggedItem6.textContent;
      draggedItem6.style.opacity = '0.3'; draggedItem6.draggable = false;
      slot.dataset.filled = 'true';
    } else {
      slot.classList.add('shake'); setTimeout(()=>slot.classList.remove('shake'),500);
    }
  });
});
