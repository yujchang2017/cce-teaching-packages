<script>
const slides = document.querySelectorAll('.slide');
const pageNum = document.getElementById('page-num');
const total = slides.length;
const viewport = document.getElementById('viewport');

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = Array.from(slides).indexOf(e.target);
      pageNum.textContent = (idx + 1) + ' / ' + total;
    }
  });
}, { root: viewport, threshold: 0.5 });
slides.forEach(s => obs.observe(s));

document.addEventListener('keydown', e => {
  const idx = Array.from(slides).findIndex(s => {
    const r = s.getBoundingClientRect();
    return r.top >= -10 && r.top < window.innerHeight / 2;
  });
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    if (idx < total - 1) slides[idx + 1].scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    if (idx > 0) slides[idx - 1].scrollIntoView({ behavior: 'smooth' });
  }
});

const hash = location.hash.slice(1);
if (hash) {
  const target = document.getElementById(hash);
  if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 100);
}
</script>
