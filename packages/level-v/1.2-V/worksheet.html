<script>
(function(){
  let score=0, currentLevel=1;
  const totalLevels=14;
  const pointsPerLevel=[10,12,12,8,10,14,14,16,16,18,20,18,30,14]; // sum=212, we cap display at 200

  // --- Utility ---
  function $(id){return document.getElementById(id);}
  function show(n){document.querySelectorAll('[id^="level-"]').forEach(s=>{s.classList.add('hidden-screen');s.classList.remove('fade-in');});const el=$('level-'+n);if(el){el.classList.remove('hidden-screen');el.classList.add('fade-in');}}
  function addScore(pts){score+=pts; $('score').textContent=Math.min(score,200);}
  function updateDots(n){for(let i=1;i<=totalLevels;i++){const d=$('dot-'+i);if(!d)continue;d.className='progress-dot';if(i<n)d.classList.add('done');else if(i===n)d.classList.add('active');}}
  function confetti(){for(let i=0;i<30;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#818cf8','#34d399','#f59e0b','#f43f5e','#2dd4bf'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2500);}}
  function nextLevel(){currentLevel++;if(currentLevel>totalLevels){show('done');$('final-score').textContent=Math.min(score,200);confetti();}else{show(currentLevel);updateDots(currentLevel);}}
  function wordCount(id,wcId){const ta=$(id);const wc=$(wcId);if(!ta||!wc)return;ta.addEventListener('input',()=>{wc.textContent=ta.value.replace(/\s/g,'').length;});}

  // --- Drag & Drop for Level 1,4 ---
  function setupDrag(containerSel, zoneSel, matchAttr, feedbackId, btnId, pts){
    const container=document.querySelector(containerSel);
    if(!container) return;
    const items=container.querySelectorAll('.drag-item');
    const zones=document.querySelectorAll(zoneSel+' .drop-zone');
    let filled=0, total=zones.length;
    items.forEach(item=>{
      item.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.getAttribute(matchAttr));item.classList.add('dragging');});
      item.addEventListener('dragend',()=>item.classList.remove('dragging'));
    });
    zones.forEach(zone=>{
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
      zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
      zone.addEventListener('dragenter',e=>e.preventDefault());
      zone.addEventListener('drop',e=>{
        e.preventDefault();zone.classList.remove('over');
        const val=e.dataTransfer.getData('text/plain');
        if(val===zone.dataset.accept){
          const src=container.querySelector('['+matchAttr+'="'+val+'"]');
          if(src){zone.appendChild(src);src.draggable=false;src.classList.add('pop');filled++;
            if(filled>=total){$(feedbackId).innerHTML='<span class="text-emerald-400 font-bold">?券甇?Ⅱ!</span>';$(btnId).disabled=false;addScore(pts);}}
        } else {zone.classList.add('shake');setTimeout(()=>zone.classList.remove('shake'),400);}
      });
    });
  }

  // --- Level 1 drag ---
  setupDrag('#items-box-1','#level-1','data-match','feedback-1','btn-next-1',pointsPerLevel[0]);
  $('btn-next-1').addEventListener('click',nextLevel);

  // --- Level 2 select quiz ---
  $('btn-check-2').addEventListener('click',()=>{
    const answers={co2:['1','1000'],ch4:['28','12'],n2o:['273','109']};
    let correct=0;
    ['co2','ch4','n2o'].forEach(g=>{
      if($('gwp-'+g).value===answers[g][0])correct++;
      if($('life-'+g).value===answers[g][1])correct++;
    });
    if(correct>=5){$('feedback-2').innerHTML='<span class="text-emerald-400 font-bold">'+correct+'/6 甇?Ⅱ!</span>';$('btn-next-2').disabled=false;addScore(pointsPerLevel[1]);}
    else{$('feedback-2').innerHTML='<span class="text-rose-400">'+correct+'/6 甇?Ⅱ嚗??岫??/span>';}
  });
  $('btn-next-2').addEventListener('click',nextLevel);

  // --- Level 3 calc ---
  $('btn-check-3').addEventListener('click',()=>{
    const a1=parseInt($('calc-q1').value), a2=parseInt($('calc-q2').value), a3=parseInt($('calc-q3').value);
    let c=0;
    if(a1===14000)c++; if(a2===54600)c++; if(a3===62600)c++;
    if(c>=2){$('feedback-3').innerHTML='<span class="text-emerald-400 font-bold">'+c+'/3 甇?Ⅱ!</span>';$('btn-next-3').disabled=false;addScore(pointsPerLevel[2]);}
    else{$('feedback-3').innerHTML='<span class="text-rose-400">'+c+'/3 甇?Ⅱ??蝷綽?CO2e = ???x GWP-100</span>';}
  });
  $('btn-next-3').addEventListener('click',nextLevel);

  // --- Level 4 drag ---
  setupDrag('#items-box-4','#level-4','data-match','feedback-4','btn-next-4',pointsPerLevel[3]);
  $('btn-next-4').addEventListener('click',nextLevel);

  // --- Level 5 quiz ---
  (function(){
    const box=$('q5-box');if(!box)return;
    let answered=0;
    box.querySelectorAll('.quiz-item').forEach(qi=>{
      qi.querySelectorAll('.btn-ans').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const correct=qi.dataset.correct;
          qi.querySelectorAll('.btn-ans').forEach(b=>b.disabled=true);
          if(btn.dataset.ans===correct){qi.style.borderColor='#34d399';answered++;}
          else{qi.style.borderColor='#f43f5e';qi.classList.add('shake');setTimeout(()=>qi.classList.remove('shake'),400);}
          if(answered>=3){$('feedback-5').innerHTML='<span class="text-emerald-400 font-bold">?券甇?Ⅱ!</span>';$('btn-next-5').disabled=false;addScore(pointsPerLevel[4]);}
        });
      });
    });
  })();
  $('btn-next-5').addEventListener('click',nextLevel);

  // --- Level 6 鞈?閰桅? #1 ---
  wordCount('q62','wc-q62');
  (function(){
    const radios=document.querySelectorAll('input[name="q61"]');
    function check6(){
      const sel=document.querySelector('input[name="q61"]:checked');
      const txt=$('q62').value.replace(/\s/g,'');
      if(sel && sel.value==='B' && txt.length>=20){$('btn-next-6').disabled=false;}
    }
    radios.forEach(r=>r.addEventListener('change',check6));
    $('q62').addEventListener('input',check6);
  })();
  $('btn-next-6').addEventListener('click',()=>{addScore(pointsPerLevel[5]);nextLevel();});

  // --- Level 7 鞈?閰桅? #2 ---
  wordCount('q72','wc-q72');
  (function(){
    function check7(){
      const g1=$('gap1').value.trim(), g2=$('gap2').value.trim(), g3=$('gap3').value.trim();
      const txt=$('q72').value.replace(/\s/g,'');
      if(g1&&g2&&g3&&txt.length>=30){$('btn-next-7').disabled=false;}
    }
    ['gap1','gap2','gap3'].forEach(id=>$(id).addEventListener('input',check7));
    $('q72').addEventListener('input',check7);
  })();
  $('btn-next-7').addEventListener('click',()=>{addScore(pointsPerLevel[6]);nextLevel();});

  // --- Level 8 蝟餌絞??drag ---
  (function(){
    const items=document.querySelectorAll('#loop-items-8 .drag-item');
    const slots=document.querySelectorAll('#level-8 .loop-slot');
    let filled8=0;
    items.forEach(item=>{
      item.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.dataset.slotMatch);item.classList.add('dragging');});
      item.addEventListener('dragend',()=>item.classList.remove('dragging'));
    });
    slots.forEach(slot=>{
      slot.addEventListener('dragover',e=>e.preventDefault());
      slot.addEventListener('dragenter',e=>{e.preventDefault();slot.classList.add('over');});
      slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
      slot.addEventListener('drop',e=>{
        e.preventDefault();slot.classList.remove('over');
        const val=e.dataTransfer.getData('text/plain');
        if(val===slot.dataset.slot){
          const textEl=$('slot-'+val+'-text');
          const src=document.querySelector('#loop-items-8 [data-slot-match="'+val+'"]');
          if(textEl&&src){textEl.textContent=src.textContent;src.remove();filled8++;
            if(filled8>=4){$('feedback-8').innerHTML='<span class="text-emerald-400 font-bold">??敺芰摰?!</span>';
              function check8ext(){if($('q8-ext').value.replace(/\s/g,'').length>=20)$('btn-next-8').disabled=false;}
              $('q8-ext').addEventListener('input',check8ext);check8ext();}}
        } else {slot.classList.add('shake');setTimeout(()=>slot.classList.remove('shake'),400);}
      });
    });
  })();
  $('btn-next-8').addEventListener('click',()=>{addScore(pointsPerLevel[7]);nextLevel();});

  // --- Level 9 ?怎??拚 ---
  wordCount('q92','wc-q92');
  (function(){
    function check9(){
      const sel=document.querySelector('input[name="q91"]:checked');
      const txt=$('q92').value.replace(/\s/g,'');
      if(sel&&txt.length>=100){$('btn-next-9').disabled=false;}
    }
    document.querySelectorAll('input[name="q91"]').forEach(r=>r.addEventListener('change',check9));
    $('q92').addEventListener('input',check9);
  })();
  $('btn-next-9').addEventListener('click',()=>{addScore(pointsPerLevel[8]);nextLevel();});

  // --- Level 10 CER+?? ---
  (function(){
    function check10(){
      const c=$('cer-c').value.replace(/\s/g,'').length;
      const e=$('cer-e').value.replace(/\s/g,'').length;
      const r=$('cer-r').value.replace(/\s/g,'').length;
      const rb=$('cer-rb').value.replace(/\s/g,'').length;
      if(c>=10&&e>=20&&r>=20&&rb>=20)$('btn-next-10').disabled=false;
    }
    ['cer-c','cer-e','cer-r','cer-rb'].forEach(id=>$(id).addEventListener('input',check10));
  })();
  $('btn-next-10').addEventListener('click',()=>{addScore(pointsPerLevel[9]);nextLevel();});

  // --- Level 11 ?輻??∟降 ---
  (function(){
    function check11(){
      const title=$('prop-title').value.trim().length;
      const audit=$('prop-audit').value.replace(/\s/g,'').length;
      const cer=$('prop-cer').value.replace(/\s/g,'').length;
      const budget=$('prop-budget').value.replace(/\s/g,'').length;
      const wsaCount=document.querySelectorAll('#level-11 input[type="checkbox"]:checked').length;
      if(title>=3&&audit>=20&&cer>=40&&budget>=20&&wsaCount>=2)$('btn-next-11').disabled=false;
    }
    ['prop-title','prop-audit','prop-cer','prop-budget'].forEach(id=>$(id).addEventListener('input',check11));
    document.querySelectorAll('#level-11 input[type="checkbox"]').forEach(cb=>cb.addEventListener('change',check11));
  })();
  $('btn-next-11').addEventListener('click',()=>{addScore(pointsPerLevel[10]);nextLevel();});

  // --- Level 12 ?豢?蝘飛 ---
  wordCount('q122','wc-q122');
  (function(){
    function check12(){
      const ci=['ci-cn','ci-us','ci-in','ci-tw'].every(id=>$(id).value.trim().length>0);
      const a1=$('q121').value.replace(/\s/g,'').length>=20;
      const a2=$('q122').value.replace(/\s/g,'').length>=40;
      if(ci&&a1&&a2)$('btn-next-12').disabled=false;
    }
    ['ci-cn','ci-us','ci-in','ci-tw','q121','q122'].forEach(id=>$(id).addEventListener('input',check12));
  })();
  $('btn-next-12').addEventListener('click',()=>{addScore(pointsPerLevel[11]);nextLevel();});

  // --- Level 13 頝典?隢? ---
  wordCount('essay','wc-essay');
  (function(){
    $('essay').addEventListener('input',()=>{
      if($('essay').value.replace(/\s/g,'').length>=400)$('btn-next-13').disabled=false;
      else $('btn-next-13').disabled=true;
    });
  })();
  $('btn-next-13').addEventListener('click',()=>{addScore(pointsPerLevel[12]);nextLevel();});

  // --- Level 14 敺身隤 ---
  wordCount('meta-1','wc-meta1');
  wordCount('meta-2','wc-meta2');
  (function(){
    function check14(){
      const m1=$('meta-1').value.replace(/\s/g,'').length;
      const m2=$('meta-2').value.replace(/\s/g,'').length;
      const m3=$('meta-3').value.replace(/\s/g,'').length;
      if(m1>=80&&m2>=80&&m3>=10)$('btn-finish').disabled=false;
    }
    ['meta-1','meta-2','meta-3'].forEach(id=>$(id).addEventListener('input',check14));
  })();
  $('btn-finish').addEventListener('click',()=>{addScore(pointsPerLevel[13]);currentLevel=totalLevels+1;show('done');$('final-score').textContent=Math.min(score,200);confetti();});

  // Init
  show(1);updateDots(1);
})();
</script>
</body>
</html>
