<script>
(function(){
  const slides = Array.from(document.querySelectorAll('.slide'));
  const navCur = document.getElementById('navCur');
  if (!slides.length || !navCur) return;
  let current = 0;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && e.intersectionRatio >= 0.5) {
        const i = slides.indexOf(e.target);
        if (i >= 0) { current = i; navCur.textContent = i + 1; }
      }
    });
  }, { threshold: [0.5] });
  slides.forEach(s => obs.observe(s));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      slides[Math.min(current + 1, slides.length - 1)].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      slides[Math.max(current - 1, 0)].scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>
