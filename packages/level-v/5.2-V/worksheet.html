    if(txt.value.trim().length < 150) shake(txt);
    if(ok){
      showFeedback(8,true,'璅⊥?質?摰?嚗摰喲?靽犖??摰?餈啁阮????);
      passLevel(8,10,8);
    } else {
      showFeedback(8,false,`?拙拿??鈭箄”??${filledMinis}/10 甈歇憛恬??唾膩蝔輸? 150+ 摮);
    }
  });

  // Level 9: Cross-domain essay
  const q9 = $('.q9-text');
  if(q9){
    q9.addEventListener('input',function(){
      const len = this.value.replace(/\s/g,'').length;
      $('#wc9').textContent = len;
    });
  }
  $('#btn-check-9').addEventListener('click',function(){
    const txt = q9;
    const len = txt.value.replace(/\s/g,'').length;
    if(len >= 500){
      showFeedback(9,true,'頝典??游??剛?????蝘飛 x 蝬? x ?怎?銝雁摨行??);
      passLevel(9,10,null);
    } else {
      shake(txt);
      showFeedback(9,false,`?桀? ${len} 摮????500 摮誑銝);
    }
  });

  // Level 10: Metacognition
  $('#btn-check-10').addEventListener('click',function(){
    const texts = $$('.q10-text');
    let total = 0;
    texts.forEach(t => total += t.value.trim().length);
    $('#wc10').textContent = total;
    if(total >= 100){
      showFeedback(10,true,'敺身隤????雿?摮貊?頧?閮??楛摨艾?);
      passLevel(10,5,9);
    } else {
      texts.forEach(t => { if(t.value.trim().length < 20) shake(t); });
      showFeedback(10,false,`?桀? ${total} 摮?銝挾?????100 摮);
    }
  });

  // Level 11: Open reflection + WSA
  $('#btn-check-11').addEventListener('click',function(){
    const texts = $$('.q11-text');
    let total = 0;
    texts.forEach(t => total += t.value.trim().length);
    const wsaCbs = $$('.wsa-cb');
    const wsaChecked = wsaCbs.filter(c => c.checked).length;
    const r1 = texts.find(t=>t.dataset.part==='reflect1');
    const r2 = texts.find(t=>t.dataset.part==='reflect2');
    let ok = true;
    if(r1.value.trim().length < 100){ shake(r1); ok=false; }
    if(r2.value.trim().length < 100){ shake(r2); ok=false; }
    if(wsaChecked < 1) ok = false;
    $('#wc11').textContent = total;
    if(ok){
      showFeedback(11,true,'?券摰?嚗???Level V 敺芰?祆?嚗?);
      passLevel(11,5,null);
    } else {
      showFeedback(11,false,`瘥??? 100+ 摮?WSA ?喳??暸 1 ?);
    }
  });

  // Next buttons
  for(let i=1;i<TOTAL_LEVELS;i++){
    const btn = $(`#btn-next-${i}`);
    if(btn) btn.addEventListener('click', ()=> showLevel(i+1));
  }

  // Word count for Level 10
  $$('.q10-text').forEach(t => {
    t.addEventListener('input',()=>{
      let total = 0;
      $$('.q10-text').forEach(x => total += x.value.trim().length);
      $('#wc10').textContent = total;
    });
  });

  // Word count for Level 11
  $$('.q11-text').forEach(t => {
    t.addEventListener('input',()=>{
      let total = 0;
      $$('.q11-text').forEach(x => total += x.value.trim().length);
      $('#wc11').textContent = total;
    });
  });

})();
</script>
</body>
</html>
