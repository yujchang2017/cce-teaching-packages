  function updateScore(pts){score+=pts;$('#score').textContent=score;}
  function confetti(){const c=['#818cf8','#34d399','#f59e0b','#f87171','#a78bfa'];for(let i=0;i<20;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.borderRadius=Math.random()>.5?'50%':'0';d.style.animationDelay=Math.random()*0.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}}

  };

    const selects=$$('.q3-select');
