<script>
(function(){
  const slides = Array.from(document.querySelectorAll('.slide'));
  const cur    = document.getElementById('navCur');
  if (!slides.length || !cur) return;

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = slides.indexOf(e.target);
        if (i >= 0) cur.textContent = i + 1;
      }
    });
  }, { threshold: 0.5 });
  slides.forEach(s => io.observe(s));

  document.addEventListener('keydown', e => {
    const i = slides.findIndex(s => {
      const r = s.getBoundingClientRect();
      return r.top >= -20 && r.top < window.innerHeight / 2;
    });
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      const next = slides[Math.min(i + 1, slides.length - 1)];
      if (next) next.scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = slides[Math.max(i - 1, 0)];
      if (prev) prev.scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>
