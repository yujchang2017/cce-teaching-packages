      c.style.borderRadius=Math.random()>.5?'50%':'0';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    }
  }
  function wordCount(s){ return s.replace(/\s/g,'').length; }

  for(let i=1;i<totalLevels;i++){
    const btn = document.getElementById('btn-next-'+i);
    if(btn) btn.addEventListener('click', ()=> goLevel(i+1));
  }

  // Word count listeners
  function bindWordCount(sel, spanSel){
    const el = document.querySelector(sel);
    const sp = document.querySelector(spanSel);
    if(el && sp) el.addEventListener('input', ()=> sp.textContent = wordCount(el.value));
  }
  bindWordCount('.q2-text', '.q2-count');
  bindWordCount('.q6-text', '.q6-count');
  bindWordCount('.q8-petition', '.q8-count');
  bindWordCount('.q9-essay', '.q9-count');
  bindWordCount('.q11-reflect1', '.q11-count1');
  bindWordCount('.q11-reflect2', '.q11-count2');

  // Multi-field word count for level 10
  function updateQ10Count(){
    const a = wordCount(document.querySelector('.q10-before')?.value||'');
    const b = wordCount(document.querySelector('.q10-after')?.value||'');
    const c = wordCount(document.querySelector('.q10-turning')?.value||'');
    const sp = document.querySelector('.q10-count');
    if(sp) sp.textContent = a+b+c;
  }
  document.querySelectorAll('.q10-before,.q10-after,.q10-turning').forEach(el=>el.addEventListener('input',updateQ10Count));

  // ===== Level 1 =====
  document.getElementById('btn-check-1').addEventListener('click', function(){
    const inputs = document.querySelectorAll('.q1-input');
    let correct = 0;
    inputs.forEach(inp => {
      const ans = parseFloat(inp.dataset.answer);
      const val = parseFloat(inp.value);
      if(Math.abs(val - ans) <= 3){ inp.style.borderColor='#34d399'; correct++; }
      else { inp.style.borderColor='#ef4444'; inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),500); }
    });
    const pts = Math.round(correct/inputs.length*10);
    addScore(pts);
    document.getElementById('feedback-1').innerHTML = correct === inputs.length
      ? '<span class="text-emerald-400 pop">?銝像蝑??冽迤蝣綽?</span>'
      : '<span class="text-amber-400">'+correct+'/'+inputs.length+' 甇?Ⅱ??獢?隢???dp1, dp4??/span>';
    if(correct >= 3){ unlockBadge(1); confetti(); }
    markDot(1); showNext(1); completed.add(1);
    this.disabled = true;
  });

  // ===== Level 2 =====
  document.getElementById('btn-check-2').addEventListener('click', function(){
    let pts = 0;
    const cbs = document.querySelectorAll('.q2-cb');
    let cbOk = true;
    cbs.forEach(cb => { if(cb.checked !== (cb.dataset.correct === 'true')) cbOk = false; });
    if(cbOk) pts += 3;
    const txt = document.querySelector('.q2-text');
    if(wordCount(txt.value) >= 80) pts += 4; else if(wordCount(txt.value) >= 30) pts += 2;
    const pol = document.querySelector('.q2-policy');
    if(wordCount(pol.value) >= 60) pts += 3; else if(wordCount(pol.value) >= 20) pts += 1;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-2').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?啣?甇?儔??瘛勗嚗漱?扯儘霅雿?</span>'
      : '<span class="text-amber-400">瘜冽?嚗?瘞??憿??憸券??漱?批??? 80+ 摮?/span>';
    unlockBadge(2); markDot(2); showNext(2); completed.add(2);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 3: Drag and drop =====
  let draggedItem3 = null;
  const dragItems3 = document.querySelectorAll('#drag-box-3 .drag-item');
  const dropZones3 = document.querySelectorAll('#dz-adaptable, #dz-irreversible');
  dragItems3.forEach(item => {
    item.addEventListener('dragstart', e => { draggedItem3 = item; item.classList.add('dragging'); e.dataTransfer.setData('text/plain',''); });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
  });
  dropZones3.forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('over');
      if(draggedItem3 && draggedItem3.dataset.match === zone.dataset.accept){
        zone.appendChild(draggedItem3);
        draggedItem3.style.cursor = 'default';
        draggedItem3.draggable = false;
        draggedItem3.style.borderColor = '#34d399';
      } else if(draggedItem3) {
        draggedItem3.classList.add('shake');
        setTimeout(()=>draggedItem3.classList.remove('shake'),500);
      }
    });
  });

  document.getElementById('btn-check-3').addEventListener('click', function(){
    let pts = 0;
    const adaptZone = document.getElementById('dz-adaptable');
    const irrevZone = document.getElementById('dz-irreversible');
    const inAdapt = adaptZone.querySelectorAll('.drag-item');
    const inIrrev = irrevZone.querySelectorAll('.drag-item');
    let correct = 0;
    inAdapt.forEach(i => { if(i.dataset.match === 'adaptable') correct++; });
    inIrrev.forEach(i => { if(i.dataset.match === 'irreversible') correct++; });
    pts += Math.round(correct/6*6);
    const txt = document.querySelector('.q3-text');
    if(wordCount(txt.value) >= 60) pts += 4; else if(wordCount(txt.value) >= 20) pts += 2;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-3').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?仃??摰喳?憿迤蝣綽?蝯??批??雿?</span>'
      : '<span class="text-amber-400">?? '+correct+'/6 甇?Ⅱ?蝔格?蝯???瘝銝????/span>';
    unlockBadge(3); markDot(3); showNext(3); completed.add(3);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 4: CER =====
  document.getElementById('btn-check-4').addEventListener('click', function(){
    let pts = 0;
    const claim = wordCount(document.querySelector('.q4-claim').value);
    const evidence = wordCount(document.querySelector('.q4-evidence').value);
    const reasoning = wordCount(document.querySelector('.q4-reasoning').value);
    const rebuttal = wordCount(document.querySelector('.q4-rebuttal').value);
    if(claim >= 10) pts += 2;
    if(evidence >= 30) pts += 3; else if(evidence >= 15) pts += 1;
    if(reasoning >= 25) pts += 3; else if(reasoning >= 10) pts += 1;
    if(rebuttal >= 25) pts += 2; else if(rebuttal >= 10) pts += 1;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-4').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">瞍??菜葫 CER 隢?摰嚗?斗扳蝘嚗?/span>'
      : '<span class="text-amber-400">CER ?挾???祕????撘 ?? 蝑??????輯?撠???扼?/span>';
    unlockBadge(4); markDot(4); showNext(4); completed.add(4);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 5: Policy =====
  document.getElementById('btn-check-5').addEventListener('click', function(){
    let pts = 0;
    const sels = document.querySelectorAll('.q5-sel');
    let selFilled = 0;
    sels.forEach(s => { if(s.value !== '--') selFilled++; });
    pts += Math.min(selFilled, 4);
    const txts = document.querySelectorAll('.q5-text');
    let textPts = 0;
    txts.forEach(t => { if(wordCount(t.value) >= 30) textPts += 1.5; });
    pts += Math.min(textPts, 6);
    addScore(Math.min(Math.round(pts),10));
    document.getElementById('feedback-5').innerHTML = pts >= 7
      ? '<span class="text-emerald-400 pop">?輻?閰摯蝟餌絞?批撥嚗迤蝢拚???雿?</span>'
      : '<span class="text-amber-400">瘥??輻??迤蝢拚???? 30+ 摮?/span>';
    unlockBadge(5); markDot(5); showNext(5); completed.add(5);
    if(pts >= 7) confetti();
    this.disabled = true;
  });

  // ===== Level 6: Ethics =====
  document.getElementById('btn-check-6').addEventListener('click', function(){
    let pts = 0;
    const sel = document.querySelector('.q6-select');
    if(sel.value) pts += 2;
    const txt = document.querySelector('.q6-text');
    const wc = wordCount(txt.value);
    if(wc >= 100) pts += 4; else if(wc >= 50) pts += 2;
    const reb = document.querySelector('.q6-rebuttal');
    const rc = wordCount(reb.value);
    if(rc >= 80) pts += 4; else if(rc >= 40) pts += 2;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-6').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?怎?颲航??釭?芰???暺???具?擏??唬?嚗?/span>'
      : '<span class="text-amber-400">蝡?∟膩? 100+ 摮?撘?豢?嚗?擏? 80+ 摮?/span>';
    unlockBadge(6); markDot(6); showNext(6); completed.add(6);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 7: System thinking =====
  let draggedItem7 = null;
  const dragItems7 = document.querySelectorAll('#drag-box-7 .drag-item');
  const slots7 = document.querySelectorAll('svg.loop .loop-slot');
  dragItems7.forEach(item => {
    item.addEventListener('dragstart', e => { draggedItem7 = item; item.classList.add('dragging'); e.dataTransfer.setData('text/plain',''); });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
  });
  slots7.forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault(); slot.classList.remove('over');
      if(draggedItem7 && draggedItem7.dataset.match === slot.dataset.accept){
        slot.setAttribute('fill','rgba(52,211,153,.2)');
        slot.setAttribute('stroke','#34d399');
        const txt = slot.nextElementSibling;
        if(txt && txt.tagName === 'text') txt.textContent = draggedItem7.textContent;
        draggedItem7.style.opacity = '0.3'; draggedItem7.draggable = false;
        slot.dataset.filled = 'true';
      } else {
        slot.classList.add('shake'); setTimeout(()=>slot.classList.remove('shake'),500);
      }
    });
  });

  document.getElementById('btn-check-7').addEventListener('click', function(){
    let pts = 0;
    let filledCount = 0;
    slots7.forEach(s => { if(s.dataset.filled === 'true') filledCount++; });
    pts += filledCount * 3;
    const txt = document.querySelector('.q7-text');
    if(wordCount(txt.value) >= 50) pts += 4; else if(wordCount(txt.value) >= 20) pts += 2;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-7').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">蝟餌絞?雿迤蝣箄儘霅迤????獢輸?嚗?/span>'
      : '<span class="text-amber-400">甇文儐?啁甇??擖??芣?撘瑕?嚗?獢輸???賣憭找?蝣喲??隞?辣隡賊? 50+ 摮?/span>';
    unlockBadge(7); markDot(7); showNext(7); completed.add(7);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 8: Deliberation =====
  document.getElementById('btn-check-8').addEventListener('click', function(){
    let pts = 0;
    const sels = document.querySelectorAll('.q8-sel');
    let filled = 0;
    sels.forEach(s => { if(s.value !== '--') filled++; });
    const inputs = document.querySelectorAll('.q8-input');
    let inputFilled = 0;
    inputs.forEach(i => { if(i.value.trim().length > 0) inputFilled++; });
    pts += Math.min(Math.round((filled + inputFilled)/15*5), 5);
    const pet = document.querySelector('.q8-petition');
    const wc = wordCount(pet.value);
    if(wc >= 150) pts += 5; else if(wc >= 80) pts += 3; else if(wc >= 30) pts += 1;
    addScore(Math.min(pts,10));
    document.getElementById('feedback-8').innerHTML = pts >= 8
      ? '<span class="text-emerald-400 pop">?祆?撖抵降??摰嚗?隢??渲牲嚗?/span>'
      : '<span class="text-amber-400">隢‵摰??摰喲?靽犖????? 150+ 摮?/span>';
    unlockBadge(8); markDot(8); showNext(8); completed.add(8);
    if(pts >= 8) confetti();
    this.disabled = true;
  });

  // ===== Level 9: Essay =====
  document.getElementById('btn-check-9').addEventListener('click', function(){
    const essay = document.querySelector('.q9-essay');
    const wc = wordCount(essay.value);
    let pts = 0;
    if(wc >= 500) pts = 10;
    else if(wc >= 350) pts = 7;
    else if(wc >= 200) pts = 4;
    else pts = 2;
    addScore(pts);
    document.getElementById('feedback-9').innerHTML = wc >= 500
      ? '<span class="text-emerald-400 pop">頝典??游??剛?????蝯?摰??霅雓嫘?/span>'
      : '<span class="text-amber-400">?桀? '+wc+' 摮????500+ 摮?蝣箄?鈭挾蝯?摰??/span>';
    unlockBadge(8); markDot(9); showNext(9); completed.add(9);
    if(wc >= 500) confetti();
    this.disabled = true;
  });

  // ===== Level 10: Metacognition =====
  document.getElementById('btn-check-10').addEventListener('click', function(){
    const a = wordCount(document.querySelector('.q10-before').value);
    const b = wordCount(document.querySelector('.q10-after').value);
    const c = wordCount(document.querySelector('.q10-turning').value);
    const total = a+b+c;
    let pts = 0;
    if(total >= 100) pts = 10; else if(total >= 60) pts = 6; else pts = 3;
    addScore(pts);
    document.getElementById('feedback-10').innerHTML = total >= 100
      ? '<span class="text-emerald-400 pop">敺身隤?楛?乒??嗉?霈??啣閬?</span>'
      : '<span class="text-amber-400">?桀? '+total+' 摮?銝挾??? 100+ 摮?/span>';
    markDot(10); showNext(10); completed.add(10);
    if(total >= 100) confetti();
    this.disabled = true;
  });

  // ===== Level 11: Final =====
  document.getElementById('btn-check-11').addEventListener('click', function(){
    let pts = 0;
    const r1 = wordCount(document.querySelector('.q11-reflect1').value);
    const r2 = wordCount(document.querySelector('.q11-reflect2').value);
    if(r1 >= 100) pts += 3; else if(r1 >= 50) pts += 1;
    if(r2 >= 100) pts += 3; else if(r2 >= 50) pts += 1;

    const cats = {gov:false, cur:false, ops:false, com:false};
    document.querySelectorAll('.wsa-cb:checked').forEach(cb => cats[cb.dataset.cat] = true);
    const wsaCount = Object.values(cats).filter(Boolean).length;
    pts += wsaCount;
    addScore(Math.min(pts,10));

    unlockBadge(9); markDot(11); completed.add(11);
    confetti();

    document.getElementById('feedback-11').innerHTML = '<span class="text-emerald-400 pop">?剖?摰?????∴?</span>';

    // Show final
    setTimeout(()=>{
      document.getElementById('level-11').classList.add('hidden-screen');
      const done = document.getElementById('level-done');
      done.classList.remove('hidden-screen');
      document.getElementById('final-score').textContent = score;
      const fb = document.getElementById('final-badges');
      for(let i=1;i<=9;i++){
        const orig = document.getElementById('badge-'+i);
        if(orig && !orig.classList.contains('badge-lock')){
          fb.innerHTML += '<span class="text-2xl pop">'+orig.textContent+'</span>';
        }
      }
      done.scrollIntoView({behavior:'smooth',block:'start'});
      confetti();
    },1500);

    this.disabled = true;
  });
})();
</script>
