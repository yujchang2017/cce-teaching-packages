<script>
(() => {
  const S = { score:0, current:1 };
  const setScore = (n)=>{ S.score += n; document.getElementById('score').textContent = S.score; };
  const goto = (n)=>{
    document.getElementById('level-'+S.current).classList.add('hidden-screen');
    S.current = n;
    const next = document.getElementById('level-'+n) || document.getElementById('level-final');

      const d = document.getElementById('dot-'+i);

      d.classList.remove('active','done');
      if(i < n) d.classList.add('done');
      else if(i === n) d.classList.add('active');
    }
    window.scrollTo({top:0,behavior:'smooth'});
  };
  const confetti = ()=>{
    const colors=['#f59e0b','#10b981','#6366f1','#ec4899','#0ea5e9'];
    for(let i=0;i<40;i++){
      const el=document.createElement('div');
      el.className='confetti';
      el.style.left=Math.random()*100+'vw';
      el.style.background=colors[i%colors.length];
      el.style.animationDelay=(Math.random()*0.6)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2500);
    }
  };
  const wordCount = (text)=> text.replace(/\s/g,'').length;
  const updateWC = (id, textareaId)=>{
    const ta = document.getElementById(textareaId);
    const wc = document.getElementById(id);
    if(ta && wc) ta.addEventListener('input', ()=>{ wc.textContent = wordCount(ta.value)+' 摮?; });
  };
  updateWC('q2-wc','q2-reflect');
  updateWC('q6-wc','q6-ethics');
  updateWC('essay-wc','essay');
  updateWC('m-wc','m-reflect');

  // ===== Drag helper =====
  const setupDrag = (container, zones, onComplete) => {
    let dragged = null;
    container.querySelectorAll('.drag-item').forEach(it=>{
      it.addEventListener('dragstart', e=>{ dragged=it; it.classList.add('dragging'); });
      it.addEventListener('dragend', ()=>{ if(dragged) dragged.classList.remove('dragging'); dragged=null;});
    });
    zones.forEach(z=>{
      z.addEventListener('dragover', e=>{ e.preventDefault(); z.classList.add('over');});
      z.addEventListener('dragleave', ()=>z.classList.remove('over'));
      z.addEventListener('drop', e=>{
        e.preventDefault(); z.classList.remove('over');
        if(!dragged) return;
        const want = z.dataset.accept || z.dataset.slot;
        const got = dragged.dataset.match || dragged.dataset.loop;
        if(String(want)===String(got)){
          dragged.classList.add('pop');
          z.appendChild(dragged);
          dragged.setAttribute('draggable','false');
          dragged.style.cursor='default';
          onComplete && onComplete(true);
        } else {
          z.classList.add('shake');
          setTimeout(()=>z.classList.remove('shake'),400);
          onComplete && onComplete(false);
        }
      });
    });
  };
