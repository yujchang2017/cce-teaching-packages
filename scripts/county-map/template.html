import * as THREE from "three";

// ================= 主題（UNESCO 六大主題） =================
const TH=[null,
 {k:1,name:"氣候科學",hex:"#3b6fb6",icon:"☁️"},
 {k:2,name:"生態系",hex:"#3e9a57",icon:"🌳"},
 {k:3,name:"氣候正義",hex:"#b5527a",icon:"⚖️"},
 {k:4,name:"韌性建構",hex:"#6c7a91",icon:"🏠"},
 {k:5,name:"後碳經濟",hex:"#d39a12",icon:"🌬️"},
 {k:6,name:"永續生活",hex:"#a5703a",icon:"♻️"}];

// ================= 資料 =================
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261121);
const feats=topojson.feature(TOPO,TOPO.objects.counties).features;
feats.forEach(f=>{if(d3.geoArea(f)>2*Math.PI){const g=f.geometry,rev=p=>p.forEach(r=>r.reverse());g.type==="Polygon"?rev(g.coordinates):g.coordinates.forEach(rev)}});
const SHORT=n=>/^(新竹|嘉義)/.test(n)?n:n.replace(/[縣市]$/,"");
const byCity=Object.fromEntries(D0.cities.map(c=>[c.city,c]));

feats.forEach(f=>{

  const lessons=Object.entries(pk).map(([keyId,students])=>({keyId,students,theme:+keyId[0]})).sort((a,b)=>a.keyId.localeCompare(b.keyId,undefined,{numeric:true}));
  const themeN=[0,1,2,3,4,5,6].map(k=>lessons.filter(l=>l.theme===k).length);
  DATA[id]={id,f,name,...c,lessons,themeN,shown:0};
});
const total=D0.totals;

// ================= three.js 基本 =================
const host=document.getElementById("stage");
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e1){try{renderer=new THREE.WebGLRenderer({antialias:false});}catch(e){document.getElementById("nogl").style.display="flex";throw e}}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const labelR=new CSS2DRenderer({element:document.getElementById("labels")});labelR.setSize(innerWidth,innerHeight);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=1.25;controls.minDistance=8;controls.maxDistance=110;
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelR.setSize(innerWidth,innerHeight)});

const grad=new THREE.DataTexture(new Uint8Array([90,170,255]),3,1,THREE.RedFormat);grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const MC={};const toon=c=>MC[c]||(MC[c]=new THREE.MeshToonMaterial({color:c,gradientMap:grad}));
const anims=[];let tweens=[];
const ease={out:k=>1-Math.pow(1-k,3),back:k=>{const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,lin:k=>k};
function tween(dur,fn,e=ease.out,delay=0){return new Promise(res=>tweens.push({t0:performance.now()+delay,dur,fn,e,res}))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function makeWorld(bg){
  const s=new THREE.Scene();s.background=new THREE.Color(bg);s.fog=new THREE.Fog(bg,90,220);
  s.add(new THREE.HemisphereLight(0xffffff,0x9fc8a0,1.6));
  const sun=new THREE.DirectionalLight(0xfff1d6,2.2);sun.position.set(-25,45,30);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:150});s.add(sun);
  const wg=new THREE.PlaneGeometry(260,260,70,70);wg.rotateX(-Math.PI/2);
  const water=new THREE.Mesh(wg,new THREE.MeshToonMaterial({color:0x5cc3e0,gradientMap:grad,transparent:true,opacity:.95}));
  water.position.y=-.35;water.receiveShadow=true;s.add(water);
  const base=wg.attributes.position.array.slice();
  anims.push({obj:water,fn:t=>{const p=wg.attributes.position.array;for(let i=0;i<p.length;i+=3){p[i+1]=Math.sin(base[i]*.18+t*1.3)*.12+Math.cos(base[i+2]*.21+t*1.1)*.12}wg.attributes.position.needsUpdate=true}});
  for(let i=0;i<9;i++){const c=cloudShape(0xffffff,1.4+R()*1.2);c.traverse(o=>o.castShadow=false);c.position.set((R()-.5)*120,14+R()*8,(R()-.5)*90);s.add(c);
    const sp=.6+R();anims.push({obj:c,fn:(t,o)=>{o.position.x+=sp*.02;if(o.position.x>70)o.position.x=-70}})}
  return s;
}
function cloudShape(color,sz){const g=new THREE.Group();[[0,0,0,1],[.9,-.1,0,.75],[-.9,-.1,.1,.8],[.3,.35,.2,.7]].forEach(([x,y,z,r])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r*sz*.5,12,10),toon(color));m.position.set(x*sz*.6,y*sz*.6,z*sz*.6);m.castShadow=true;g.add(m)});return g}

// ================= 卡通道具（6 主題 × 4 階段） =================
const SC=[.55,.75,1,1.25];
function mound(){const m=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),toon(0xb08b5a));m.scale.y=.35;m.receiveShadow=true;return m}
function cast(g){g.traverse(o=>{if(o.isMesh){o.castShadow=true}});return g}
function propCloud(st){const g=new THREE.Group();const col=new THREE.Color(0x5b6270).lerp(new THREE.Color(0xffffff),st/3);
  const c=cloudShape(col.getHex(),st?.55:.75);c.position.y=1.05;g.add(c);
  if(st>=2){const s=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),new THREE.MeshBasicMaterial({color:0xffd24a}));s.position.set(.35,1.35,-.15);g.add(s)}
  g.add(mound());const ph=R()*6;anims.push({obj:c,fn:(t,o)=>o.position.y=1.05+Math.sin(t*1.6+ph)*.08});return cast(g)}
function propTree(st){const g=new THREE.Group();if(!st){g.add(mound());return g}
  const conf=st===1?[[0,0,.22]]:st===2?[[0,0,.38]]:[[-.22,0,.34],[.22,.05,.34],[0,.25,.4]];
  const h=st===1?.3:.5;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,h,8),toon(0x7b5a36));tr.position.y=h/2;g.add(tr);
  conf.forEach(([x,y,r],i)=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),toon(i%2?0x5bb56a:0x3e9a57));m.position.set(x,h+y+r*.5,0);g.add(m)});
  const ph=R()*6;anims.push({obj:g,fn:(t,o)=>o.rotation.z=Math.sin(t*1.8+ph)*.05});return cast(g)}
function propScale(st){const g=new THREE.Group();if(!st){g.add(mound());return g}
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,.8,8),toon(0x8a6d4a));pole.position.y=.4;g.add(pole);
  const beam=new THREE.Group();beam.position.y=.8;g.add(beam);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(.9,.04,.04),toon(0xb5527a));beam.add(bar);
  [-1,1].forEach(sx=>{const pan=new THREE.Mesh(new THREE.CylinderGeometry(.16,.1,.06,12),toon(0xf1c6d6));pan.position.set(sx*.42,-.22,0);beam.add(pan);
    if(st>=2){const b=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),toon(0xffd24a));b.position.set(sx*.42,-.15,0);beam.add(b)}});
  const ph=R()*6;anims.push({obj:beam,fn:(t,o)=>o.rotation.z=Math.sin(t*1.2+ph)*(st>=3?.03:.15)});return cast(g)}
function propHouse(st){const g=new THREE.Group();if(!st){g.add(mound());return g}
  const b=new THREE.Mesh(new THREE.BoxGeometry(.7,.45,.55),toon(0xfff3dc));b.position.y=.23;g.add(b);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(.56,.38,4),toon(0x6c7a91));roof.position.y=.64;roof.rotation.y=Math.PI/4;g.add(roof);
  if(st>=2){const d=new THREE.Mesh(new THREE.BoxGeometry(.14,.22,.02),toon(0x7b5a36));d.position.set(0,.11,.28);g.add(d)}
  if(st>=3){const u=new THREE.Mesh(new THREE.SphereGeometry(.32,12,8,0,Math.PI*2,0,Math.PI/2),toon(0x5cc3e0));u.position.set(.45,1.0,0);g.add(u);
    const st2=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.4),toon(0x555555));st2.position.set(.45,.8,0);g.add(st2)}
  return cast(g)}
function propWind(st){const g=new THREE.Group();if(!st){g.add(mound());return g}
  const h=.7+st*.15;const tw=new THREE.Mesh(new THREE.CylinderGeometry(.025,.05,h,8),toon(0xffffff));tw.position.y=h/2;g.add(tw);
  const hub=new THREE.Group();hub.position.set(0,h,.05);g.add(hub);
  for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.05,.38,.02),toon(0xffffff));b.position.y=.19;const p=new THREE.Group();p.rotation.z=i*Math.PI*2/3;p.add(b);hub.add(p)}
  anims.push({obj:hub,fn:(t,o)=>o.rotation.z=-t*(1+st)});
  for(let i=0;i<st-1;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.42,.03,.28),toon(0x2c4f8f));p.position.set(.45,.2,(i-.5)*.32*(st-1>1));p.rotation.x=-.5;g.add(p)}
  return cast(g)}
function propBin(st){const g=new THREE.Group();if(!st){g.add(mound());const bag=new THREE.Mesh(new THREE.SphereGeometry(.14,8,6),toon(0x555555));bag.position.y=.12;g.add(bag);return cast(g)}
  [0x3b6fb6,0x3e9a57,0xa5703a].slice(0,st).forEach((c,i)=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(.13,.11,.34,10),toon(c));b.position.set((i-(st-1)/2)*.3,.17,0);g.add(b);
    const l=new THREE.Mesh(new THREE.CylinderGeometry(.145,.145,.05,10),toon(0xf2f2f2));l.position.set(b.position.x,.36,0);g.add(l)});

  const wob=geo=>{const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),a=Math.atan2(z,x),f=1+.06*Math.sin(5*a)+.04*Math.sin(3*a+1);p.setX(i,x*f);p.setZ(i,z*f)}geo.computeVertexNormals();return geo};

    const sz=Math.min(1,2.6/Math.sqrt(n+.5));
    ls.forEach((l,j)=>{const r=n===1?0:zr*.62*Math.sqrt((j+.5)/n),ang=j*2.39996;const px=zx+Math.cos(ang)*r,pz=zz+Math.sin(ang)*r;

      tween(900,kk=>holder.scale.setScalar(.001+kk*base),ease.back,400+(k*4+j)*70);
      const pl=document.createElement("div");pl.className="plab";pl.textContent=l.keyId;
      const po=new CSS2DObject(pl);po.position.set(px,top+.2,pz+1.05*sz);s.add(po);

  const plaza=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.3,.12,36),toon(0xfff3dc));plaza.position.set(0,top+.02,0);s.add(plaza);
  const flag=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.4),toon(0x888888));flag.position.set(0,top+1.2,0);s.add(flag);
  const fl=new THREE.Mesh(new THREE.BoxGeometry(1,.6,.02),toon(0x2f9a5a));fl.position.set(.5,top+2.1,0);s.add(fl);anims.push({obj:fl,fn:(t,o)=>o.rotation.y=Math.sin(t*3)*.3});

      anims.push({obj:kid,fn:(t,o)=>{const aa=a+Math.sin(t*sp+ph)*.35;o.position.set(Math.cos(aa)*ri,top+Math.abs(Math.sin(t*6+q))*.15,Math.sin(aa)*ri);o.rotation.y=-aa+(Math.cos(t*sp+ph)>0?0:Math.PI)}})}
  });

function showLabels(s){s.traverse(o=>{if(o.isCSS2DObject)o.element.style.display=""})}
function disposeScene(s){s.traverse(o=>{if(o.isCSS2DObject)o.element.remove();if(o.geometry)o.geometry.dispose()});
  for(let i=anims.length-1;i>=0;i--){let p=anims[i].obj,inS=false;while(p){if(p===s){inS=true;break}p=p.parent}if(inS)anims.splice(i,1)}}
function select(x){const same=sel&&((x.lesson&&sel.lesson===x.lesson)||(x.school&&sel.school===x.school));sel=same?null:x;renderPanel()}

const pkLink=k=>`<a class="pk" style="background:${TH[+k[0]].hex}" href="${SITE}/package/${k}" target="_blank" rel="noopener">${k}</a>`;
function renderPanel(){
  const d=cur,P=document.getElementById("panel");
  let h=`<button class="pback" onclick="goNation()">← 回全國地圖</button><h2>${d.name}</h2>`;
  if(!d.submissions){h+=`<div class="muted">目前還沒有試教紀錄。歡迎${d.name}的學校從<a href="${SITE}" target="_blank" rel="noopener">氣候教育教案網</a>挑一份教案試教，並填寫試教回饋表。</div>`}
  else{
    h+=`<div class="muted">${d.schools.length} 所學校・${d.submissions} 筆試教・${d.students.toLocaleString()} 學生人次・試教過 ${d.lessons.length} 份教案</div>`;
    let list=d.schools;
    if(sel&&sel.lesson){list=d.schools.filter(s=>s.packages.some(p=>p.keyId===sel.lesson));h+=`<h3>試教 ${pkLink(sel.lesson)} 的學校（${list.length}）</h3>`}
    else if(sel&&sel.school){list=d.schools.filter(s=>s.name===sel.school);h+=`<h3>學校成果</h3>`}
    else h+=`<h3>參與學校（${list.length}）</h3>`;
    h+=list.map(s=>`<div class="sch${sel&&sel.school===s.name?" sel":""}"><b>${s.name}</b> <span class="muted">${s.level}</span><br>${s.submissions} 筆試教・${s.students} 學生人次${s.teachers>1?`・${s.teachers} 位老師`:""}<br>${s.packages.map(p=>pkLink(p.keyId)).join("")}${s.note?`<div class="muted" style="font-size:11px">註：${s.note}</div>`:""}</div>`).join("");
    if(sel)h+=`<div class="muted"><a href="#" id="clr">← 看全部學校</a></div>`;
  }
  h+=`<h3>📚 觀摩資源</h3><div class="res">各校自行發展的教材會放在這裡，供其他縣市參考：<br>
    <span class="ty">📖 繪本</span><span class="ty">🧰 教具</span><span class="ty">🏫 WSA 全校式教案</span><span class="ty">🎨 學生作品</span><span class="ty">🔗 網站素材連結</span><br>
    目前尚無投稿。之後學校填「成果投稿表單」提供連結，經計畫團隊審核後會出現在這裡。</div>`;
  P.innerHTML=h;const clr=document.getElementById("clr");if(clr)clr.onclick=e=>{e.preventDefault();sel=null;renderPanel()};
}

// ================= 主迴圈 =================
camera.position.set(0,40,33);controls.target.set(0,0,-1);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(),now=performance.now();
  tweens=tweens.filter(w=>{if(now<w.t0)return true;const k=Math.min(1,(now-w.t0)/w.dur);w.fn(w.e(k));if(k>=1){w.res();return false}return true});
  anims.forEach(a=>a.fn(t,a.obj));
  controls.update();renderer.render(scene,camera);labelR.render(scene,camera);
});
const HP=new URLSearchParams(location.hash.slice(1));
if(HP.get("county")&&DATA[HP.get("county")])enterCounty(HP.get("county"),true);
if(HP.get("play"))setTimeout(()=>document.getElementById("play").click(),1200);
</script>
</body>
